<script>
(function(){
"use strict";
const TAU=Math.PI*2,DEG=Math.PI/180;

/* ---------- params ---------- */
const GRADS={

  crisp:{name:'Crisp 3D',blend:'solid',shading:0.2,bands:2,light:0.9,lightAngle:40,rim:0.6,serration:0.4,bloom:0.22,bloomSize:0.3,opacity:1,edgeSoft:0.1,tipFade:0.6,rootFade:0.1,depthFade:0.75,echo:0,echoAngle:3,bgStyle:'radial',bgA:'#0b0614',bgB:'#000000',grad:'ultraviolet',gradAlong:'both'},

  sheen:{name:'Metal sheen',blend:'glow',light:0.5,lightAngle:40,rim:0.3,serration:0,depthFade:0.4,shading:0.9,bands:3,bloom:0.4,bloomSize:0.4,opacity:0.45,edgeSoft:0.3,tipFade:0.35,rootFade:0.04,echo:4,echoAngle:2.5,bgStyle:'solid',bgA:'#000000',bgB:'#000000',grad:'silver',gradAlong:'blade'}

  opacity:0.32,rootFade:0.08,tipFade:0.55,edgeSoft:0.6,shading:0.15,bands:2,depthFade:0.4,bloom:0.75,bloomSize:0.55,echo:0,echoAngle:3,
  blend:'glow',bgStyle:'radial',bgA:'#0e0820',bgB:'#000000',grain:0.08,

const FORMS={
  spiral:{name:'Spiral fan',desc:'Blades sweeping along a curve',after:{blades:2600,layers:2,turns:0.95,r0:0.35,r1:0.75,height:0.6,tilt:15,twist:0.35,sweep:35,lenStart:0.35,lenEnd:1.6,bladeLen:1.1,width:0.02,tipWidth:0.002,serration:0.55,curl:0.25,jitter:0.2,blend:'solid',grad:'custom',stops:['#0d0320','#3d1590','#7e4ae6','#b99cff','#62e6ff'],gradAlong:'both',gradShift:0.3,rootFade:0.15,tipFade:0.65,light:0.85,lightAngle:30,rim:0.7,shading:0.15,depthFade:0.8,bloom:0.3,bloomSize:0.35,echo:0,bgStyle:'radial',bgA:'#0a0414',bgB:'#000000',grain:0.05,tiltX:-35,orbitY:20,roll:-15,zoom:1.1,posX:0.2,aspect:'16:9'},preset:{look:'crisp',blades:1800,width:0.022,tipWidth:0.002,tiltX:-25,orbitY:10,roll:0,aspect:'4:5'}},
  burst:{name:'Folded burst',desc:'Pleated fans around a core',preset:{look:'sheen',tiltX:0,orbitY:0,roll:0,aspect:'1:1'}}

let P={};
function applyLook(k){const l=LOOKS[k];if(!l)return;for(const key in l){if(key==='name')continue;P[key]=l[key];}P.look=k;applyGrad(l.grad);}

  const keep={pngSize:P.pngSize||BASE.pngSize,vidSize:P.vidSize||BASE.vidSize};
  P=Object.assign({},BASE,{stops:BASE.stops.slice(),kf:{}},FORMS[k].preset,{form:k},keep);applyLook(P.look);
  const af=FORMS[k].after;if(af){for(const key in af)P[key]=Array.isArray(af[key])?af[key].slice():af[key];gradDirty=true;}

/* ---------- three ---------- */
const out=document.getElementById('out'),octx=out.getContext('2d');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setClearColor(0x000000,0);renderer.autoClear=false;
const scene=new THREE.Scene(),group=new THREE.Group();scene.add(group);
const camera=new THREE.PerspectiveCamera(35,1,0.05,100);
const gradData=new Uint8Array(256*4);const gradTex=new THREE.DataTexture(gradData,256,1,THREE.RGBAFormat);
gradTex.wrapS=THREE.MirroredRepeatWrapping;gradTex.wrapT=THREE.ClampToEdgeWrapping;gradTex.magFilter=THREE.LinearFilter;gradTex.minFilter=THREE.LinearFilter;gradTex.generateMipmaps=false;
let gradDirty=true;
function updateGrad(){const st=P.stops.map(h=>new THREE.Color(h));const n=st.length;
  for(let i=0;i<256;i++){const u=i/255*(n-1),a=Math.min(n-1,Math.floor(u)),b=Math.min(n-1,a+1),w=u-a;const c=st[a].clone().lerp(st[b],w);
    gradData[i*4]=Math.round(c.r*255);gradData[i*4+1]=Math.round(c.g*255);gradData[i*4+2]=Math.round(c.b*255);gradData[i*4+3]=255;}
  gradTex.needsUpdate=true;gradDirty=false;}
const VS=`attribute float aT;attribute float aS;attribute float aX;attribute float aA;attribute vec3 nrm;
uniform float uShade,uBands,uLight;uniform vec3 uL;varying float vT,vS,vX,vA,vD,vI;
void main(){vT=aT;vS=aS;vX=aX;vA=aA;vec4 wp=modelMatrix*vec4(position,1.0);vec3 n=normalize(mat3(modelMatrix)*nrm);vec3 v=normalize(cameraPosition-wp.xyz);
float d=abs(dot(n,v));float band=0.5+0.5*cos(d*uBands*6.2831+aS*3.0);float spec=pow(d,8.0);
vec3 L=normalize(uL);float df=abs(dot(n,L));vec3 hv=normalize(L+v);float sp=pow(abs(dot(n,hv)),28.0);float lit=0.06+0.95*df+sp*1.4;

const FS=`precision highp float;uniform sampler2D uGrad;uniform float uWB,uWF,uShift,uOp,uRoot,uTip,uEdge,uMul,uDepth,uCamD,uRim,uSolid;varying float vT,vS,vX,vA,vD,vI;

float fade=smoothstep(0.0,uRoot+0.001,vT)*(1.0-smoothstep(1.0-uTip-0.001,1.0,vT));
float ax=min(1.0,abs(vX));float edge=1.0-pow(ax,mix(10.0,1.0,uEdge));

if(uSolid>0.5){if(vA<0.03)discard;gl_FragColor=vec4(col*mix(0.06,1.0,fade)*uMul*min(1.0,vA),1.0);}
else{float a=uOp*uMul*vA*fade*edge;gl_FragColor=vec4(col,clamp(a,0.0,1.0));}}`;
const mat=new THREE.ShaderMaterial({vertexShader:VS,fragmentShader:FS,transparent:true,depthTest:false,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,
  uniforms:{uGrad:{value:gradTex},uWB:{value:1},uWF:{value:0},uShift:{value:0},uOp:{value:0.3},uRoot:{value:0.1},uTip:{value:0.5},uEdge:{value:0.5},uMul:{value:1},uDepth:{value:0.4},uCamD:{value:6},uShade:{value:0},uBands:{value:2},uLight:{value:0.9},uL:{value:new THREE.Vector3(0.6,0.6,0.5)},uRim:{value:0.5},uSolid:{value:1}}});
let geo=new THREE.BufferGeometry();const mesh=new THREE.Mesh(geo,mat);mesh.frustumCulled=false;group.add(mesh);

/* ---------- structure ---------- */
const SEG=14;let S=null,needBuild=true;
function buildStruct(){
  const rng=mulberry(P.seed*31+7);let B,fans=null;

  else{const F=Math.max(1,P.fans|0),n=Math.max(3,P.perFan|0);B=F*n;fans=[];
    for(let f=0;f<F;f++){let x,y,z,l;do{x=rng()*2-1;y=rng()*2-1;z=rng()*2-1;l=x*x+y*y+z*z;}while(l>1||l<1e-3);l=Math.sqrt(l);
      fans.push({r:[x/l,y/l,z/l],a:rng()*TAU,base:f/F*TAU,sc:rng(),tw:rng()*2-1});}}

  const V=(SEG+1)*2,NV=B*V;
  const s=new Float32Array(B),h1=new Float32Array(B),h2=new Float32Array(B),h3=new Float32Array(B),lay=new Uint8Array(B),fi=new Uint16Array(B),fu=new Float32Array(B);
  for(let b=0;b<B;b++){h1[b]=rng();h2[b]=rng();h3[b]=rng();
    if(P.form==='spiral'){const L=Math.max(1,P.layers|0);lay[b]=b%L;const k=Math.floor(b/L),per=Math.ceil(B/L);s[b]=per>1?k/(per-1):0;}
    else{const n=Math.max(3,P.perFan|0);fi[b]=Math.floor(b/n);fu[b]=(b%n)/(n-1);s[b]=(fi[b]+fu[b])/Math.max(1,P.fans|0);}}
  const aT=new Float32Array(NV),aS=new Float32Array(NV),aX=new Float32Array(NV);
  for(let b=0;b<B;b++)for(let k=0;k<=SEG;k++)for(let e=0;e<2;e++){const v=b*V+k*2+e;aT[v]=k/SEG;aS[v]=s[b]+(lay[b]||0)*0.33;aX[v]=e?1:-1;}
  const idx=new Uint32Array(B*SEG*6);let q=0;
  for(let b=0;b<B;b++)for(let k=0;k<SEG;k++){const o=b*V+k*2;idx[q++]=o;idx[q++]=o+1;idx[q++]=o+2;idx[q++]=o+1;idx[q++]=o+3;idx[q++]=o+2;}
  geo.dispose();geo=new THREE.BufferGeometry();mesh.geometry=geo;
  const pos=new Float32Array(NV*3),nrm=new Float32Array(NV*3),aA=new Float32Array(NV);
  const dyn=(arr,n)=>{const a=new THREE.BufferAttribute(arr,n);a.setUsage(THREE.DynamicDrawUsage);return a;};
  geo.setAttribute('position',dyn(pos,3));geo.setAttribute('nrm',dyn(nrm,3));geo.setAttribute('aA',dyn(aA,1));
  geo.setAttribute('aT',new THREE.BufferAttribute(aT,1));geo.setAttribute('aS',new THREE.BufferAttribute(aS,1));geo.setAttribute('aX',new THREE.BufferAttribute(aX,1));

}

/* ---------- per-frame geometry ---------- */
let t=0,phase=0,MP=0;
function timeX(){return((t%P.dur)+P.dur)%P.dur/P.dur;}
function timeline(){const x=timeX();const p=P.playMode==='pingpong'?(x<0.5?x*2:2-x*2):P.playMode==='hold'?Math.min(1,x/0.8):x;return ease(P.easing,p);}
function norm(v){const l=Math.hypot(v[0],v[1],v[2])||1;v[0]/=l;v[1]/=l;v[2]/=l;return v;}
function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}

function compute(){
  const{B,V,s,h1,h2,h3,lay,fi,fu,fans,pos,nrm,aA}=S;const ph=phase,p=MP,sc=P.scale;
  const mo=P.motion,st=P.stagger,str=P.strength;const breathe=1+P.breathe*0.25*Math.sin(ph);
  for(let b=0;b<B;b++){
    let R,D,T,L,w0=P.width,w1=P.tipWidth;
    const key=P.motionDir==='end'?1-s[b]:P.motionDir==='center'?Math.abs(s[b]-0.5)*2:P.motionDir==='random'?h3[b]:s[b];
    let loc=1,ang=1,alpha=1,lenM=1,off=0,wave=0;
    if(mo!=='none'){
      const l=ss(0,1,p*(1+st)-key*st);
      if(mo==='unfurl'){lenM=Math.max(0.001,l);alpha=ss(0,0.15,l);}
      else if(mo==='sweep'){ang=l;alpha=ss(0,0.1,l)*0.6+0.4*l;}
      else if(mo==='scatter'){off=l*str*1.8;alpha=1-l*0.85;}
      else if(mo==='gather'){off=(1-l)*str*1.8;alpha=1-(1-l)*0.85;}
      else if(mo==='wave'){const w=0.08+0.2*st,c=p*(1+2*w)-w;wave=Math.exp(-Math.pow((key-c)/w,2))*str;lenM=1+wave*0.6;alpha=1+wave*1.2;}

      const rad=[ca,sa,0],tan=[-sa,ca,0],Z=[0,0,1];
      const phi=(P.tilt+P.twist*360*sb)*DEG*ang+P.flutter*0.5*Math.sin(ph+sb*TAU*2+ly)+(h1[b]-0.5)*P.jitter*0.4;
      D=[rad[0]*Math.cos(phi)+Z[0]*Math.sin(phi),rad[1]*Math.cos(phi)+Z[1]*Math.sin(phi),Math.sin(phi)];
      D=norm(rotAxis(D,Z,P.sweep*DEG*ang));T=tan;

    }else{
      const F=fans[fi[b]],u=fu[b];const nF=norm([F.r[0]*P.spread,F.r[1]*P.spread,1-P.spread+F.r[2]*P.spread*0.3]);

      const D0=[e1[0]*Math.cos(al)+e2[0]*Math.sin(al),e1[1]*Math.cos(al)+e2[1]*Math.sin(al),e1[2]*Math.cos(al)+e2[2]*Math.sin(al)];

      R=[D0[0]*P.hole,D0[1]*P.hole,D0[2]*P.hole];const ed=2*u-1;

    if(off>0){const r=[h1[b]-0.5,h2[b]-0.5,h3[b]-0.5];R=[R[0]+(D[0]+r[0])*off,R[1]+(D[1]+r[1])*off,R[2]+(D[2]+r[2])*off];}
    const cu=P.curl*(0.6+0.8*h3[b])*L;const o=b*V;

/* ---------- render ---------- */
let RW=800,RH=1000,needRender=true,resizeNeeded=true;
function aspectWH(){const[a,b]=P.aspect.split(':').map(Number);return a/b;}

function fitPreview(){const wrap=document.getElementById('wrap'),cs=getComputedStyle(wrap);

  case 'note':{const p=document.createElement('p');p.className='note';p.textContent=it.l;return p;}
  case 'sub':{const p=document.createElement('p');p.className='sub';p.textContent=it.l;return p;}
  case 'status':{const p=document.createElement('p');p.className='status';p.setAttribute('role','status');statusEl=p;return p;}
  }
  return el;
}
function renderPanel(){
  const root=document.getElementById('sections');const sc=root.parentElement.scrollTop;root.innerHTML='';
  for(const sec of sections()){const d=document.createElement('details');d.open=!!openState[sec.id];d.addEventListener('toggle',()=>{openState[sec.id]=d.open;});
    const s=document.createElement('summary');s.textContent=sec.title;d.append(s);const body=document.createElement('div');body.className='body';
    for(const it of sec.items){if(it.show&&!it.show())continue;body.append(control(it));}d.append(body);root.append(d);}
  root.parentElement.scrollTop=sc;document.getElementById('fmname').textContent='/ '+FORMS[P.form].name;
}
function renderForms(){const root=document.getElementById('forms');root.innerHTML='';
  for(const[k,f]of Object.entries(FORMS)){const b=document.createElement('button');b.type='button';b.className='fm';b.setAttribute('aria-pressed',P.form===k);
    b.innerHTML='<b></b><small></small>';b.querySelector('b').textContent=f.name;b.querySelector('small').textContent=f.desc;b.addEventListener('click',()=>{if(!recording)applyForm(k);});root.append(b);}}
function syncPlay(){document.getElementById('play').textContent=playing?'Pause':'Play';}
document.getElementById('play').addEventListener('click',()=>{if(recording)return;playing=!playing;syncPlay();needRender=true;});
scrub.addEventListener('input',()=>{if(recording)return;playing=false;syncPlay();t=scrub.value/1000*P.dur;needRender=true;});
document.getElementById('reset').addEventListener('click',()=>{if(!recording)applyForm(P.form);});
document.getElementById('shuffle').addEventListener('click',()=>{
  if(recording)return;const r=Math.random,rs=(a,b,s)=>+(Math.round((a+r()*(b-a))/s)*s).toFixed(4);
  P.seed=1+Math.floor(r()*998);P.curl=rs(-0.6,0.6,0.01);P.jitter=rs(0,0.6,0.01);
  for(const it of formItems())if(!STRUCT.has(it.k))P[it.k]=rs(it.min+(it.max-it.min)*0.1,it.min+(it.max-it.min)*0.6,it.step);
  const gk=Object.keys(GRADS);if(r()<0.5)applyGrad(gk[Math.floor(r()*gk.length)]);
  needBuild=true;needRender=true;renderPanel();});
let drag=null;
out.addEventListener('pointerdown',e=>{if(recording)return;drag={x:e.clientX,y:e.clientY,o:P.orbitY,tl:P.tiltX};out.setPointerCapture(e.pointerId);});
out.addEventListener('pointermove',e=>{if(!drag)return;P.orbitY=Math.max(-180,Math.min(180,drag.o+(e.clientX-drag.x)*0.4));P.tiltX=Math.max(-180,Math.min(180,drag.tl+(e.clientY-drag.y)*0.4));syncVal('orbitY');syncVal('tiltX');needRender=true;});
const endDrag=()=>{drag=null;};out.addEventListener('pointerup',endDrag);out.addEventListener('pointercancel',endDrag);
window.addEventListener('resize',()=>{resizeNeeded=true;needRender=true;});


/* ---------- presets (mine + team) ---------- */
function makePresets(cfg){
  const LS='studio-presets.'+cfg.key,NAME='studio-person';let mine=[];
  try{mine=JSON.parse(localStorage.getItem(LS)||'[]');if(!Array.isArray(mine))mine=[];}catch(e){mine=[];}
  let team=[],teamState='idle',tab='mine',open=true,armed=null,msg='',busy=false;
  const box=document.getElementById('presets');const clone=o=>JSON.parse(JSON.stringify(o));
  const persist=()=>{try{localStorage.setItem(LS,JSON.stringify(mine));return true;}catch(e){msg='Couldn’t store presets in this browser. Use Export to keep them.';return false;}};
  const getName=()=>{try{return localStorage.getItem(NAME)||'';}catch(e){return'';}};
  const setName=v=>{try{localStorage.setItem(NAME,v);}catch(e){}};
  async function api(method,body,qs){const r=await fetch('api/presets?tool='+encodeURIComponent(cfg.key)+(qs||''),{method,credentials:'same-origin',headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
    let j={};try{j=await r.json();}catch(e){}if(!r.ok)throw new Error(j.error||('Request failed ('+r.status+')'));return j;}
  async function loadTeam(){if(location.protocol==='file:'){teamState='off';render();return;}teamState='loading';render();
    try{const j=await api('GET');team=j.presets||[];teamState='ok';}catch(e){teamState='error';msg=e.message;}render();}
  function apply(pr){try{cfg.restore(clone(pr));msg='Applied '+pr.name+'.';}catch(e){msg='That preset couldn’t be applied.';}armed=null;render();}
  async function save(name){
    const snap=Object.assign({name,tool:cfg.key,at:Date.now()},cfg.snapshot());
    if(tab==='mine'){const i=mine.findIndex(p=>p.name===name);if(i>=0){mine[i]=snap;msg='Updated '+name+'.';}else{mine.push(snap);msg='Saved '+name+'.';}persist();render();return;}
    const by=getName().trim();if(!by){msg='Add your name first, so the team knows who saved it.';render();return;}
    snap.by=by;busy=true;msg='Saving to team…';render();
    try{const j=await api('POST',{preset:snap});const old=team.filter(p=>p.name===name&&p.by===by);
      for(const o of old){try{await api('DELETE',null,'&id='+encodeURIComponent(o.id));}catch(e){}}
      team=team.filter(p=>!old.includes(p)).concat([j.preset]);msg=(old.length?'Updated ':'Shared ')+name+' with the team.';}
    catch(e){msg=e.message;}busy=false;render();
  }
  async function remove(ix){
    if(tab==='mine'){const p=mine[ix];mine.splice(ix,1);persist();msg='Deleted '+p.name+'.';armed=null;render();return;}
    const p=team[ix];busy=true;render();
    try{await api('DELETE',null,'&id='+encodeURIComponent(p.id));team.splice(ix,1);msg='Deleted '+p.name+' from team presets.';}catch(e){msg=e.message;}
    busy=false;armed=null;render();
  }
  function render(){
    box.innerHTML='';const d=document.createElement('details');d.open=open;d.addEventListener('toggle',()=>{open=d.open;});
    const s=document.createElement('summary');s.textContent='Presets';d.append(s);const body=document.createElement('div');body.className='body';
    const tabs=document.createElement('div');tabs.className='ptabs';tabs.setAttribute('role','group');tabs.setAttribute('aria-label','Preset library');
    for(const[k,l]of[['mine','Mine'+(mine.length?' '+mine.length:'')],['team','Team'+(teamState==='ok'&&team.length?' '+team.length:'')]]){
      const b=document.createElement('button');b.type='button';b.textContent=l;b.setAttribute('aria-pressed',tab===k);
      b.addEventListener('click',()=>{tab=k;armed=null;msg='';if(k==='team'&&teamState==='idle')loadTeam();else render();});tabs.append(b);}
    body.append(tabs);
    const list=tab==='mine'?mine:team;const chips=document.createElement('div');chips.className='pchips';
    const note=t=>{const p=document.createElement('p');p.className='note';p.textContent=t;chips.append(p);};
    if(tab==='team'&&teamState==='loading')note('Loading team presets…');
    else if(tab==='team'&&teamState==='off')note('Team presets work on the hosted site. Here you can use Mine, or Export and Import files.');
    else if(tab==='team'&&teamState==='error')note('Team presets couldn’t load.');
    else if(!list.length)note(tab==='mine'?'No presets yet. Set things up, name it, and save.':'No team presets yet. Save one here to share it.');
    list.forEach((pr,ix)=>{const c=document.createElement('span');c.className='pchip';
      const a=document.createElement('button');a.type='button';a.textContent=pr.name;a.title='Apply '+pr.name+(pr.by?' (saved by '+pr.by+')':'');
      if(pr.by){const sm=document.createElement('small');sm.textContent=pr.by;a.append(sm);}
      a.addEventListener('click',()=>apply(pr));
      const x=document.createElement('button');x.type='button';x.className='del'+(armed===ix?' arm':'');x.textContent=armed===ix?'delete?':'×';x.setAttribute('aria-label','Delete '+pr.name);x.disabled=busy;
      x.addEventListener('click',()=>{if(armed===ix)remove(ix);else{armed=ix;render();}});c.append(a,x);chips.append(c);});
    body.append(chips);
    const canTeam=!(tab==='team'&&teamState!=='ok');
    if(tab==='team'&&teamState==='ok'){const r=document.createElement('div');r.className='prow';const n=document.createElement('input');n.type='text';n.placeholder='Your name';n.value=getName();n.setAttribute('aria-label','Your name');
      n.addEventListener('input',()=>setName(n.value));r.append(n);body.append(r);}
    if(tab==='team'&&teamState==='error'){const rb=document.createElement('button');rb.type='button';rb.className='btn';rb.textContent='Try again';rb.addEventListener('click',loadTeam);body.append(rb);}
    if(canTeam){const row=document.createElement('div');row.className='prow';const inp=document.createElement('input');inp.type='text';inp.placeholder='Preset name';inp.setAttribute('aria-label','Preset name');
      const sv=document.createElement('button');sv.type='button';sv.className='btn';sv.textContent=tab==='mine'?'Save':'Share';sv.disabled=busy;
      const go=()=>{if(busy)return;const name=(inp.value||'').trim()||('Preset '+(list.length+1));armed=null;save(name);};
      sv.addEventListener('click',go);inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});row.append(inp,sv);body.append(row);}
    if(tab==='mine'){const row2=document.createElement('div');row2.className='prow two';
      const ex=document.createElement('button');ex.type='button';ex.className='btn';ex.textContent='Export';ex.disabled=!mine.length;
      ex.addEventListener('click',()=>{saveFile(cfg.key+'-presets.json',new Blob([JSON.stringify({tool:cfg.key,version:1,presets:mine},null,1)],{type:'application/json'}));msg='Exported '+mine.length+' preset'+(mine.length===1?'':'s')+'.';render();});
      const im=document.createElement('button');im.type='button';im.className='btn';im.textContent='Import';
      const fi=document.createElement('input');fi.type='file';fi.accept='application/json,.json';fi.hidden=true;im.addEventListener('click',()=>fi.click());
      fi.addEventListener('change',()=>{const f=fi.files&&fi.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);const arr=Array.isArray(data)?data:data.presets;
          if(!Array.isArray(arr))throw 0;if(data.tool&&data.tool!==cfg.key){msg='Those presets are for '+data.tool+', not this tool.';render();return;}
          let n=0;for(const p of arr){if(!p||!p.P)continue;const i=mine.findIndex(q=>q.name===p.name);if(i>=0)mine[i]=p;else mine.push(p);n++;}
          persist();msg='Imported '+n+' preset'+(n===1?'':'s')+'.';}catch(e){msg='That file isn’t a presets file.';}render();};r.readAsText(f);fi.value='';});
      row2.append(ex,im,fi);body.append(row2);}
    const st=document.createElement('p');st.className='note';st.setAttribute('role','status');st.textContent=msg;body.append(st);
    d.append(body);box.append(d);
  }
  render();
}
function loadImgURL(url,cb){const im=new Image();im.onload=()=>{const cv=document.createElement('canvas');cv.width=im.width;cv.height=im.height;cv.getContext('2d').drawImage(im,0,0);cb(cv);};im.src=url;}
P=Object.assign({},BASE);applyForm('spiral');syncPlay();
makePresets({key:'flare-studio',
  snapshot:()=>({P:JSON.parse(JSON.stringify(P))}),
  restore:s=>{if(recording)return;P=Object.assign({},BASE,s.P);P.stops=(P.stops||BASE.stops).slice();P.kf=P.kf||{};selKey={};
    gradDirty=true;needBuild=true;needRender=true;resizeNeeded=true;renderForms();renderPanel();}});

requestAnimationFrame(tick);
})();
</script>
