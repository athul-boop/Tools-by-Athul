<html lang="en">
<head>
<meta charset="utf-8">

<title>Pin · Tools by Athul</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>
<header class="top">
  <a class="brand" href="./" title="All tools"><svg width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><g stroke="currentColor" stroke-width="2.4" fill="none"><path d="M8 26 L16 6 L24 26"/><path d="M11 19 H21"/></g></svg>Tools</a><span class="crumb">/</span><span class="tname">Pin</span>
  <span class="dims" id="dims"></span>
  <span class="spacer"></span>
  <button class="btn icon" id="bUndo" type="button" title="Undo (Ctrl or Cmd + Z)" aria-label="Undo" disabled><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 3 L2 6 L5 9"/><path d="M2 6 H9 a3 3 0 0 1 0 6 H6"/></svg></button>
  <button class="btn icon" id="bRedo" type="button" title="Redo (Shift + Ctrl or Cmd + Z)" aria-label="Redo" disabled><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" transform="scale(-1,1)"><path d="M5 3 L2 6 L5 9"/><path d="M2 6 H9 a3 3 0 0 1 0 6 H6"/></svg></button>
  <span class="sep"></span>
  
  <button class="btn" id="bPresets" type="button" aria-haspopup="true" aria-expanded="false">Presets</button>
  <button class="btn" id="reset" type="button">Reset</button>
  <span class="sep"></span>
  <button class="btn" id="bPng" type="button">PNG</button>
  <button class="btn solid" id="bMp4" type="button">Video</button>
  <div class="menu" id="menu" hidden><div id="presets"></div></div>
</header>
<aside class="panel" id="panel" aria-label="Settings">
  <div class="drop" id="drop" role="button" tabindex="0"><b>Drop an image here</b>or click to upload. Bright areas push pins forward.</div>
  <div id="sections"></div>
</aside>
<section class="stage" id="wrap"><canvas id="out" aria-label="Pin preview. Click to move the vanishing point."></canvas><div class="stage-meta" id="stat"></div></section>
<section class="tl" aria-label="Timeline">
  <div class="tl-bar">
    <button class="btn icon" id="tStart" type="button" title="Go to start" aria-label="Go to start"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="1" width="1.5" height="10" fill="currentColor"/><path d="M11 1 L4 6 L11 11Z" fill="currentColor"/></svg></button>
    <button class="btn icon" id="tPrev" type="button" title="Previous frame" aria-label="Previous frame"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M9 1 L3 6 L9 11Z" fill="currentColor"/></svg></button>
    <button class="btn icon" id="play" type="button" title="Play (space)" aria-label="Play"></button>
    <button class="btn icon" id="tNext" type="button" title="Next frame" aria-label="Next frame"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 1 L9 6 L3 11Z" fill="currentColor"/></svg></button>
    <span class="time" id="kTime"></span>
    <label class="tl-field">Length <input class="num" id="kDur" type="number" min="0.5" max="120" step="0.5"> s</label>
    <label class="tl-field">Rate <select id="kFps"><option>24</option><option>25</option><option selected>30</option><option>50</option><option>60</option></select></label>
    <div class="insp" id="kInsp" hidden>
      <span class="name" id="kName"></span>
      <input class="num" id="kVal" type="number" step="any" title="Key value" aria-label="Key value">
      <select id="kEase" title="Easing to next key" aria-label="Easing to next key"><option value="linear">Linear</option><option value="in">Ease in</option><option value="out">Ease out</option><option value="inout">Ease in out</option><option value="back">Overshoot</option><option value="step">Hold</option></select>
      <button class="btn sm" id="kAll" type="button" title="Use this easing on every key of this setting">Apply to all</button>
      <button class="btn sm" id="kDel" type="button">Delete key</button>
    </div>
  </div>
  <div class="tl-body" id="tlBody"></div>
</section>
<input type="range" id="scrub" hidden aria-hidden="true"><output id="time" hidden></output>
<div class="toast" id="toast" role="status"></div>

<input type="file" id="file" accept="image/*" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const TAU=Math.PI*2;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

  for(let i=0;i<256;i++){const u=i/255*(n-1),a=Math.min(n-1,Math.floor(u)),b=Math.min(n-1,a+1),w=u-a;const c=st[a].clone().lerp(st[b],w);o[i*3]=c.r*255;o[i*3+1]=c.g*255;o[i*3+2]=c.b*255;}return o;}

/* ---------- params ---------- */
const PRESETS={
  cobalt:{name:'Cobalt (reference)',stops:['#0a1a6b','#2f6bff','#a9c8ff','#ffffff'],gstops:['#000000','#7a2a05','#ff7a1f','#ffd39a'],dotCol:'#ffb02e',bgA:'#000000',bgB:'#0b2a9e'},
  ember:{name:'Ember',stops:['#2a0500','#c2300a','#ff9a3d','#fff1d6'],gstops:['#000000','#3a0a40','#a23cff','#f0c8ff'],dotCol:'#fff1c2',bgA:'#000000',bgB:'#2a0606'},
  mono:{name:'Mono',stops:['#1a1a1d','#6a6a72','#d8d8de','#ffffff'],gstops:['#000000','#2a2a2e','#8a8a92','#e6e6ea'],dotCol:'#ffffff',bgA:'#000000',bgB:'#141416'},
  toxic:{name:'Toxic',stops:['#002a16','#00a35c','#8dffb8','#f2fff6'],gstops:['#000000','#1d0a4a','#5a2bff','#c8b8ff'],dotCol:'#e8ff3d',bgA:'#000000',bgB:'#001a10'},
  rose:{name:'Rose',stops:['#2a0418','#c21f6b','#ff8fc4','#fff0f7'],gstops:['#000000','#06304a','#1fa2ff','#bfe8ff'],dotCol:'#ffd1e6',bgA:'#000000',bgB:'#2a0418'}
};
const BASE={
  preset:'cobalt',stops:PRESETS.cobalt.stops.slice(),gstops:PRESETS.cobalt.gstops.slice(),dotCol:'#ffb02e',bgA:'#000000',bgB:'#0b2a9e',
  fit:'cover',imgScale:0.9,imgX:0,imgY:0,invert:false,contrast:1.3,bright:0,gamma:1,smooth:0.4,
  cols:42,heightAmt:0.75,baseH:0.06,lens:2.4,vpX:0,vpY:0,leanX:0,leanY:0,zoom:1,
  baseW:2,tipW:9,gradSrc:'pin',imgMix:0,opacity:0.85,baseFade:0.15,tipFade:0.1,soft:0.55,
  streak:2.6,streakOp:0.35,dotSize:7,dotOp:1,dotAt:'tip',
  underlay:0.8,underBlur:0.5,bloom:0.6,bloomSize:0.5,grain:0.06,vignette:0.35,
  dur:6,breathe:0.15,wave:0.2,waveFreq:2,drift:0,
  motion:'none',motionFrom:'center',stagger:0.8,strength:1,playMode:'pingpong',easing:'inout',
  kf:{},aspect:'3:4',pngSize:3000,vidSize:1920
};
let P={};
function resetAll(){const keep={pngSize:P.pngSize||BASE.pngSize,vidSize:P.vidSize||BASE.vidSize,aspect:P.aspect||BASE.aspect};
  P=Object.assign({},BASE,{stops:BASE.stops.slice(),gstops:BASE.gstops.slice(),kf:{}},keep);selKey={};gradDirty=true;needGrid=true;underDirty=true;needBG=true;renderPanel();}
function applyPreset(k){const p=PRESETS[k];if(!p)return;P.preset=k;P.stops=p.stops.slice();P.gstops=p.gstops.slice();P.dotCol=p.dotCol;P.bgA=p.bgA;P.bgB=p.bgB;gradDirty=true;underDirty=true;needBG=true;}

/* ---------- image source ---------- */
let SRC=null;
function setSrcFromCanvas(cv){const d=cv.getContext('2d').getImageData(0,0,cv.width,cv.height).data;SRC={w:cv.width,h:cv.height,d};needGrid=true;underDirty=true;}
function defaultFace(){
  const cv=document.createElement('canvas');cv.width=400;cv.height=500;const c=cv.getContext('2d');c.fillStyle='#000';c.fillRect(0,0,400,500);
  const rg=(x,y,r,stops)=>{const g=c.createRadialGradient(x,y,0,x,y,r);stops.forEach(([o,col])=>g.addColorStop(o,col));return g;};
  c.save();c.translate(200,250);c.scale(1,1.3);c.fillStyle=rg(0,-8,150,[[0,'#f2f2f2'],[0.6,'#b8b8b8'],[0.85,'#5a5a5a'],[1,'rgba(0,0,0,0)']]);c.beginPath();c.arc(0,-8,150,0,TAU);c.fill();c.restore();
  c.fillStyle=rg(200,145,110,[[0,'rgba(255,255,255,.35)'],[1,'rgba(255,255,255,0)']]);c.fillRect(0,0,400,500);
  for(const x of[140,260]){c.save();c.translate(x,228);c.scale(1.6,1);c.fillStyle=rg(0,0,30,[[0,'rgba(0,0,0,.9)'],[0.7,'rgba(0,0,0,.5)'],[1,'rgba(0,0,0,0)']]);c.beginPath();c.arc(0,0,30,0,TAU);c.fill();c.restore();}
  c.save();c.translate(200,280);c.scale(0.45,1.6);c.fillStyle=rg(0,0,50,[[0,'rgba(255,255,255,.9)'],[1,'rgba(255,255,255,0)']]);c.beginPath();c.arc(0,0,50,0,TAU);c.fill();c.restore();
  c.save();c.translate(200,368);c.scale(2.4,0.6);c.fillStyle=rg(0,0,26,[[0,'rgba(0,0,0,.8)'],[1,'rgba(0,0,0,0)']]);c.beginPath();c.arc(0,0,26,0,TAU);c.fill();c.restore();
  for(const x of[120,280]){c.fillStyle=rg(x,310,55,[[0,'rgba(255,255,255,.25)'],[1,'rgba(255,255,255,0)']]);c.fillRect(0,0,400,500);}
  setSrcFromCanvas(cv);
}
function loadFile(f){if(!f||!/^image\//.test(f.type)){status('That isn’t an image file.');return;}
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,512/Math.max(im.width,im.height));const cv=document.createElement('canvas');
    cv.width=Math.max(4,Math.round(im.width*s));cv.height=Math.max(4,Math.round(im.height*s));const c=cv.getContext('2d');c.fillStyle='#000';c.fillRect(0,0,cv.width,cv.height);c.drawImage(im,0,0,cv.width,cv.height);
    setSrcFromCanvas(cv);SRC.url=cv.toDataURL('image/jpeg',0.9);needRender=true;status('Loaded '+f.name);};im.onerror=()=>status('That image couldn’t be read.');im.src=r.result;};r.readAsDataURL(f);}
// world → image sample
function imgBox(asp){const ia=SRC.w/SRC.h;let iw,ih;const fw=2*asp,fh=2;
  if(P.fit==='cover'){if(ia>fw/fh){ih=fh;iw=fh*ia;}else{iw=fw;ih=fw/ia;}}else{if(ia>fw/fh){iw=fw;ih=fw/ia;}else{ih=fh;iw=fh*ia;}}
  return{iw:iw*P.imgScale,ih:ih*P.imgScale,ox:P.imgX*asp,oy:P.imgY};}
function sampleAt(x,y,box,out){const u=(x-box.ox)/box.iw+0.5,v=0.5-(y-box.oy)/box.ih;if(u<0||u>1||v<0||v>1){out[0]=out[1]=out[2]=0;out[3]=0;return false;}
  const px=Math.min(SRC.w-1,Math.floor(u*SRC.w)),py=Math.min(SRC.h-1,Math.floor(v*SRC.h)),i=(py*SRC.w+px)*4,d=SRC.d;out[0]=d[i]/255;out[1]=d[i+1]/255;out[2]=d[i+2]/255;out[3]=d[i+3]/255;return true;}
function adjust(l){let v=(l-0.5)*P.contrast+0.5+P.bright;v=Math.min(1,Math.max(0,v));v=Math.pow(v,P.gamma);return P.invert?1-v:v;}

/* ---------- three ---------- */
const out=document.getElementById('out'),octx=out.getContext('2d');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setClearColor(0x000000,0);renderer.autoClear=false;
const scene=new THREE.Scene();const camera=new THREE.OrthographicCamera(0,1,0,1,-10,10);
const gData=new Uint8Array(256*4);const gTex=new THREE.DataTexture(gData,256,1,THREE.RGBAFormat);gTex.magFilter=THREE.LinearFilter;gTex.minFilter=THREE.LinearFilter;gTex.wrapS=THREE.ClampToEdgeWrapping;gTex.generateMipmaps=false;
let gradDirty=true;function updateGrad(){const l=lutFrom(P.stops);for(let i=0;i<256;i++){gData[i*4]=l[i*3];gData[i*4+1]=l[i*3+1];gData[i*4+2]=l[i*3+2];gData[i*4+3]=255;}gTex.needsUpdate=true;gradDirty=false;}
const VS=`attribute vec2 aB;attribute vec2 aP;attribute float aT;attribute float aX;attribute float aV;attribute vec3 aCol;
uniform float uMode,uWB,uWT,uDot,uDotTip;varying float vT,vX,vV,vL;varying vec3 vCol;
void main(){vec2 d=aP-aB;float L=length(d);vec2 dir=L>0.0001?d/L:vec2(0.0,-1.0);vec2 n=vec2(-dir.y,dir.x);vec2 p;
if(uMode>1.5){vec2 c=mix(aB,aP,uDotTip);p=c+vec2(aT*2.0-1.0,aX)*uDot*0.5;}
else{float w=mix(uWB,uWT,aT);p=mix(aB,aP,aT)+n*aX*w*0.5+dir*(aT*2.0-1.0)*w*0.3;}
vT=aT;vX=aX;vV=aV;vCol=aCol;vL=L;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,0.0,1.0);}`;
const FS=`precision highp float;uniform sampler2D uGrad;uniform float uMode,uSrc,uImg,uOp,uBF,uTF,uSoft;uniform vec3 uDotCol;varying float vT,vX,vV,vL;varying vec3 vCol;
void main(){
if(uMode>1.5){float d=length(vec2(vT*2.0-1.0,vX));float a=smoothstep(1.0,0.3,d);vec3 c=mix(uDotCol,vCol,uImg*0.6);gl_FragColor=vec4(c+pow(1.0-d,4.0)*0.6,a*uOp);return;}
float u=uSrc<0.5?vT:(uSrc<1.5?vV:vT*vV);vec3 c=texture2D(uGrad,vec2(u,0.5)).rgb;c=mix(c,vCol*(0.5+vT),uImg);

a*=1.0-pow(min(1.0,abs(vX)),mix(10.0,1.0,uSoft));a*=clamp(vL/4.0,0.0,1.0);
gl_FragColor=vec4(c,clamp(a,0.0,1.0));}`;
const mat=new THREE.ShaderMaterial({vertexShader:VS,fragmentShader:FS,transparent:true,depthTest:false,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,
  uniforms:{uGrad:{value:gTex},uMode:{value:1},uWB:{value:2},uWT:{value:8},uDot:{value:6},uDotTip:{value:1},uSrc:{value:0},uImg:{value:0},uOp:{value:1},uBF:{value:0.1},uTF:{value:0.1},uSoft:{value:0.5},uDotCol:{value:new THREE.Color()}}});
let geo=new THREE.BufferGeometry();const mesh=new THREE.Mesh(geo,mat);mesh.frustumCulled=false;scene.add(mesh);

/* ---------- grid ---------- */
let G=null,needGrid=true;const M=1.1;
function aspectWH(){const[a,b]=P.aspect.split(':').map(Number);return a/b;}
function buildGrid(){
  const asp=aspectWH(),cols=Math.max(4,P.cols|0),sp=2*asp*M/cols;let rows=Math.max(2,Math.round(2*M/sp));let N=cols*rows;
  const bx=new Float32Array(N),by=new Float32Array(N),v=new Float32Array(N),col=new Float32Array(N*3),rad=new Float32Array(N),rnd=new Float32Array(N);
  const box=imgBox(asp),s=[0,0,0,0],rng=mulberry(7);const k=1+Math.round(P.smooth*4);const maxR=Math.hypot(asp,1);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const i=r*cols+c;const x=-asp*M+(c+0.5)*sp,y=M-(r+0.5)*sp;bx[i]=x;by[i]=y;
    let sl=0,sr=0,sg=0,sb=0,n=0,inside=0;
    for(let a=0;a<k;a++)for(let b=0;b<k;b++){const ox=k>1?(a/(k-1)-0.5)*sp*(0.6+P.smooth*1.6):0,oy=k>1?(b/(k-1)-0.5)*sp*(0.6+P.smooth*1.6):0;
      if(sampleAt(x+ox,y+oy,box,s)){inside++;sl+=(0.299*s[0]+0.587*s[1]+0.114*s[2]);sr+=s[0];sg+=s[1];sb+=s[2];}n++;}
    v[i]=inside?adjust(sl/inside)*(inside/n):0;col[i*3]=inside?sr/inside:0;col[i*3+1]=inside?sg/inside:0;col[i*3+2]=inside?sb/inside:0;
    rad[i]=Math.hypot(x,y)/maxR;rnd[i]=rng();}
  const NV=N*4;const aT=new Float32Array(NV),aX=new Float32Array(NV),aV=new Float32Array(NV),aCol=new Float32Array(NV*3);const idx=new Uint32Array(N*6);
  const C=[[0,-1],[0,1],[1,-1],[1,1]];
  for(let i=0;i<N;i++){for(let q=0;q<4;q++){const vi=i*4+q;aT[vi]=C[q][0];aX[vi]=C[q][1];aV[vi]=v[i];aCol[vi*3]=col[i*3];aCol[vi*3+1]=col[i*3+1];aCol[vi*3+2]=col[i*3+2];}
    const o=i*4,j=i*6;idx[j]=o;idx[j+1]=o+1;idx[j+2]=o+2;idx[j+3]=o+1;idx[j+4]=o+3;idx[j+5]=o+2;}
  geo.dispose();geo=new THREE.BufferGeometry();mesh.geometry=geo;
  const aB=new Float32Array(NV*2),aP=new Float32Array(NV*2),pos=new Float32Array(NV*3);
  const dyn=(arr,n)=>{const a=new THREE.BufferAttribute(arr,n);a.setUsage(THREE.DynamicDrawUsage);return a;};
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('aB',dyn(aB,2));geo.setAttribute('aP',dyn(aP,2));
  geo.setAttribute('aT',new THREE.BufferAttribute(aT,1));geo.setAttribute('aX',new THREE.BufferAttribute(aX,1));geo.setAttribute('aV',new THREE.BufferAttribute(aV,1));geo.setAttribute('aCol',new THREE.BufferAttribute(aCol,3));
  geo.setIndex(new THREE.BufferAttribute(idx,1));
  G={N,cols,rows,bx,by,v,rad,rnd,aB,aP,asp};needGrid=false;
}

/* ---------- underlay glow ---------- */
const under=document.createElement('canvas'),underB=document.createElement('canvas');let underDirty=true;
function buildUnder(){
  const asp=aspectWH(),uw=220,uh=Math.max(8,Math.round(uw/asp));under.width=uw;under.height=uh;const c=under.getContext('2d');const img=c.createImageData(uw,uh);
  const box=imgBox(asp),s=[0,0,0,0],lut=lutFrom(P.gstops);
  for(let y=0;y<uh;y++)for(let x=0;x<uw;x++){const wx=(x/(uw-1)*2-1)*asp*M,wy=(1-y/(uh-1)*2)*M;const p=(y*uw+x)*4;
    if(sampleAt(wx,wy,box,s)){const v=adjust(0.299*s[0]+0.587*s[1]+0.114*s[2]);const li=Math.round(v*255)*3;img.data[p]=lut[li];img.data[p+1]=lut[li+1];img.data[p+2]=lut[li+2];img.data[p+3]=255;}
    else{img.data[p+3]=0;}}
  c.putImageData(img,0,0);underB.width=uw;underB.height=uh;const b=underB.getContext('2d');b.clearRect(0,0,uw,uh);
  const r=1+P.underBlur*10;if('filter' in b){b.filter='blur('+r.toFixed(1)+'px)';b.drawImage(under,0,0);b.filter='none';}else b.drawImage(under,0,0);underDirty=false;
}

/* ---------- per-frame ---------- */
let t=0,phase=0,MP=0;
function timeX(){return((t%P.dur)+P.dur)%P.dur/P.dur;}
function timeline(){const x=timeX();const p=P.playMode==='pingpong'?(x<0.5?x*2:2-x*2):P.playMode==='hold'?Math.min(1,x/0.8):x;return ease(P.easing,p);}
function compute(W,H){
  const{N,bx,by,v,rad,rnd,aB,aP,asp}=G;const ph=phase,p=MP;const S=H/2*P.zoom,cx=W/2,cy=H/2;const D=Math.max(0.3,P.lens);
  const vpx=(P.vpX+P.drift*0.25*Math.cos(ph))*asp,vpy=P.vpY+P.drift*0.25*Math.sin(ph);
  const br=1+P.breathe*0.3*Math.sin(ph),mo=P.motion,st=P.stagger,str=P.strength,from=P.motionFrom;
  for(let i=0;i<N;i++){
    let h=(P.baseH+P.heightAmt*v[i])*br+P.wave*0.12*Math.sin(rad[i]*P.waveFreq*TAU-ph);
    if(mo!=='none'){
      const key=from==='center'?rad[i]:from==='edges'?1-rad[i]:from==='top'?(1-(by[i]/M+1)/2):from==='bottom'?(by[i]/M+1)/2:from==='bright'?1-v[i]:rnd[i];

/* ---------- kit: shared shell, keyframe timeline, undo ---------- */
const KDUR=('dur' in BASE)?'dur':'loop';

const KSTRUCT=(typeof STRUCT!=='undefined')?STRUCT:new Set();
let kSel=null,kFps=30,KCFG=null;
const $k=id=>document.getElementById(id);
function kEase(n,u){u=Math.min(1,Math.max(0,u));switch(n){case 'in':return u*u*u;case 'out':return 1-Math.pow(1-u,3);case 'inout':return u<0.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;case 'step':return u<1?0:1;case 'back':{const c=1.70158,v=u-1;return 1+(c+1)*v*v*v+c*v*v;}default:return u;}}

  for(let j=0;j<ks.length-1;j++){const a=ks[j],b=ks[j+1];if(x<=b.t){const u=(x-a.t)/((b.t-a.t)||1);return a.v+(b.v-a.v)*kEase(a.e,u);}}return ks[ks.length-1].v;}
function kX(){return timeX();}
function kKfable(k){return !!k&&!KNOKF.has(k)&&!KSTRUCT.has(k)&&typeof BASE[k]==='number';}
function kDef(k){for(const sec of sections())for(const it of sec.items)if(it.t==='range'&&it.k===k)return it;return null;}
function kSort(tr){tr.keys.sort((a,b)=>a.t-b.t);}
function kKeyAt(tr){const tol=0.5/(kDur()*kFps);return tr.keys.findIndex(q=>Math.abs(q.t-kX())<=tol);}
function kCur(k){return P.kf&&P.kf[k]?kVal(P.kf[k],kX()):P[k];}
function kFmt(v,step){const d=step<1?Math.min(4,(String(step).split('.')[1]||'').length):0;return(+v).toFixed(d);}
function toast(msg){const t0=$k('toast');if(!t0)return;t0.textContent=msg;t0.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t0.classList.remove('show'),2200);}

/* one slider row: diamond, label, number, slider */

  const row=document.createElement('div');row.className='row range'+(anim?' animated':'');if(k&&!it.get)row.dataset.row=k;
  const kb=document.createElement('button');kb.type='button';kb.className='kf'+(can?'':' none')+(anim?' anim':'')+(anim&&kKeyAt(P.kf[k])>=0?' on':'');
  if(can){kb.title=anim?'Add or remove a key here':'Animate this setting';kb.setAttribute('aria-label',(anim?'Key for ':'Animate ')+it.l);kb.addEventListener('click',()=>kDiamond(k));}
  const lab=document.createElement('span');lab.className='lab';lab.textContent=it.l;lab.title=it.l;
  const num=document.createElement('input');num.type='number';num.className='num';num.step=it.step;num.min=it.min;num.max=it.max;num.setAttribute('aria-label',it.l+' value');
  const sl=document.createElement('input');sl.type='range';sl.min=it.min;sl.max=it.max;sl.step=it.step;sl.setAttribute('aria-label',it.l);
  const cur=it.get?it.get():kCur(k);sl.value=cur;num.value=kFmt(cur,it.step);
  if(k&&!it.get){sl.dataset.k=k;}
  const apply=v=>{if(isNaN(v))return;if(it.setv){it.setv(v);return;}if(P.kf&&P.kf[k])kAutoKey(k,v);else set(k,v);};

function kfEditor(){return document.createElement('div');}
function kAutoKey(k,v){const tr=P.kf[k];const i=kKeyAt(tr);if(i>=0){tr.keys[i].v=v;kSel={k,i};}else{tr.keys.push({t:kX(),v,e:'inout'});kSort(tr);kSel={k,i:kKeyAt(tr)};}
  needRender=true;kMarkRow(k);kTL();kCommit();}

  if(!tr){P.kf[k]={keys:[{t:kX(),v:P[k],e:'inout'}]};kSel={k,i:0};}
  else{const i=kKeyAt(tr);if(i>=0){tr.keys.splice(i,1);if(!tr.keys.length){delete P.kf[k];kSel=null;}else kSel=null;}
    else{tr.keys.push({t:kX(),v:kVal(tr,kX()),e:'inout'});kSort(tr);kSel={k,i:kKeyAt(tr)};}}
  needRender=true;renderPanel();kCommit();}

  row.classList.toggle('animated',!!tr);if(kb){kb.classList.toggle('anim',!!tr);kb.classList.toggle('on',!!tr&&kKeyAt(tr)>=0);}});}

  const sl=row.querySelector('input[type=range]'),num=row.querySelector('.num');if(document.activeElement!==sl&&document.activeElement!==num){sl.value=v;num.value=kFmt(v,+sl.step);}});kMarkRow(k);}}
// keep sliders in step when something else changes a value (drag on canvas etc.)
syncVal=function(k){document.querySelectorAll('[data-row="'+k+'"]').forEach(row=>{const sl=row.querySelector('input[type=range]'),num=row.querySelector('.num');sl.value=P[k];num.value=kFmt(P[k],+sl.step);});};

/* timeline */
function kSetTime(sec){const d=kDur();t=Math.max(0,Math.min(d-1e-4,sec));playing=false;syncPlay();needRender=true;kUI(true);}
function kTL(){
  const body=$k('tlBody');if(!body)return;body.innerHTML='';const inner=document.createElement('div');inner.className='tl-inner';
  const head=document.createElement('div');head.className='tl-row head';const hl=document.createElement('div');hl.className='tl-label';hl.innerHTML='<span>Keyframes</span>';

  for(let s=0;s<d+1e-6;s+=step){const tk=document.createElement('span');tk.className='tick';tk.style.left=(s/d*100)+'%';tk.textContent=(+s.toFixed(1))+'s';ruler.append(tk);}

    const x=document.createElement('button');x.type='button';x.className='x';x.textContent='×';x.title='Stop animating '+nm.textContent;x.setAttribute('aria-label',x.title);
    x.addEventListener('click',()=>{delete P.kf[k];if(kSel&&kSel.k===k)kSel=null;needRender=true;renderPanel();kCommit();});lb.append(nm,x);
    const lane=document.createElement('div');lane.className='lane';
    tr.keys.forEach((q,i)=>{const kd=document.createElement('div');kd.className='key'+(kSel&&kSel.k===k&&kSel.i===i?' sel':'');kd.style.left=(q.t*100)+'%';kd.title=(q.t*d).toFixed(2)+'s';
      kd.addEventListener('pointerdown',e=>{e.stopPropagation();kSel={k,i};kd.setPointerCapture(e.pointerId);const r=lane.getBoundingClientRect();let moved=false;
        const mv=ev=>{moved=true;q.t=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width));kd.style.left=(q.t*100)+'%';needRender=true;};
        const up=()=>{kd.removeEventListener('pointermove',mv);kd.removeEventListener('pointerup',up);kSort(tr);kSel={k,i:tr.keys.indexOf(q)};if(!moved){t=q.t*d;playing=false;syncPlay();}needRender=true;kTL();kInsp();renderPanelSoft();if(moved)kCommit();};

    lane.addEventListener('dblclick',e=>{const r=lane.getBoundingClientRect();const f=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));tr.keys.push({t:f,v:kVal(tr,f),e:'inout'});kSort(tr);
      kSel={k,i:tr.keys.findIndex(q=>q.t===f)};needRender=true;kTL();kCommit();});

function kInsp(){const box=$k('kInsp');if(!box)return;const tr=kSel&&P.kf&&P.kf[kSel.k];const q=tr&&tr.keys[kSel.i];

function kCommit(){if(kApplying)return;clearTimeout(kTimer);kTimer=setTimeout(()=>{const s=JSON.stringify(P);if(s===kLast)return;if(kLast){kHist.push(kLast);if(kHist.length>80)kHist.shift();}kFut=[];kLast=s;kUndoUI();},300);}

  snapshot:()=>({P:JSON.parse(JSON.stringify(P)),media:SRC&&SRC.url?{url:SRC.url}:null}),

    const done=()=>{gradDirty=true;underDirty=true;needGrid=true;needRender=true;resizeNeeded=true;renderPanel();};
    if(s.media&&s.media.url)loadImgURL(s.media.url,cv=>{setSrcFromCanvas(cv);SRC.url=s.media.url;done();});else{defaultFace();done();}}});
