<body>
<div class="app">

  </aside>
</div>
<input type="file" id="file" accept="image/*" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const TAU=Math.PI*2;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function ease(n,u){u=Math.min(1,Math.max(0,u));switch(n){case 'in':return u*u*u;case 'out':return 1-Math.pow(1-u,3);case 'inout':return u<0.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;case 'step':return u<1?0:1;case 'back':{const c=1.70158,v=u-1;return 1+(c+1)*v*v*v+c*v*v;}default:return u;}}
function lutFrom(stops){const st=stops.map(h=>new THREE.Color(h)),n=st.length,o=new Uint8Array(256*3);
  for(let i=0;i<256;i++){const u=i/255*(n-1),a=Math.min(n-1,Math.floor(u)),b=Math.min(n-1,a+1),w=u-a;const c=st[a].clone().lerp(st[b],w);o[i*3]=c.r*255;o[i*3+1]=c.g*255;o[i*3+2]=c.b*255;}return o;}

/* ---------- params ---------- */
const PRESETS={
  cobalt:{name:'Cobalt (reference)',stops:['#0a1a6b','#2f6bff','#a9c8ff','#ffffff'],gstops:['#000000','#7a2a05','#ff7a1f','#ffd39a'],dotCol:'#ffb02e',bgA:'#000000',bgB:'#0b2a9e'},
  ember:{name:'Ember',stops:['#2a0500','#c2300a','#ff9a3d','#fff1d6'],gstops:['#000000','#3a0a40','#a23cff','#f0c8ff'],dotCol:'#fff1c2',bgA:'#000000',bgB:'#2a0606'},
  mono:{name:'Mono',stops:['#1a1a1d','#6a6a72','#d8d8de','#ffffff'],gstops:['#000000','#2a2a2e','#8a8a92','#e6e6ea'],dotCol:'#ffffff',bgA:'#000000',bgB:'#141416'},
  toxic:{name:'Toxic',stops:['#002a16','#00a35c','#8dffb8','#f2fff6'],gstops:['#000000','#1d0a4a','#5a2bff','#c8b8ff'],dotCol:'#e8ff3d',bgA:'#000000',bgB:'#001a10'},
  rose:{name:'Rose',stops:['#2a0418','#c21f6b','#ff8fc4','#fff0f7'],gstops:['#000000','#06304a','#1fa2ff','#bfe8ff'],dotCol:'#ffd1e6',bgA:'#000000',bgB:'#2a0418'}
};
const BASE={
  preset:'cobalt',stops:PRESETS.cobalt.stops.slice(),gstops:PRESETS.cobalt.gstops.slice(),dotCol:'#ffb02e',bgA:'#000000',bgB:'#0b2a9e',
  fit:'cover',imgScale:0.9,imgX:0,imgY:0,invert:false,contrast:1.3,bright:0,gamma:1,smooth:0.4,
  cols:42,heightAmt:0.75,baseH:0.06,lens:2.4,vpX:0,vpY:0,leanX:0,leanY:0,zoom:1,
  baseW:2,tipW:9,gradSrc:'pin',imgMix:0,opacity:0.85,baseFade:0.15,tipFade:0.1,soft:0.55,
  streak:2.6,streakOp:0.35,dotSize:7,dotOp:1,dotAt:'tip',
  underlay:0.8,underBlur:0.5,bloom:0.6,bloomSize:0.5,grain:0.06,vignette:0.35,
  dur:6,breathe:0.15,wave:0.2,waveFreq:2,drift:0,

  kf:{},aspect:'3:4',pngSize:3000,vidSize:1920

let P={};
function resetAll(){const keep={pngSize:P.pngSize||BASE.pngSize,vidSize:P.vidSize||BASE.vidSize,aspect:P.aspect||BASE.aspect};
  P=Object.assign({},BASE,{stops:BASE.stops.slice(),gstops:BASE.gstops.slice(),kf:{}},keep);selKey={};gradDirty=true;needGrid=true;underDirty=true;needBG=true;renderPanel();}
function applyPreset(k){const p=PRESETS[k];if(!p)return;P.preset=k;P.stops=p.stops.slice();P.gstops=p.gstops.slice();P.dotCol=p.dotCol;P.bgA=p.bgA;P.bgB=p.bgB;gradDirty=true;underDirty=true;needBG=true;}

/* ---------- image source ---------- */
let SRC=null;
function setSrcFromCanvas(cv){const d=cv.getContext('2d').getImageData(0,0,cv.width,cv.height).data;SRC={w:cv.width,h:cv.height,d};needGrid=true;underDirty=true;}
function defaultFace(){
  const cv=document.createElement('canvas');cv.width=400;cv.height=500;const c=cv.getContext('2d');c.fillStyle='#000';c.fillRect(0,0,400,500);
  const rg=(x,y,r,stops)=>{const g=c.createRadialGradient(x,y,0,x,y,r);stops.forEach(([o,col])=>g.addColorStop(o,col));return g;};
  c.save();c.translate(200,250);c.scale(1,1.3);c.fillStyle=rg(0,-8,150,[[0,'#f2f2f2'],[0.6,'#b8b8b8'],[0.85,'#5a5a5a'],[1,'rgba(0,0,0,0)']]);c.beginPath();c.arc(0,-8,150,0,TAU);c.fill();c.restore();
  c.fillStyle=rg(200,145,110,[[0,'rgba(255,255,255,.35)'],[1,'rgba(255,255,255,0)']]);c.fillRect(0,0,400,500);
  for(const x of[140,260]){c.save();c.translate(x,228);c.scale(1.6,1);c.fillStyle=rg(0,0,30,[[0,'rgba(0,0,0,.9)'],[0.7,'rgba(0,0,0,.5)'],[1,'rgba(0,0,0,0)']]);c.beginPath();c.arc(0,0,30,0,TAU);c.fill();c.restore();}
  c.save();c.translate(200,280);c.scale(0.45,1.6);c.fillStyle=rg(0,0,50,[[0,'rgba(255,255,255,.9)'],[1,'rgba(255,255,255,0)']]);c.beginPath();c.arc(0,0,50,0,TAU);c.fill();c.restore();
  c.save();c.translate(200,368);c.scale(2.4,0.6);c.fillStyle=rg(0,0,26,[[0,'rgba(0,0,0,.8)'],[1,'rgba(0,0,0,0)']]);c.beginPath();c.arc(0,0,26,0,TAU);c.fill();c.restore();
  for(const x of[120,280]){c.fillStyle=rg(x,310,55,[[0,'rgba(255,255,255,.25)'],[1,'rgba(255,255,255,0)']]);c.fillRect(0,0,400,500);}
  setSrcFromCanvas(cv);
}
function loadFile(f){if(!f||!/^image\//.test(f.type)){status('That isn’t an image file.');return;}
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,512/Math.max(im.width,im.height));const cv=document.createElement('canvas');
    cv.width=Math.max(4,Math.round(im.width*s));cv.height=Math.max(4,Math.round(im.height*s));const c=cv.getContext('2d');c.fillStyle='#000';c.fillRect(0,0,cv.width,cv.height);c.drawImage(im,0,0,cv.width,cv.height);
    setSrcFromCanvas(cv);SRC.url=cv.toDataURL('image/jpeg',0.9);needRender=true;status('Loaded '+f.name);};im.onerror=()=>status('That image couldn’t be read.');im.src=r.result;};r.readAsDataURL(f);}
// world → image sample
function imgBox(asp){const ia=SRC.w/SRC.h;let iw,ih;const fw=2*asp,fh=2;
  if(P.fit==='cover'){if(ia>fw/fh){ih=fh;iw=fh*ia;}else{iw=fw;ih=fw/ia;}}else{if(ia>fw/fh){iw=fw;ih=fw/ia;}else{ih=fh;iw=fh*ia;}}
  return{iw:iw*P.imgScale,ih:ih*P.imgScale,ox:P.imgX*asp,oy:P.imgY};}
function sampleAt(x,y,box,out){const u=(x-box.ox)/box.iw+0.5,v=0.5-(y-box.oy)/box.ih;if(u<0||u>1||v<0||v>1){out[0]=out[1]=out[2]=0;out[3]=0;return false;}
  const px=Math.min(SRC.w-1,Math.floor(u*SRC.w)),py=Math.min(SRC.h-1,Math.floor(v*SRC.h)),i=(py*SRC.w+px)*4,d=SRC.d;out[0]=d[i]/255;out[1]=d[i+1]/255;out[2]=d[i+2]/255;out[3]=d[i+3]/255;return true;}
function adjust(l){let v=(l-0.5)*P.contrast+0.5+P.bright;v=Math.min(1,Math.max(0,v));v=Math.pow(v,P.gamma);return P.invert?1-v:v;}

/* ---------- three ---------- */
const out=document.getElementById('out'),octx=out.getContext('2d');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setClearColor(0x000000,0);renderer.autoClear=false;
const scene=new THREE.Scene();const camera=new THREE.OrthographicCamera(0,1,0,1,-10,10);
const gData=new Uint8Array(256*4);const gTex=new THREE.DataTexture(gData,256,1,THREE.RGBAFormat);gTex.magFilter=THREE.LinearFilter;gTex.minFilter=THREE.LinearFilter;gTex.wrapS=THREE.ClampToEdgeWrapping;gTex.generateMipmaps=false;
let gradDirty=true;function updateGrad(){const l=lutFrom(P.stops);for(let i=0;i<256;i++){gData[i*4]=l[i*3];gData[i*4+1]=l[i*3+1];gData[i*4+2]=l[i*3+2];gData[i*4+3]=255;}gTex.needsUpdate=true;gradDirty=false;}
const VS=`attribute vec2 aB;attribute vec2 aP;attribute float aT;attribute float aX;attribute float aV;attribute vec3 aCol;
uniform float uMode,uWB,uWT,uDot,uDotTip;varying float vT,vX,vV,vL;varying vec3 vCol;
void main(){vec2 d=aP-aB;float L=length(d);vec2 dir=L>0.0001?d/L:vec2(0.0,-1.0);vec2 n=vec2(-dir.y,dir.x);vec2 p;
if(uMode>1.5){vec2 c=mix(aB,aP,uDotTip);p=c+vec2(aT*2.0-1.0,aX)*uDot*0.5;}
else{float w=mix(uWB,uWT,aT);p=mix(aB,aP,aT)+n*aX*w*0.5+dir*(aT*2.0-1.0)*w*0.3;}
vT=aT;vX=aX;vV=aV;vCol=aCol;vL=L;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,0.0,1.0);}`;
const FS=`precision highp float;uniform sampler2D uGrad;uniform float uMode,uSrc,uImg,uOp,uBF,uTF,uSoft;uniform vec3 uDotCol;varying float vT,vX,vV,vL;varying vec3 vCol;

if(uMode>1.5){float d=length(vec2(vT*2.0-1.0,vX));float a=smoothstep(1.0,0.3,d);vec3 c=mix(uDotCol,vCol,uImg*0.6);gl_FragColor=vec4(c+pow(1.0-d,4.0)*0.6,a*uOp);return;}

a*=1.0-pow(min(1.0,abs(vX)),mix(10.0,1.0,uSoft));a*=clamp(vL/4.0,0.0,1.0);
gl_FragColor=vec4(c,clamp(a,0.0,1.0));}`;
const mat=new THREE.ShaderMaterial({vertexShader:VS,fragmentShader:FS,transparent:true,depthTest:false,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,
  uniforms:{uGrad:{value:gTex},uMode:{value:1},uWB:{value:2},uWT:{value:8},uDot:{value:6},uDotTip:{value:1},uSrc:{value:0},uImg:{value:0},uOp:{value:1},uBF:{value:0.1},uTF:{value:0.1},uSoft:{value:0.5},uDotCol:{value:new THREE.Color()}}});
let geo=new THREE.BufferGeometry();const mesh=new THREE.Mesh(geo,mat);mesh.frustumCulled=false;scene.add(mesh);

/* ---------- grid ---------- */
let G=null,needGrid=true;const M=1.1;
function aspectWH(){const[a,b]=P.aspect.split(':').map(Number);return a/b;}
function buildGrid(){
  const asp=aspectWH(),cols=Math.max(4,P.cols|0),sp=2*asp*M/cols;let rows=Math.max(2,Math.round(2*M/sp));let N=cols*rows;
  const bx=new Float32Array(N),by=new Float32Array(N),v=new Float32Array(N),col=new Float32Array(N*3),rad=new Float32Array(N),rnd=new Float32Array(N);
  const box=imgBox(asp),s=[0,0,0,0],rng=mulberry(7);const k=1+Math.round(P.smooth*4);const maxR=Math.hypot(asp,1);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const i=r*cols+c;const x=-asp*M+(c+0.5)*sp,y=M-(r+0.5)*sp;bx[i]=x;by[i]=y;
    let sl=0,sr=0,sg=0,sb=0,n=0,inside=0;
    for(let a=0;a<k;a++)for(let b=0;b<k;b++){const ox=k>1?(a/(k-1)-0.5)*sp*(0.6+P.smooth*1.6):0,oy=k>1?(b/(k-1)-0.5)*sp*(0.6+P.smooth*1.6):0;
      if(sampleAt(x+ox,y+oy,box,s)){inside++;sl+=(0.299*s[0]+0.587*s[1]+0.114*s[2]);sr+=s[0];sg+=s[1];sb+=s[2];}n++;}
    v[i]=inside?adjust(sl/inside)*(inside/n):0;col[i*3]=inside?sr/inside:0;col[i*3+1]=inside?sg/inside:0;col[i*3+2]=inside?sb/inside:0;
    rad[i]=Math.hypot(x,y)/maxR;rnd[i]=rng();}
  const NV=N*4;const aT=new Float32Array(NV),aX=new Float32Array(NV),aV=new Float32Array(NV),aCol=new Float32Array(NV*3);const idx=new Uint32Array(N*6);
  const C=[[0,-1],[0,1],[1,-1],[1,1]];
  for(let i=0;i<N;i++){for(let q=0;q<4;q++){const vi=i*4+q;aT[vi]=C[q][0];aX[vi]=C[q][1];aV[vi]=v[i];aCol[vi*3]=col[i*3];aCol[vi*3+1]=col[i*3+1];aCol[vi*3+2]=col[i*3+2];}
    const o=i*4,j=i*6;idx[j]=o;idx[j+1]=o+1;idx[j+2]=o+2;idx[j+3]=o+1;idx[j+4]=o+3;idx[j+5]=o+2;}
  geo.dispose();geo=new THREE.BufferGeometry();mesh.geometry=geo;

  geo.setAttribute('aT',new THREE.BufferAttribute(aT,1));geo.setAttribute('aX',new THREE.BufferAttribute(aX,1));geo.setAttribute('aV',new THREE.BufferAttribute(aV,1));geo.setAttribute('aCol',new THREE.BufferAttribute(aCol,3));

}

/* ---------- underlay glow ---------- */
const under=document.createElement('canvas'),underB=document.createElement('canvas');let underDirty=true;
function buildUnder(){
  const asp=aspectWH(),uw=220,uh=Math.max(8,Math.round(uw/asp));under.width=uw;under.height=uh;const c=under.getContext('2d');const img=c.createImageData(uw,uh);
  const box=imgBox(asp),s=[0,0,0,0],lut=lutFrom(P.gstops);
  for(let y=0;y<uh;y++)for(let x=0;x<uw;x++){const wx=(x/(uw-1)*2-1)*asp*M,wy=(1-y/(uh-1)*2)*M;const p=(y*uw+x)*4;
    if(sampleAt(wx,wy,box,s)){const v=adjust(0.299*s[0]+0.587*s[1]+0.114*s[2]);const li=Math.round(v*255)*3;img.data[p]=lut[li];img.data[p+1]=lut[li+1];img.data[p+2]=lut[li+2];img.data[p+3]=255;}
    else{img.data[p+3]=0;}}
  c.putImageData(img,0,0);underB.width=uw;underB.height=uh;const b=underB.getContext('2d');b.clearRect(0,0,uw,uh);
  const r=1+P.underBlur*10;if('filter' in b){b.filter='blur('+r.toFixed(1)+'px)';b.drawImage(under,0,0);b.filter='none';}else b.drawImage(under,0,0);underDirty=false;
}

/* ---------- per-frame ---------- */
let t=0,phase=0,MP=0;
function timeX(){return((t%P.dur)+P.dur)%P.dur/P.dur;}

function compute(W,H){
  const{N,bx,by,v,rad,rnd,aB,aP,asp}=G;const ph=phase,p=MP;const S=H/2*P.zoom,cx=W/2,cy=H/2;const D=Math.max(0.3,P.lens);

      else if(mo==='fall'){h*=1-ss(0,1,p*(1+st)-key*st);}

    for(let q=0;q<4;q++){const o=(i*4+q)*2;aB[o]=Bx;aB[o+1]=By;aP[o]=Tx;aP[o+1]=Ty;}
  }

}

/* ---------- render ---------- */
let RW=600,RH=800,needRender=true,resizeNeeded=true,needBG=true;
function setSize(W,H){RW=W;RH=H;renderer.setSize(W,H,false);out.width=W;out.height=H;camera.left=0;camera.right=W;camera.top=0;camera.bottom=H;camera.updateProjectionMatrix();needRender=true;}
function fitPreview(){const wrap=document.getElementById('wrap'),cs=getComputedStyle(wrap);
  const aw=wrap.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),ah=wrap.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const a=aspectWH();let w=aw,h=aw/a;if(h>ah){h=ah;w=ah*a;}w=Math.max(60,Math.floor(w));h=Math.max(60,Math.floor(h));out.style.width=w+'px';out.style.height=h+'px';
  const dpr=Math.min(2,window.devicePixelRatio||1);let W=Math.round(w*dpr),H=Math.round(h*dpr);const cap=1800/Math.max(W,H);if(cap<1){W=Math.round(W*cap);H=Math.round(H*cap);}
  setSize(W,H);resizeNeeded=false;}
function exportDims(long){const a=aspectWH();let W,H;if(a<1){H=long;W=Math.round(long*a);}else{W=long;H=Math.round(long/a);}return[W&~1,H&~1];}
const bl1=document.createElement('canvas'),bl2=document.createElement('canvas');let grainCv=null;

  for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}c.putImageData(d,0,0);return grainCv;}

  el.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)loadFile(f);});}
out.addEventListener('pointerdown',e=>{if(recording||P.kf.vpX||P.kf.vpY)return;const r=out.getBoundingClientRect();const asp=aspectWH(),S=r.height/2*P.zoom;
  P.vpX=Math.max(-1,Math.min(1,((e.clientX-r.left)-r.width/2)/S/asp));P.vpY=Math.max(-1,Math.min(1,-((e.clientY-r.top)-r.height/2)/S));syncVal('vpX');syncVal('vpY');needRender=true;});
window.addEventListener('resize',()=>{resizeNeeded=true;needRender=true;});


/* ---------- presets (mine + team) ---------- */
function makePresets(cfg){
  const LS='studio-presets.'+cfg.key,NAME='studio-person';let mine=[];
  try{mine=JSON.parse(localStorage.getItem(LS)||'[]');if(!Array.isArray(mine))mine=[];}catch(e){mine=[];}
  let team=[],teamState='idle',tab='mine',open=true,armed=null,msg='',busy=false;
  const box=document.getElementById('presets');const clone=o=>JSON.parse(JSON.stringify(o));
  const persist=()=>{try{localStorage.setItem(LS,JSON.stringify(mine));return true;}catch(e){msg='Couldn’t store presets in this browser. Use Export to keep them.';return false;}};
  const getName=()=>{try{return localStorage.getItem(NAME)||'';}catch(e){return'';}};
  const setName=v=>{try{localStorage.setItem(NAME,v);}catch(e){}};
  async function api(method,body,qs){const r=await fetch('api/presets?tool='+encodeURIComponent(cfg.key)+(qs||''),{method,credentials:'same-origin',headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
    let j={};try{j=await r.json();}catch(e){}if(!r.ok)throw new Error(j.error||('Request failed ('+r.status+')'));return j;}
  async function loadTeam(){if(location.protocol==='file:'){teamState='off';render();return;}teamState='loading';render();
    try{const j=await api('GET');team=j.presets||[];teamState='ok';}catch(e){teamState='error';msg=e.message;}render();}
  function apply(pr){try{cfg.restore(clone(pr));msg='Applied '+pr.name+'.';}catch(e){msg='That preset couldn’t be applied.';}armed=null;render();}
  async function save(name){
    const snap=Object.assign({name,tool:cfg.key,at:Date.now()},cfg.snapshot());
    if(tab==='mine'){const i=mine.findIndex(p=>p.name===name);if(i>=0){mine[i]=snap;msg='Updated '+name+'.';}else{mine.push(snap);msg='Saved '+name+'.';}persist();render();return;}
    const by=getName().trim();if(!by){msg='Add your name first, so the team knows who saved it.';render();return;}
    snap.by=by;busy=true;msg='Saving to team…';render();
    try{const j=await api('POST',{preset:snap});const old=team.filter(p=>p.name===name&&p.by===by);
      for(const o of old){try{await api('DELETE',null,'&id='+encodeURIComponent(o.id));}catch(e){}}
      team=team.filter(p=>!old.includes(p)).concat([j.preset]);msg=(old.length?'Updated ':'Shared ')+name+' with the team.';}
    catch(e){msg=e.message;}busy=false;render();
  }
  async function remove(ix){
    if(tab==='mine'){const p=mine[ix];mine.splice(ix,1);persist();msg='Deleted '+p.name+'.';armed=null;render();return;}
    const p=team[ix];busy=true;render();
    try{await api('DELETE',null,'&id='+encodeURIComponent(p.id));team.splice(ix,1);msg='Deleted '+p.name+' from team presets.';}catch(e){msg=e.message;}
    busy=false;armed=null;render();
  }
  function render(){
    box.innerHTML='';const d=document.createElement('details');d.open=open;d.addEventListener('toggle',()=>{open=d.open;});
    const s=document.createElement('summary');s.textContent='Presets';d.append(s);const body=document.createElement('div');body.className='body';
    const tabs=document.createElement('div');tabs.className='ptabs';tabs.setAttribute('role','group');tabs.setAttribute('aria-label','Preset library');
    for(const[k,l]of[['mine','Mine'+(mine.length?' '+mine.length:'')],['team','Team'+(teamState==='ok'&&team.length?' '+team.length:'')]]){
      const b=document.createElement('button');b.type='button';b.textContent=l;b.setAttribute('aria-pressed',tab===k);
      b.addEventListener('click',()=>{tab=k;armed=null;msg='';if(k==='team'&&teamState==='idle')loadTeam();else render();});tabs.append(b);}
    body.append(tabs);
    const list=tab==='mine'?mine:team;const chips=document.createElement('div');chips.className='pchips';
    const note=t=>{const p=document.createElement('p');p.className='note';p.textContent=t;chips.append(p);};
    if(tab==='team'&&teamState==='loading')note('Loading team presets…');
    else if(tab==='team'&&teamState==='off')note('Team presets work on the hosted site. Here you can use Mine, or Export and Import files.');
    else if(tab==='team'&&teamState==='error')note('Team presets couldn’t load.');
    else if(!list.length)note(tab==='mine'?'No presets yet. Set things up, name it, and save.':'No team presets yet. Save one here to share it.');
    list.forEach((pr,ix)=>{const c=document.createElement('span');c.className='pchip';
      const a=document.createElement('button');a.type='button';a.textContent=pr.name;a.title='Apply '+pr.name+(pr.by?' (saved by '+pr.by+')':'');
      if(pr.by){const sm=document.createElement('small');sm.textContent=pr.by;a.append(sm);}
      a.addEventListener('click',()=>apply(pr));
      const x=document.createElement('button');x.type='button';x.className='del'+(armed===ix?' arm':'');x.textContent=armed===ix?'delete?':'×';x.setAttribute('aria-label','Delete '+pr.name);x.disabled=busy;
      x.addEventListener('click',()=>{if(armed===ix)remove(ix);else{armed=ix;render();}});c.append(a,x);chips.append(c);});
    body.append(chips);
    const canTeam=!(tab==='team'&&teamState!=='ok');
    if(tab==='team'&&teamState==='ok'){const r=document.createElement('div');r.className='prow';const n=document.createElement('input');n.type='text';n.placeholder='Your name';n.value=getName();n.setAttribute('aria-label','Your name');
      n.addEventListener('input',()=>setName(n.value));r.append(n);body.append(r);}
    if(tab==='team'&&teamState==='error'){const rb=document.createElement('button');rb.type='button';rb.className='btn';rb.textContent='Try again';rb.addEventListener('click',loadTeam);body.append(rb);}
    if(canTeam){const row=document.createElement('div');row.className='prow';const inp=document.createElement('input');inp.type='text';inp.placeholder='Preset name';inp.setAttribute('aria-label','Preset name');
      const sv=document.createElement('button');sv.type='button';sv.className='btn';sv.textContent=tab==='mine'?'Save':'Share';sv.disabled=busy;
      const go=()=>{if(busy)return;const name=(inp.value||'').trim()||('Preset '+(list.length+1));armed=null;save(name);};
      sv.addEventListener('click',go);inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});row.append(inp,sv);body.append(row);}
    if(tab==='mine'){const row2=document.createElement('div');row2.className='prow two';
      const ex=document.createElement('button');ex.type='button';ex.className='btn';ex.textContent='Export';ex.disabled=!mine.length;
      ex.addEventListener('click',()=>{saveFile(cfg.key+'-presets.json',new Blob([JSON.stringify({tool:cfg.key,version:1,presets:mine},null,1)],{type:'application/json'}));msg='Exported '+mine.length+' preset'+(mine.length===1?'':'s')+'.';render();});
      const im=document.createElement('button');im.type='button';im.className='btn';im.textContent='Import';
      const fi=document.createElement('input');fi.type='file';fi.accept='application/json,.json';fi.hidden=true;im.addEventListener('click',()=>fi.click());
      fi.addEventListener('change',()=>{const f=fi.files&&fi.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);const arr=Array.isArray(data)?data:data.presets;
          if(!Array.isArray(arr))throw 0;if(data.tool&&data.tool!==cfg.key){msg='Those presets are for '+data.tool+', not this tool.';render();return;}
          let n=0;for(const p of arr){if(!p||!p.P)continue;const i=mine.findIndex(q=>q.name===p.name);if(i>=0)mine[i]=p;else mine.push(p);n++;}
          persist();msg='Imported '+n+' preset'+(n===1?'':'s')+'.';}catch(e){msg='That file isn’t a presets file.';}render();};r.readAsText(f);fi.value='';});
      row2.append(ex,im,fi);body.append(row2);}
    const st=document.createElement('p');st.className='note';st.setAttribute('role','status');st.textContent=msg;body.append(st);
    d.append(body);box.append(d);
  }
  render();
}
function loadImgURL(url,cb){const im=new Image();im.onload=()=>{const cv=document.createElement('canvas');cv.width=im.width;cv.height=im.height;cv.getContext('2d').drawImage(im,0,0);cb(cv);};im.src=url;}
defaultFace();P=Object.assign({},BASE,{stops:BASE.stops.slice(),gstops:BASE.gstops.slice(),kf:{}});renderPanel();syncPlay();
makePresets({key:'pin-studio',
  snapshot:()=>({P:JSON.parse(JSON.stringify(P)),media:SRC&&SRC.url?{url:SRC.url}:null}),
  restore:s=>{if(recording)return;const asp=P.aspect;P=Object.assign({},BASE,s.P);P.stops=(P.stops||BASE.stops).slice();P.gstops=(P.gstops||BASE.gstops).slice();P.kf=P.kf||{};selKey={};
    const done=()=>{gradDirty=true;underDirty=true;needGrid=true;needRender=true;resizeNeeded=true;renderPanel();};
    if(s.media&&s.media.url)loadImgURL(s.media.url,cv=>{setSrcFromCanvas(cv);SRC.url=s.media.url;done();});else{defaultFace();done();}}});

requestAnimationFrame(tick);
})();
</script>
