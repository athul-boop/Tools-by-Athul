<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Form · Tools by Athul</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="assets/kit.css">
</head>
<body>
<header class="top">
  <a class="brand" href="./" title="All tools"><svg width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><g stroke="currentColor" stroke-width="2.4" fill="none"><path d="M8 26 L16 6 L24 26"/><path d="M11 19 H21"/></g></svg>Tools</a><span class="crumb">/</span><span class="tname">Form <span id="shname"></span></span>
  <span class="dims" id="dims"></span>
  <span class="spacer"></span>
  <button class="btn icon" id="bUndo" type="button" title="Undo (Ctrl or Cmd + Z)" aria-label="Undo" disabled><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 3 L2 6 L5 9"/><path d="M2 6 H9 a3 3 0 0 1 0 6 H6"/></svg></button>
  <button class="btn icon" id="bRedo" type="button" title="Redo (Shift + Ctrl or Cmd + Z)" aria-label="Redo" disabled><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" transform="scale(-1,1)"><path d="M5 3 L2 6 L5 9"/><path d="M2 6 H9 a3 3 0 0 1 0 6 H6"/></svg></button>
  <span class="sep"></span>
  <button class="btn" id="shuffle" type="button">Randomize</button>
  <button class="btn" id="bPresets" type="button" aria-haspopup="true" aria-expanded="false">Presets</button>
  <button class="btn" id="reset" type="button">Reset</button>
  <span class="sep"></span>
  <button class="btn" id="bPng" type="button">PNG</button>
  <button class="btn solid" id="bMp4" type="button">Video</button>
  <div class="menu" id="menu" hidden><div id="presets"></div></div>
</header>
<aside class="panel" id="panel" aria-label="Settings">
  <div class="shapes" id="shapes"></div>
  <div id="sections"></div>
</aside>
<section class="stage" id="wrap"><canvas id="out" aria-label="Form preview. Drag to rotate."></canvas><div class="stage-meta" id="stat"></div></section>
<section class="tl" aria-label="Timeline">
  <div class="tl-bar">
    <button class="btn icon" id="tStart" type="button" title="Go to start" aria-label="Go to start"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="1" width="1.5" height="10" fill="currentColor"/><path d="M11 1 L4 6 L11 11Z" fill="currentColor"/></svg></button>
    <button class="btn icon" id="tPrev" type="button" title="Previous frame" aria-label="Previous frame"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M9 1 L3 6 L9 11Z" fill="currentColor"/></svg></button>
    <button class="btn icon" id="play" type="button" title="Play (space)" aria-label="Play"></button>
    <button class="btn icon" id="tNext" type="button" title="Next frame" aria-label="Next frame"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 1 L9 6 L3 11Z" fill="currentColor"/></svg></button>
    <span class="time" id="kTime"></span>
    <label class="tl-field">Length <input class="num" id="kDur" type="number" min="0.5" max="120" step="0.5"> s</label>
    <label class="tl-field">Rate <select id="kFps"><option>24</option><option>25</option><option selected>30</option><option>50</option><option>60</option></select></label>
    <div class="insp" id="kInsp" hidden>
      <span class="name" id="kName"></span>
      <input class="num" id="kVal" type="number" step="any" title="Key value" aria-label="Key value">
      <select id="kEase" title="Easing to next key" aria-label="Easing to next key"><option value="linear">Linear</option><option value="in">Ease in</option><option value="out">Ease out</option><option value="inout">Ease in out</option><option value="back">Overshoot</option><option value="step">Hold</option></select>
      <button class="btn sm" id="kAll" type="button" title="Use this easing on every key of this setting">Apply to all</button>
      <button class="btn sm" id="kDel" type="button">Delete key</button>
    </div>
  </div>
  <div class="tl-body" id="tlBody"></div>
</section>
<input type="range" id="scrub" hidden aria-hidden="true"><output id="time" hidden></output>
<div class="toast" id="toast" role="status"></div>

<input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/svg+xml,.svg" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/SVGLoader.js"></script>

(function(){

/* ---------- params ---------- */
const BASE={

const PALETTES={
  tangerine:{name:'Tangerine',colorMode:'faces',top:'#f4a6f8',left:'#ff5a00',right:'#a09cff',bottom:'#ff5a00',bgStyle:'solid',bgA:'#ededed',bgB:'#d9d9de'},

  mono:{name:'Mono',colorMode:'faces',top:'#ffffff',left:'#cfcfd4',right:'#8d8d96',bottom:'#6a6a72',bgStyle:'linear',bgA:'#f3f3f4',bgB:'#dedee3'},
  electric:{name:'Electric',colorMode:'faces',top:'#4a63ff',left:'#00d6a8',right:'#18186a',bottom:'#10104a',bgStyle:'radial',bgA:'#1b1b26',bgB:'#08080c'},
  candy:{name:'Candy palette',colorMode:'palette',pal:['#ff5a00','#f4a6f8','#a09cff','#ffc800'],shade:'#2a0a12',toneL:0.25,toneR:0.5,bgStyle:'solid',bgA:'#eeeeee',bgB:'#dddddd'}
};
const SHAPES={
  burst:{name:'Starburst',desc:'Rays around a hub',preset:{palette:'tangerine',aspect:'4:5',rotX:0,rotY:0,rotZ:0}},
  stack:{name:'Stack',desc:'Layered slabs',preset:{palette:'slab',aspect:'4:5',rotX:0,rotY:0,rotZ:0}},
  bars:{name:'Bars',desc:'Repeating bars and stairs',preset:{palette:'night',aspect:'16:9',rotX:0,rotY:-20,rotZ:-25,barFan:4,barStep:0.05,zoom:1.4}},
  custom:{name:'Your shape',desc:'PNG or SVG, extruded',preset:{palette:'electric',aspect:'1:1',rotX:-20,rotY:25,rotZ:0}}

let P={};
function applyPalette(k){const p=PALETTES[k];if(!p)return;for(const key in p){if(key==='name')continue;P[key]=Array.isArray(p[key])?p[key].slice():p[key];}P.palette=k;}
function applyShape(k){
  const keep={pngSize:P.pngSize||BASE.pngSize,vidSize:P.vidSize||BASE.vidSize,pngAlpha:!!P.pngAlpha};
  P=Object.assign({},BASE,{pal:BASE.pal.slice(),kf:{}},SHAPES[k].preset,{shape:k},keep);applyPalette(P.palette);
  needBuild=true;resizeNeeded=true;selKey={};renderShapes();renderPanel();
}

/* ---------- custom shape source + tracing ---------- */
let SRC=null,CUSTOM={shapes:[]},customDirty=true;
function imgSrc(cv){const d=cv.getContext('2d').getImageData(0,0,cv.width,cv.height).data;const n=cv.width*cv.height;const lum=new Float32Array(n),alp=new Float32Array(n);
  for(let i=0;i<n;i++){lum[i]=(0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2])/255;alp[i]=d[i*4+3]/255;}return{type:'png',w:cv.width,h:cv.height,lum,alp};}
function defaultSrc(){const cv=document.createElement('canvas');cv.width=cv.height=200;const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,200,200);c.fillStyle='#000';c.strokeStyle='#000';
  c.lineWidth=32;c.beginPath();c.arc(100,100,62,0,TAU);c.stroke();c.beginPath();c.arc(100,100,22,0,TAU);c.fill();c.save();c.translate(100,100);c.rotate(-0.7);c.fillRect(-9,-99,18,58);c.restore();SRC=imgSrc(cv);}
function rdp(pts,eps){
  if(pts.length<3)return pts.slice();let dmax=0,idx=0;const a=pts[0],b=pts[pts.length-1];const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1e-9;
  for(let i=1;i<pts.length-1;i++){const d=Math.abs(dy*pts[i][0]-dx*pts[i][1]+b[0]*a[1]-b[1]*a[0])/L;if(d>dmax){dmax=d;idx=i;}}
  if(dmax>eps){const l=rdp(pts.slice(0,idx+1),eps),r=rdp(pts.slice(idx),eps);return l.slice(0,-1).concat(r);}return[a,b];
}
function simplifyLoop(loop,eps){let far=0,fd=0;for(let i=1;i<loop.length;i++){const d=Math.hypot(loop[i][0]-loop[0][0],loop[i][1]-loop[0][1]);if(d>fd){fd=d;far=i;}}
  const A=rdp(loop.slice(0,far+1),eps),B=rdp(loop.slice(far).concat([loop[0]]),eps);return A.slice(0,-1).concat(B.slice(0,-1));}

function traceSrc(){
  const w=SRC.w,h=SRC.h,bin=new Uint8Array(w*h);
  for(let i=0;i<w*h;i++){const v=SRC.alp[i]*(P.cInvert?SRC.lum[i]:1-SRC.lum[i]);bin[i]=v>P.cThresh?1:0;}
  const g=(x,y)=>(x<0||y<0||x>=w||y>=h)?0:bin[y*w+x];const adj=new Map();const K=(x,y)=>x*65536+y;
  const add=(a,b)=>{const ka=K(a[0],a[1]),kb=K(b[0],b[1]);if(!adj.has(ka))adj.set(ka,[]);if(!adj.has(kb))adj.set(kb,[]);adj.get(ka).push(kb);adj.get(kb).push(ka);};

    const id=g(x,y)*8+g(x+1,y)*4+g(x+1,y+1)*2+g(x,y+1);if(id===0||id===15)continue;
    const X=2*x+2,Y=2*y+2,T=[X+1,Y],R=[X+2,Y+1],B=[X+1,Y+2],L=[X,Y+1];
    switch(id){case 1:case 14:add(L,B);break;case 2:case 13:add(B,R);break;case 3:case 12:add(L,R);break;case 4:case 11:add(T,R);break;
      case 5:add(T,L);add(B,R);break;case 6:case 9:add(T,B);break;case 7:case 8:add(T,L);break;case 10:add(T,R);add(L,B);break;}
  }

    for(let guard=0;guard<1e6;guard++){seen.add(cur);loop.push([Math.floor(cur/65536)/2-1,-((cur%65536)/2-1)]);const nb=adj.get(cur);const nx=nb[0]!==prev?nb[0]:nb[1];prev=cur;cur=nx;if(cur===undefined||cur===k||seen.has(cur))break;}

function buildCustom(loops){

  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const l of loops)for(const p of l){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);}
  const s=2.4/Math.max(x1-x0,y1-y0,1e-6),cx=(x0+x1)/2,cy=(y0+y1)/2;
  const N=loops.map(l=>l.map(p=>[(p[0]-cx)*s,(p[1]-cy)*s]));
  const info=N.map((l,i)=>({l,a:Math.abs(area(l)),d:0,i}));
  for(const A of info){const mid=[(A.l[0][0]+A.l[1][0])/2,(A.l[0][1]+A.l[1][1])/2];for(const B of info)if(B!==A&&B.a>A.a&&inside(mid,B.l))A.d++;}

  for(const o of outer){const sh=new THREE.Shape(o.l.map(p=>new THREE.Vector2(p[0],p[1])));o.shape=sh;shapes.push(sh);}
  for(const h of info.filter(x=>x.d%2===1)){const mid=[(h.l[0][0]+h.l[1][0])/2,(h.l[0][1]+h.l[1][1])/2];let best=null;
    for(const o of outer)if(o.d===h.d-1&&o.a>h.a&&inside(mid,o.l)&&(!best||o.a<best.a))best=o;

function loadSVG(text,name){
  if(!THREE.SVGLoader){status('SVG support didn’t load. Try a PNG instead.');return;}
  try{const data=new THREE.SVGLoader().parse(text);const raw=[];
    for(const p of data.paths){const st=p.userData&&p.userData.style;if(st&&st.fill==='none')continue;const shs=THREE.SVGLoader.createShapes?THREE.SVGLoader.createShapes(p):p.toShapes(true);raw.push(...shs);}
    if(!raw.length){status('No filled shapes found in that SVG.');return;}
    const ext=raw.map(s=>s.extractPoints(10));let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(const e of ext)for(const p of e.shape){x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y);}
    const s=2.4/Math.max(x1-x0,y1-y0,1e-6),cx=(x0+x1)/2,cy=(y0+y1)/2;const tf=p=>new THREE.Vector2((p.x-cx)*s,-(p.y-cy)*s);
    CUSTOM.shapes=ext.map(e=>{const sh=new THREE.Shape(e.shape.map(tf));for(const h of e.holes)sh.holes.push(new THREE.Path(h.map(tf)));return sh;});
    SRC={type:'svg',text};customDirty=false;needBuild=true;status('Loaded '+name);renderPanel();
  }catch(err){status('That SVG couldn’t be read. Try exporting it with plain filled paths.');}
}
function loadFile(f){
  const r=new FileReader();
  if(/svg/i.test(f.type)||/\.svg$/i.test(f.name)){r.onload=()=>loadSVG(r.result,f.name);r.readAsText(f);return;}
  r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,180/Math.max(im.width,im.height));const cv=document.createElement('canvas');
    cv.width=Math.max(4,Math.round(im.width*s));cv.height=Math.max(4,Math.round(im.height*s));cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
    SRC=imgSrc(cv);SRC.url=cv.toDataURL();customDirty=true;needBuild=true;status('Loaded '+f.name);renderPanel();};
    im.onerror=()=>status('That file couldn’t be read as an image.');im.src=r.result;};
  r.readAsDataURL(f);
}

/* ---------- three ---------- */
const out=document.getElementById('out'),octx=out.getContext('2d');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setClearColor(0x000000,0);
const scene=new THREE.Scene();const root=new THREE.Group();const group=new THREE.Group();root.add(group);scene.add(root);
const ortho=new THREE.OrthographicCamera(-1,1,1,-1,-100,100),persp=new THREE.PerspectiveCamera(30,1,0.1,300);
const VS=`varying vec3 vW;varying vec3 vL;void main(){vW=normalize(mat3(modelMatrix)*normal);vL=normal;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`;
const FS=`precision mediump float;uniform vec3 uTop,uLeft,uRight,uBottom;uniform float uLocal;varying vec3 vW;varying vec3 vL;
void main(){vec3 n=normalize(mix(vW,vL,uLocal));vec3 a=abs(n);vec3 c;if(a.y>=a.x&&a.y>=a.z)c=n.y>0.0?uTop:uBottom;else if(a.x>=a.z)c=uRight;else c=uLeft;gl_FragColor=vec4(c,1.0);}`;
function makeMat(){return new THREE.ShaderMaterial({vertexShader:VS,fragmentShader:FS,uniforms:{uTop:{value:new THREE.Color()},uLeft:{value:new THREE.Color()},uRight:{value:new THREE.Color()},uBottom:{value:new THREE.Color()},uLocal:{value:0}}});}
const GEO={boxStart:new THREE.BoxGeometry(1,1,1).translate(0.5,0,0),boxCenter:new THREE.BoxGeometry(1,1,1),
  hub:new THREE.CylinderGeometry(1,1,1,64).rotateX(Math.PI/2),round:new THREE.CylinderGeometry(0.5,0.5,1,64),hex:new THREE.CylinderGeometry(0.5,0.5,1,6),tri:new THREE.CylinderGeometry(0.5,0.5,1,3)};
const SHARED=new Set(Object.values(GEO));
let pieces=[],needBuild=true;
function profileGeo(){
  if(P.profile==='custom'&&CUSTOM.shapes.length){const g=new THREE.ExtrudeGeometry(CUSTOM.shapes,{depth:1,bevelEnabled:false,curveSegments:8});g.translate(0,0,-0.5);g.scale(1/2.4,1/2.4,1);g.rotateX(-Math.PI/2);return g;}

}
function rebuild(){
  if((P.shape==='custom'||(P.shape==='stack'&&P.profile==='custom'))&&customDirty&&SRC&&SRC.type==='png'){traceSrc();customDirty=false;}
  for(const pc of pieces){group.remove(pc.mesh);pc.mesh.material.dispose();if(!SHARED.has(pc.mesh.geometry)&&!pc.sharedGeo)pc.mesh.geometry.dispose();}
  if(pieces.sharedProfile&&!SHARED.has(pieces.sharedProfile))pieces.sharedProfile.dispose();
  pieces=[];const rng=mulberry(P.seed*13+1);
  const add=(kind,geo,extra)=>{const m=new THREE.Mesh(geo,makeMat());group.add(m);pieces.push(Object.assign({kind,mesh:m,rnd:rng()},extra||{}));};
  if(P.shape==='burst'){if(P.hub)add('hub',GEO.hub);for(let i=0;i<(P.rays|0);i++)add('ray',GEO.boxStart);}
  else if(P.shape==='stack'){const g=profileGeo();for(let i=0;i<(P.layers|0);i++)add('layer',g,{sharedGeo:true});pieces.sharedProfile=g;}
  else if(P.shape==='bars'){const g=P.growFrom==='start'?GEO.boxStart:GEO.boxCenter;for(let i=0;i<(P.bars|0);i++)add('bar',g);}
  else{for(const s of CUSTOM.shapes){const g=new THREE.ExtrudeGeometry(s,{depth:1,bevelEnabled:false,curveSegments:8});g.translate(0,0,-0.5);g.computeBoundingBox();const c=new THREE.Vector3();g.boundingBox.getCenter(c);g.translate(-c.x,-c.y,0);add('part',g,{cx:c.x,cy:c.y});}}

/* ---------- presets (mine + team) ---------- */
function makePresets(cfg){
  const LS='studio-presets.'+cfg.key,NAME='studio-person';let mine=[];
  try{mine=JSON.parse(localStorage.getItem(LS)||'[]');if(!Array.isArray(mine))mine=[];}catch(e){mine=[];}
  let team=[],teamState='idle',tab='mine',open=true,armed=null,msg='',busy=false;
  const box=document.getElementById('presets');const clone=o=>JSON.parse(JSON.stringify(o));
  const persist=()=>{try{localStorage.setItem(LS,JSON.stringify(mine));return true;}catch(e){msg='Couldn’t store presets in this browser. Use Export to keep them.';return false;}};
  const getName=()=>{try{return localStorage.getItem(NAME)||'';}catch(e){return'';}};
  const setName=v=>{try{localStorage.setItem(NAME,v);}catch(e){}};
  async function api(method,body,qs){const r=await fetch('api/presets?tool='+encodeURIComponent(cfg.key)+(qs||''),{method,credentials:'same-origin',headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
    let j={};try{j=await r.json();}catch(e){}if(!r.ok)throw new Error(j.error||('Request failed ('+r.status+')'));return j;}
  async function loadTeam(){if(location.protocol==='file:'){teamState='off';render();return;}teamState='loading';render();
    try{const j=await api('GET');team=j.presets||[];teamState='ok';}catch(e){teamState='error';msg=e.message;}render();}
  function apply(pr){try{cfg.restore(clone(pr));msg='Applied '+pr.name+'.';}catch(e){msg='That preset couldn’t be applied.';}armed=null;render();}
  async function save(name){
    const snap=Object.assign({name,tool:cfg.key,at:Date.now()},cfg.snapshot());
    if(tab==='mine'){const i=mine.findIndex(p=>p.name===name);if(i>=0){mine[i]=snap;msg='Updated '+name+'.';}else{mine.push(snap);msg='Saved '+name+'.';}persist();render();return;}
    const by=getName().trim();if(!by){msg='Add your name first, so the team knows who saved it.';render();return;}
    snap.by=by;busy=true;msg='Saving to team…';render();
    try{const j=await api('POST',{preset:snap});const old=team.filter(p=>p.name===name&&p.by===by);
      for(const o of old){try{await api('DELETE',null,'&id='+encodeURIComponent(o.id));}catch(e){}}
      team=team.filter(p=>!old.includes(p)).concat([j.preset]);msg=(old.length?'Updated ':'Shared ')+name+' with the team.';}
    catch(e){msg=e.message;}busy=false;render();
  }
  async function remove(ix){
    if(tab==='mine'){const p=mine[ix];mine.splice(ix,1);persist();msg='Deleted '+p.name+'.';armed=null;render();return;}
    const p=team[ix];busy=true;render();
    try{await api('DELETE',null,'&id='+encodeURIComponent(p.id));team.splice(ix,1);msg='Deleted '+p.name+' from team presets.';}catch(e){msg=e.message;}
    busy=false;armed=null;render();
  }
  function render(){
    box.innerHTML='';const d=document.createElement('details');d.open=open;d.addEventListener('toggle',()=>{open=d.open;});
    const s=document.createElement('summary');s.textContent='Presets';d.append(s);const body=document.createElement('div');body.className='body';
    const tabs=document.createElement('div');tabs.className='ptabs';tabs.setAttribute('role','group');tabs.setAttribute('aria-label','Preset library');
    for(const[k,l]of[['mine','Mine'+(mine.length?' '+mine.length:'')],['team','Team'+(teamState==='ok'&&team.length?' '+team.length:'')]]){
      const b=document.createElement('button');b.type='button';b.textContent=l;b.setAttribute('aria-pressed',tab===k);
      b.addEventListener('click',()=>{tab=k;armed=null;msg='';if(k==='team'&&teamState==='idle')loadTeam();else render();});tabs.append(b);}
    body.append(tabs);
    const list=tab==='mine'?mine:team;const chips=document.createElement('div');chips.className='pchips';
    const note=t=>{const p=document.createElement('p');p.className='note';p.textContent=t;chips.append(p);};
    if(tab==='team'&&teamState==='loading')note('Loading team presets…');
    else if(tab==='team'&&teamState==='off')note('Team presets work on the hosted site. Here you can use Mine, or Export and Import files.');
    else if(tab==='team'&&teamState==='error')note('Team presets couldn’t load.');
    else if(!list.length)note(tab==='mine'?'No presets yet. Set things up, name it, and save.':'No team presets yet. Save one here to share it.');
    list.forEach((pr,ix)=>{const c=document.createElement('span');c.className='pchip';
      const a=document.createElement('button');a.type='button';a.textContent=pr.name;a.title='Apply '+pr.name+(pr.by?' (saved by '+pr.by+')':'');
      if(pr.by){const sm=document.createElement('small');sm.textContent=pr.by;a.append(sm);}
      a.addEventListener('click',()=>apply(pr));
      const x=document.createElement('button');x.type='button';x.className='del'+(armed===ix?' arm':'');x.textContent=armed===ix?'delete?':'×';x.setAttribute('aria-label','Delete '+pr.name);x.disabled=busy;
      x.addEventListener('click',()=>{if(armed===ix)remove(ix);else{armed=ix;render();}});c.append(a,x);chips.append(c);});
    body.append(chips);
    const canTeam=!(tab==='team'&&teamState!=='ok');
    if(tab==='team'&&teamState==='ok'){const r=document.createElement('div');r.className='prow';const n=document.createElement('input');n.type='text';n.placeholder='Your name';n.value=getName();n.setAttribute('aria-label','Your name');
      n.addEventListener('input',()=>setName(n.value));r.append(n);body.append(r);}
    if(tab==='team'&&teamState==='error'){const rb=document.createElement('button');rb.type='button';rb.className='btn';rb.textContent='Try again';rb.addEventListener('click',loadTeam);body.append(rb);}
    if(canTeam){const row=document.createElement('div');row.className='prow';const inp=document.createElement('input');inp.type='text';inp.placeholder='Preset name';inp.setAttribute('aria-label','Preset name');
      const sv=document.createElement('button');sv.type='button';sv.className='btn';sv.textContent=tab==='mine'?'Save':'Share';sv.disabled=busy;
      const go=()=>{if(busy)return;const name=(inp.value||'').trim()||('Preset '+(list.length+1));armed=null;save(name);};
      sv.addEventListener('click',go);inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});row.append(inp,sv);body.append(row);}
    if(tab==='mine'){const row2=document.createElement('div');row2.className='prow two';
      const ex=document.createElement('button');ex.type='button';ex.className='btn';ex.textContent='Export';ex.disabled=!mine.length;
      ex.addEventListener('click',()=>{saveFile(cfg.key+'-presets.json',new Blob([JSON.stringify({tool:cfg.key,version:1,presets:mine},null,1)],{type:'application/json'}));msg='Exported '+mine.length+' preset'+(mine.length===1?'':'s')+'.';render();});
      const im=document.createElement('button');im.type='button';im.className='btn';im.textContent='Import';
      const fi=document.createElement('input');fi.type='file';fi.accept='application/json,.json';fi.hidden=true;im.addEventListener('click',()=>fi.click());
      fi.addEventListener('change',()=>{const f=fi.files&&fi.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);const arr=Array.isArray(data)?data:data.presets;
          if(!Array.isArray(arr))throw 0;if(data.tool&&data.tool!==cfg.key){msg='Those presets are for '+data.tool+', not this tool.';render();return;}
          let n=0;for(const p of arr){if(!p||!p.P)continue;const i=mine.findIndex(q=>q.name===p.name);if(i>=0)mine[i]=p;else mine.push(p);n++;}
          persist();msg='Imported '+n+' preset'+(n===1?'':'s')+'.';}catch(e){msg='That file isn’t a presets file.';}render();};r.readAsText(f);fi.value='';});
      row2.append(ex,im,fi);body.append(row2);}
    const st=document.createElement('p');st.className='note';st.setAttribute('role','status');st.textContent=msg;body.append(st);
    d.append(body);box.append(d);
  }
  render();
}

/* ---------- kit: shared shell, keyframe timeline, undo ---------- */
const KDUR=('dur' in BASE)?'dur':'loop';
const kDur=()=>Math.max(0.1,+P[KDUR]||1);
const KNOKF=(typeof NOKF!=='undefined')?NOKF:new Set(['dur','loop','seed']);
const KSTRUCT=(typeof STRUCT!=='undefined')?STRUCT:new Set();
let kSel=null,kFps=30,KCFG=null;
const $k=id=>document.getElementById(id);
function kEase(n,u){u=Math.min(1,Math.max(0,u));switch(n){case 'in':return u*u*u;case 'out':return 1-Math.pow(1-u,3);case 'inout':return u<0.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;case 'step':return u<1?0:1;case 'back':{const c=1.70158,v=u-1;return 1+(c+1)*v*v*v+c*v*v;}default:return u;}}
function kVal(tr,x){const ks=tr.keys;if(!ks.length)return null;if(x<=ks[0].t)return ks[0].v;
  for(let j=0;j<ks.length-1;j++){const a=ks[j],b=ks[j+1];if(x<=b.t){const u=(x-a.t)/((b.t-a.t)||1);return a.v+(b.v-a.v)*kEase(a.e,u);}}return ks[ks.length-1].v;}
function kX(){return timeX();}
function kKfable(k){return !!k&&!KNOKF.has(k)&&!KSTRUCT.has(k)&&typeof BASE[k]==='number';}
function kDef(k){for(const sec of sections())for(const it of sec.items)if(it.t==='range'&&it.k===k)return it;return null;}
function kSort(tr){tr.keys.sort((a,b)=>a.t-b.t);}
function kKeyAt(tr){const tol=0.5/(kDur()*kFps);return tr.keys.findIndex(q=>Math.abs(q.t-kX())<=tol);}
function kCur(k){return P.kf&&P.kf[k]?kVal(P.kf[k],kX()):P[k];}
function kFmt(v,step){const d=step<1?Math.min(4,(String(step).split('.')[1]||'').length):0;return(+v).toFixed(d);}
function toast(msg){const t0=$k('toast');if(!t0)return;t0.textContent=msg;t0.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t0.classList.remove('show'),2200);}

/* one slider row: diamond, label, number, slider */
function rangeEl(it){
  const k=it.k,can=!it.get&&kKfable(k);const anim=can&&P.kf&&P.kf[k];
  const row=document.createElement('div');row.className='row range'+(anim?' animated':'');if(k&&!it.get)row.dataset.row=k;
  const kb=document.createElement('button');kb.type='button';kb.className='kf'+(can?'':' none')+(anim?' anim':'')+(anim&&kKeyAt(P.kf[k])>=0?' on':'');
  if(can){kb.title=anim?'Add or remove a key here':'Animate this setting';kb.setAttribute('aria-label',(anim?'Key for ':'Animate ')+it.l);kb.addEventListener('click',()=>kDiamond(k));}
  const lab=document.createElement('span');lab.className='lab';lab.textContent=it.l;lab.title=it.l;
  const num=document.createElement('input');num.type='number';num.className='num';num.step=it.step;num.min=it.min;num.max=it.max;num.setAttribute('aria-label',it.l+' value');
  const sl=document.createElement('input');sl.type='range';sl.min=it.min;sl.max=it.max;sl.step=it.step;sl.setAttribute('aria-label',it.l);
  const cur=it.get?it.get():kCur(k);sl.value=cur;num.value=kFmt(cur,it.step);
  if(k&&!it.get){sl.dataset.k=k;}
  const apply=v=>{if(isNaN(v))return;if(it.setv){it.setv(v);return;}if(P.kf&&P.kf[k])kAutoKey(k,v);else set(k,v);};
  sl.addEventListener('input',()=>{const v=parseFloat(sl.value);num.value=kFmt(v,it.step);apply(v);});

function kfEditor(){return document.createElement('div');}
function kAutoKey(k,v){const tr=P.kf[k];const i=kKeyAt(tr);if(i>=0){tr.keys[i].v=v;kSel={k,i};}else{tr.keys.push({t:kX(),v,e:'inout'});kSort(tr);kSel={k,i:kKeyAt(tr)};}
  needRender=true;kMarkRow(k);kTL();kCommit();}
function kDiamond(k){if(!P.kf)P.kf={};const tr=P.kf[k];
  if(!tr){P.kf[k]={keys:[{t:kX(),v:P[k],e:'inout'}]};kSel={k,i:0};}
  else{const i=kKeyAt(tr);if(i>=0){tr.keys.splice(i,1);if(!tr.keys.length){delete P.kf[k];kSel=null;}else kSel=null;}
    else{tr.keys.push({t:kX(),v:kVal(tr,kX()),e:'inout'});kSort(tr);kSel={k,i:kKeyAt(tr)};}}
  needRender=true;renderPanel();kCommit();}
function kMarkRow(k){document.querySelectorAll('[data-row="'+k+'"]').forEach(row=>{const tr=P.kf&&P.kf[k];const kb=row.querySelector('.kf');
  row.classList.toggle('animated',!!tr);if(kb){kb.classList.toggle('anim',!!tr);kb.classList.toggle('on',!!tr&&kKeyAt(tr)>=0);}});}
function kSyncRows(){if(!P.kf)return;for(const k in P.kf){const v=kVal(P.kf[k],kX());document.querySelectorAll('[data-row="'+k+'"]').forEach(row=>{
  const sl=row.querySelector('input[type=range]'),num=row.querySelector('.num');if(document.activeElement!==sl&&document.activeElement!==num){sl.value=v;num.value=kFmt(v,+sl.step);}});kMarkRow(k);}}
// keep sliders in step when something else changes a value (drag on canvas etc.)
syncVal=function(k){document.querySelectorAll('[data-row="'+k+'"]').forEach(row=>{const sl=row.querySelector('input[type=range]'),num=row.querySelector('.num');sl.value=P[k];num.value=kFmt(P[k],+sl.step);});};

/* timeline */
function kSetTime(sec){const d=kDur();t=Math.max(0,Math.min(d-1e-4,sec));playing=false;syncPlay();needRender=true;kUI(true);}
function kTL(){
  const body=$k('tlBody');if(!body)return;body.innerHTML='';const inner=document.createElement('div');inner.className='tl-inner';
  const head=document.createElement('div');head.className='tl-row head';const hl=document.createElement('div');hl.className='tl-label';hl.innerHTML='<span>Keyframes</span>';

  for(let s=0;s<d+1e-6;s+=step){const tk=document.createElement('span');tk.className='tick';tk.style.left=(s/d*100)+'%';tk.textContent=(+s.toFixed(1))+'s';ruler.append(tk);}
  const scrubAt=e=>{const r=ruler.getBoundingClientRect();kSetTime((e.clientX-r.left)/r.width*kDur());};
  ruler.addEventListener('pointerdown',e=>{ruler.setPointerCapture(e.pointerId);scrubAt(e);const mv=ev=>scrubAt(ev);const up=()=>{ruler.removeEventListener('pointermove',mv);ruler.removeEventListener('pointerup',up);};ruler.addEventListener('pointermove',mv);ruler.addEventListener('pointerup',up);});

  if(!keys.length){const em=document.createElement('div');em.className='tl-empty';em.textContent='Nothing keyframed yet. Press the diamond beside any slider to start, then move the playhead and change the value. Drag keys to retime them, double-click a lane to add one.';inner.append(em);}
  for(const k of keys){const tr=P.kf[k],def=kDef(k);const row=document.createElement('div');row.className='tl-row';
    const lb=document.createElement('div');lb.className='tl-label';const nm=document.createElement('span');nm.textContent=def?def.l:k;nm.title=nm.textContent;
    const x=document.createElement('button');x.type='button';x.className='x';x.textContent='×';x.title='Stop animating '+nm.textContent;x.setAttribute('aria-label',x.title);
    x.addEventListener('click',()=>{delete P.kf[k];if(kSel&&kSel.k===k)kSel=null;needRender=true;renderPanel();kCommit();});lb.append(nm,x);
    const lane=document.createElement('div');lane.className='lane';
    tr.keys.forEach((q,i)=>{const kd=document.createElement('div');kd.className='key'+(kSel&&kSel.k===k&&kSel.i===i?' sel':'');kd.style.left=(q.t*100)+'%';kd.title=(q.t*d).toFixed(2)+'s';
      kd.addEventListener('pointerdown',e=>{e.stopPropagation();kSel={k,i};kd.setPointerCapture(e.pointerId);const r=lane.getBoundingClientRect();let moved=false;
        const mv=ev=>{moved=true;q.t=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width));kd.style.left=(q.t*100)+'%';needRender=true;};
        const up=()=>{kd.removeEventListener('pointermove',mv);kd.removeEventListener('pointerup',up);kSort(tr);kSel={k,i:tr.keys.indexOf(q)};if(!moved){t=q.t*d;playing=false;syncPlay();}needRender=true;kTL();kInsp();renderPanelSoft();if(moved)kCommit();};
        kd.addEventListener('pointermove',mv);kd.addEventListener('pointerup',up);kTL._sel=true;kInsp();});
      lane.append(kd);});
    lane.addEventListener('dblclick',e=>{const r=lane.getBoundingClientRect();const f=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));tr.keys.push({t:f,v:kVal(tr,f),e:'inout'});kSort(tr);
      kSel={k,i:tr.keys.findIndex(q=>q.t===f)};needRender=true;kTL();kCommit();});
    row.append(lb,lane);inner.append(row);}
  const ph=document.createElement('div');ph.className='playhead';ph.id='kPlayhead';inner.append(ph);body.append(inner);kInsp();kUI(true);}
function renderPanelSoft(){kSyncRows();}
function kInsp(){const box=$k('kInsp');if(!box)return;const tr=kSel&&P.kf&&P.kf[kSel.k];const q=tr&&tr.keys[kSel.i];
  if(!q){box.hidden=true;return;}box.hidden=false;const def=kDef(kSel.k);$k('kName').textContent=(def?def.l:kSel.k)+' @ '+(q.t*kDur()).toFixed(2)+'s';
  const iv=$k('kVal');iv.value=q.v;if(def){iv.step=def.step;}$k('kEase').value=q.e||'inout';}
function kUI(force){if(!P||!P.aspect)return;const d=kDur(),x=kX();const ph=$k('kPlayhead');if(ph){const lab=170,inner=ph.parentElement;const w=inner.clientWidth-lab;ph.style.left=(lab+x*w)+'px';}
  const tt=$k('kTime');if(tt)tt.textContent=(x*d).toFixed(2)+'s f'+Math.round(x*d*kFps);
  if(force||playing)kSyncRows();
  const dims=$k('dims');if(dims&&typeof exportDims==='function'){const e=exportDims(+P.pngSize||3000);dims.textContent=e[0]+' × '+e[1];}
  const du=$k('kDur');if(du&&document.activeElement!==du)du.value=+d.toFixed(2);}
function kLoop(){requestAnimationFrame(kLoop);if(playing)kUI(false);}requestAnimationFrame(kLoop);

/* undo / redo */
let kHist=[],kFut=[],kLast='',kTimer=0,kApplying=false;
function kCommit(){if(kApplying)return;clearTimeout(kTimer);kTimer=setTimeout(()=>{const s=JSON.stringify(P);if(s===kLast)return;if(kLast){kHist.push(kLast);if(kHist.length>80)kHist.shift();}kFut=[];kLast=s;kUndoUI();},300);}
function kRestoreSnap(s){if(!KCFG)return;kApplying=true;try{const snap=KCFG.snapshot();snap.P=JSON.parse(s);KCFG.restore(snap);}finally{kApplying=false;}kLast=s;kSel=null;kTL();kUndoUI();}
function kUndo(){if(!kHist.length)return;kFut.push(kLast);kRestoreSnap(kHist.pop());}
function kRedo(){if(!kFut.length)return;kHist.push(kLast);kRestoreSnap(kFut.pop());}
function kUndoUI(){const u=$k('bUndo'),r=$k('bRedo');if(u)u.disabled=!kHist.length;if(r)r.disabled=!kFut.length;}

/* wire everything up */
const _kSet=set;set=function(k,v){_kSet(k,v);if(k===KDUR)kTL();kCommit();};
const _kPanel=renderPanel;renderPanel=function(){_kPanel();kTL();};
const _kControl=control;control=function(it){if(it.t==='range')return rangeEl(it);if(it.t==='status')return document.createComment('status');
  if(it.t==='btn'&&(it.fn===exportPNG||it.fn===record))return document.createComment('export');return _kControl(it);};
status=function(s){toast(s);};
syncPlay=function(){const b=$k('play');if(!b)return;b.innerHTML=playing?'<svg width="12" height="12" viewBox="0 0 12 12"><rect x="2" y="1" width="3" height="10" fill="currentColor"/><rect x="7" y="1" width="3" height="10" fill="currentColor"/></svg>':'<svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 1 L11 6 L2 11Z" fill="currentColor"/></svg>';b.title=playing?'Pause (space)':'Play (space)';b.setAttribute('aria-label',b.title);};
const _kMP=makePresets;makePresets=function(cfg){KCFG=cfg;const r=cfg.restore;cfg.restore=s=>{r(s);if(!kApplying){kSel=null;kTL();kCommit();}};_kMP(cfg);setTimeout(()=>{kLast=JSON.stringify(P);kUndoUI();kTL();},0);};
$k('tStart').addEventListener('click',()=>kSetTime(0));
$k('tPrev').addEventListener('click',()=>kSetTime(kX()*kDur()-1/kFps));
$k('tNext').addEventListener('click',()=>kSetTime(kX()*kDur()+1/kFps));
$k('kDur').addEventListener('change',e=>{const v=Math.max(0.5,Math.min(120,parseFloat(e.target.value)||kDur()));set(KDUR,v);needRender=true;});
$k('kFps').addEventListener('change',e=>{kFps=+e.target.value||30;kUI(true);});
$k('kVal').addEventListener('change',e=>{const tr=kSel&&P.kf[kSel.k];if(!tr)return;const v=parseFloat(e.target.value);if(isNaN(v))return;tr.keys[kSel.i].v=v;needRender=true;kSyncRows();kCommit();});
$k('kEase').addEventListener('change',e=>{const tr=kSel&&P.kf[kSel.k];if(!tr)return;tr.keys[kSel.i].e=e.target.value;needRender=true;kCommit();});
$k('kAll').addEventListener('click',()=>{const tr=kSel&&P.kf[kSel.k];if(!tr)return;const e=tr.keys[kSel.i].e;tr.keys.forEach(q=>q.e=e);needRender=true;toast('Easing applied to every key');kCommit();});
$k('kDel').addEventListener('click',()=>{const tr=kSel&&P.kf[kSel.k];if(!tr)return;tr.keys.splice(kSel.i,1);if(!tr.keys.length)delete P.kf[kSel.k];kSel=null;needRender=true;renderPanel();kCommit();});
$k('bUndo').addEventListener('click',kUndo);$k('bRedo').addEventListener('click',kRedo);
$k('bPng').addEventListener('click',()=>exportPNG());
$k('bMp4').addEventListener('click',e=>record(e.currentTarget));
$k('bPresets').addEventListener('click',e=>{e.stopPropagation();const m=$k('menu');m.hidden=!m.hidden;$k('bPresets').setAttribute('aria-expanded',!m.hidden);});
document.addEventListener('click',e=>{const m=$k('menu');if(!m.hidden&&!m.contains(e.target)&&e.target!==$k('bPresets'))m.hidden=true;});
document.addEventListener('keydown',e=>{const tag=(e.target.tagName||'').toLowerCase();const typing=tag==='input'||tag==='select'||tag==='textarea';
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();e.shiftKey?kRedo():kUndo();return;}
  if(e.key===' '&&!typing&&!(e.target.tagName==='BUTTON')){e.preventDefault();if(recording)return;playing=!playing;syncPlay();needRender=true;}
  if(e.key==='Escape')$k('menu').hidden=true;
  if((e.key==='Delete'||e.key==='Backspace')&&!typing&&kSel){$k('kDel').click();}});
new ResizeObserver(()=>kUI(true)).observe($k('tlBody'));

defaultSrc();P=Object.assign({},BASE);applyShape('burst');syncPlay();
makePresets({key:'form-studio',
  snapshot:()=>({P:JSON.parse(JSON.stringify(P)),media:SRC&&SRC.type==='svg'?{svg:SRC.text}:SRC&&SRC.url?{url:SRC.url}:null}),
  restore:s=>{if(recording)return;P=Object.assign({},BASE,s.P);P.pal=(P.pal||BASE.pal).slice();P.kf=P.kf||{};selKey={};
    const done=()=>{needBuild=true;needRender=true;resizeNeeded=true;renderShapes();renderPanel();};
    if(s.media&&s.media.svg){loadSVG(s.media.svg,'preset');done();}
    else if(s.media&&s.media.url)loadImgURL(s.media.url,cv=>{SRC=imgSrc(cv);SRC.url=s.media.url;customDirty=true;done();});
    else{defaultSrc();customDirty=true;done();}}});

requestAnimationFrame(tick);
})();
</script>
</body>
