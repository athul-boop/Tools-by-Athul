<input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/svg+xml,.svg" hidden>

<script>
(function(){
"use strict";
const TAU=Math.PI*2,DEG=Math.PI/180;

/* ---------- params ---------- */

  colorMode:'faces',colorBy:'world',palette:'tangerine',
  top:'#f4a6f8',left:'#ff5a00',right:'#a09cff',bottom:'#ff5a00',topB:'#ffc800',leftB:'#ff6000',rightB:'#ff8a00',bottomB:'#ff6000',

const PALETTES={
  tangerine:{name:'Tangerine',colorMode:'faces',top:'#f4a6f8',left:'#ff5a00',right:'#a09cff',bottom:'#ff5a00',bgStyle:'solid',bgA:'#ededed',bgB:'#d9d9de'},
  night:{name:'Night stairs',colorMode:'alternate',top:'#f2a0f6',left:'#ff6000',right:'#ff6000',bottom:'#c94a00',topB:'#ffc800',leftB:'#ff6000',rightB:'#ffc800',bottomB:'#c94a00',bgStyle:'solid',bgA:'#2b0a10',bgB:'#1a0508'},
  slab:{name:'Slab',colorMode:'alternate',top:'#f2560c',left:'#ffd000',right:'#3f3a08',bottom:'#2b0a0a',topB:'#f2560c',leftB:'#f08cf0',rightB:'#2b0a0a',bottomB:'#2b0a0a',bgStyle:'solid',bgA:'#c3cede',bgB:'#aebbd0'},
  mono:{name:'Mono',colorMode:'faces',top:'#ffffff',left:'#cfcfd4',right:'#8d8d96',bottom:'#6a6a72',bgStyle:'linear',bgA:'#f3f3f4',bgB:'#dedee3'},
  electric:{name:'Electric',colorMode:'faces',top:'#4a63ff',left:'#00d6a8',right:'#18186a',bottom:'#10104a',bgStyle:'radial',bgA:'#1b1b26',bgB:'#08080c'},
  candy:{name:'Candy palette',colorMode:'palette',pal:['#ff5a00','#f4a6f8','#a09cff','#ffc800'],shade:'#2a0a12',toneL:0.25,toneR:0.5,bgStyle:'solid',bgA:'#eeeeee',bgB:'#dddddd'}
};
const SHAPES={
  burst:{name:'Starburst',desc:'Rays around a hub',preset:{palette:'tangerine',aspect:'4:5',rotX:0,rotY:0,rotZ:0}},
  stack:{name:'Stack',desc:'Layered slabs',preset:{palette:'slab',aspect:'4:5',rotX:0,rotY:0,rotZ:0}},
  bars:{name:'Bars',desc:'Repeating bars and stairs',preset:{palette:'night',aspect:'16:9',rotX:0,rotY:-20,rotZ:-25,barFan:4,barStep:0.05,zoom:1.4}},
  custom:{name:'Your shape',desc:'PNG or SVG, extruded',preset:{palette:'electric',aspect:'1:1',rotX:-20,rotY:25,rotZ:0}}

let P={};
function applyPalette(k){const p=PALETTES[k];if(!p)return;for(const key in p){if(key==='name')continue;P[key]=Array.isArray(p[key])?p[key].slice():p[key];}P.palette=k;}
function applyShape(k){
  const keep={pngSize:P.pngSize||BASE.pngSize,vidSize:P.vidSize||BASE.vidSize,pngAlpha:!!P.pngAlpha};
  P=Object.assign({},BASE,{pal:BASE.pal.slice(),kf:{}},SHAPES[k].preset,{shape:k},keep);applyPalette(P.palette);
  needBuild=true;resizeNeeded=true;selKey={};renderShapes();renderPanel();
}

/* ---------- custom shape source + tracing ---------- */
let SRC=null,CUSTOM={shapes:[]},customDirty=true;
function imgSrc(cv){const d=cv.getContext('2d').getImageData(0,0,cv.width,cv.height).data;const n=cv.width*cv.height;const lum=new Float32Array(n),alp=new Float32Array(n);
  for(let i=0;i<n;i++){lum[i]=(0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2])/255;alp[i]=d[i*4+3]/255;}return{type:'png',w:cv.width,h:cv.height,lum,alp};}
function defaultSrc(){const cv=document.createElement('canvas');cv.width=cv.height=200;const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,200,200);c.fillStyle='#000';c.strokeStyle='#000';
  c.lineWidth=32;c.beginPath();c.arc(100,100,62,0,TAU);c.stroke();c.beginPath();c.arc(100,100,22,0,TAU);c.fill();c.save();c.translate(100,100);c.rotate(-0.7);c.fillRect(-9,-99,18,58);c.restore();SRC=imgSrc(cv);}
function rdp(pts,eps){

  if(dmax>eps){const l=rdp(pts.slice(0,idx+1),eps),r=rdp(pts.slice(idx),eps);return l.slice(0,-1).concat(r);}return[a,b];
}
function simplifyLoop(loop,eps){let far=0,fd=0;for(let i=1;i<loop.length;i++){const d=Math.hypot(loop[i][0]-loop[0][0],loop[i][1]-loop[0][1]);if(d>fd){fd=d;far=i;}}
  const A=rdp(loop.slice(0,far+1),eps),B=rdp(loop.slice(far).concat([loop[0]]),eps);return A.slice(0,-1).concat(B.slice(0,-1));}
function area(l){let s=0;for(let i=0;i<l.length;i++){const a=l[i],b=l[(i+1)%l.length];s+=a[0]*b[1]-b[0]*a[1];}return s/2;}
function inside(pt,l){let c=false;for(let i=0,j=l.length-1;i<l.length;j=i++){const a=l[i],b=l[j];if(((a[1]>pt[1])!==(b[1]>pt[1]))&&(pt[0]<(b[0]-a[0])*(pt[1]-a[1])/(b[1]-a[1])+a[0]))c=!c;}return c;}
function traceSrc(){
  const w=SRC.w,h=SRC.h,bin=new Uint8Array(w*h);
  for(let i=0;i<w*h;i++){const v=SRC.alp[i]*(P.cInvert?SRC.lum[i]:1-SRC.lum[i]);bin[i]=v>P.cThresh?1:0;}
  const g=(x,y)=>(x<0||y<0||x>=w||y>=h)?0:bin[y*w+x];const adj=new Map();const K=(x,y)=>x*65536+y;
  const add=(a,b)=>{const ka=K(a[0],a[1]),kb=K(b[0],b[1]);if(!adj.has(ka))adj.set(ka,[]);if(!adj.has(kb))adj.set(kb,[]);adj.get(ka).push(kb);adj.get(kb).push(ka);};
  for(let y=-1;y<h;y++)for(let x=-1;x<w;x++){
    const id=g(x,y)*8+g(x+1,y)*4+g(x+1,y+1)*2+g(x,y+1);if(id===0||id===15)continue;
    const X=2*x+2,Y=2*y+2,T=[X+1,Y],R=[X+2,Y+1],B=[X+1,Y+2],L=[X,Y+1];
    switch(id){case 1:case 14:add(L,B);break;case 2:case 13:add(B,R);break;case 3:case 12:add(L,R);break;case 4:case 11:add(T,R);break;
      case 5:add(T,L);add(B,R);break;case 6:case 9:add(T,B);break;case 7:case 8:add(T,L);break;case 10:add(T,R);add(L,B);break;}
  }

    for(let guard=0;guard<1e6;guard++){seen.add(cur);loop.push([Math.floor(cur/65536)/2-1,-((cur%65536)/2-1)]);const nb=adj.get(cur);const nx=nb[0]!==prev?nb[0]:nb[1];prev=cur;cur=nx;if(cur===undefined||cur===k||seen.has(cur))break;}

function buildCustom(loops){
  if(!loops.length){CUSTOM.shapes=[];return;}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const l of loops)for(const p of l){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);}
  const s=2.4/Math.max(x1-x0,y1-y0,1e-6),cx=(x0+x1)/2,cy=(y0+y1)/2;
  const N=loops.map(l=>l.map(p=>[(p[0]-cx)*s,(p[1]-cy)*s]));
  const info=N.map((l,i)=>({l,a:Math.abs(area(l)),d:0,i}));
  for(const A of info){const mid=[(A.l[0][0]+A.l[1][0])/2,(A.l[0][1]+A.l[1][1])/2];for(const B of info)if(B!==A&&B.a>A.a&&inside(mid,B.l))A.d++;}

  for(const h of info.filter(x=>x.d%2===1)){const mid=[(h.l[0][0]+h.l[1][0])/2,(h.l[0][1]+h.l[1][1])/2];let best=null;
    for(const o of outer)if(o.d===h.d-1&&o.a>h.a&&inside(mid,o.l)&&(!best||o.a<best.a))best=o;
    if(best)best.shape.holes.push(new THREE.Path(h.l.map(p=>new THREE.Vector2(p[0],p[1]))));}

function loadSVG(text,name){
  if(!THREE.SVGLoader){status('SVG support didn’t load. Try a PNG instead.');return;}
  try{const data=new THREE.SVGLoader().parse(text);const raw=[];
    for(const p of data.paths){const st=p.userData&&p.userData.style;if(st&&st.fill==='none')continue;const shs=THREE.SVGLoader.createShapes?THREE.SVGLoader.createShapes(p):p.toShapes(true);raw.push(...shs);}
    if(!raw.length){status('No filled shapes found in that SVG.');return;}
    const ext=raw.map(s=>s.extractPoints(10));let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(const e of ext)for(const p of e.shape){x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y);}
    const s=2.4/Math.max(x1-x0,y1-y0,1e-6),cx=(x0+x1)/2,cy=(y0+y1)/2;const tf=p=>new THREE.Vector2((p.x-cx)*s,-(p.y-cy)*s);
    CUSTOM.shapes=ext.map(e=>{const sh=new THREE.Shape(e.shape.map(tf));for(const h of e.holes)sh.holes.push(new THREE.Path(h.map(tf)));return sh;});
    SRC={type:'svg',text};customDirty=false;needBuild=true;status('Loaded '+name);renderPanel();
  }catch(err){status('That SVG couldn’t be read. Try exporting it with plain filled paths.');}
}
function loadFile(f){
  const r=new FileReader();
  if(/svg/i.test(f.type)||/\.svg$/i.test(f.name)){r.onload=()=>loadSVG(r.result,f.name);r.readAsText(f);return;}
  r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,180/Math.max(im.width,im.height));const cv=document.createElement('canvas');
    cv.width=Math.max(4,Math.round(im.width*s));cv.height=Math.max(4,Math.round(im.height*s));cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
    SRC=imgSrc(cv);SRC.url=cv.toDataURL();customDirty=true;needBuild=true;status('Loaded '+f.name);renderPanel();};
    im.onerror=()=>status('That file couldn’t be read as an image.');im.src=r.result;};
  r.readAsDataURL(f);
}

/* ---------- three ---------- */
const out=document.getElementById('out'),octx=out.getContext('2d');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setClearColor(0x000000,0);
const scene=new THREE.Scene();const root=new THREE.Group();const group=new THREE.Group();root.add(group);scene.add(root);
const ortho=new THREE.OrthographicCamera(-1,1,1,-1,-100,100),persp=new THREE.PerspectiveCamera(30,1,0.1,300);
const VS=`varying vec3 vW;varying vec3 vL;void main(){vW=normalize(mat3(modelMatrix)*normal);vL=normal;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`;
const FS=`precision mediump float;uniform vec3 uTop,uLeft,uRight,uBottom;uniform float uLocal;varying vec3 vW;varying vec3 vL;
void main(){vec3 n=normalize(mix(vW,vL,uLocal));vec3 a=abs(n);vec3 c;if(a.y>=a.x&&a.y>=a.z)c=n.y>0.0?uTop:uBottom;else if(a.x>=a.z)c=uRight;else c=uLeft;gl_FragColor=vec4(c,1.0);}`;
function makeMat(){return new THREE.ShaderMaterial({vertexShader:VS,fragmentShader:FS,uniforms:{uTop:{value:new THREE.Color()},uLeft:{value:new THREE.Color()},uRight:{value:new THREE.Color()},uBottom:{value:new THREE.Color()},uLocal:{value:0}}});}
const GEO={boxStart:new THREE.BoxGeometry(1,1,1).translate(0.5,0,0),boxCenter:new THREE.BoxGeometry(1,1,1),
  hub:new THREE.CylinderGeometry(1,1,1,64).rotateX(Math.PI/2),round:new THREE.CylinderGeometry(0.5,0.5,1,64),hex:new THREE.CylinderGeometry(0.5,0.5,1,6),tri:new THREE.CylinderGeometry(0.5,0.5,1,3)};
const SHARED=new Set(Object.values(GEO));
let pieces=[],needBuild=true;
function profileGeo(){
  if(P.profile==='custom'&&CUSTOM.shapes.length){const g=new THREE.ExtrudeGeometry(CUSTOM.shapes,{depth:1,bevelEnabled:false,curveSegments:8});g.translate(0,0,-0.5);g.scale(1/2.4,1/2.4,1);g.rotateX(-Math.PI/2);return g;}

}
function rebuild(){
  if((P.shape==='custom'||(P.shape==='stack'&&P.profile==='custom'))&&customDirty&&SRC&&SRC.type==='png'){traceSrc();customDirty=false;}
  for(const pc of pieces){group.remove(pc.mesh);pc.mesh.material.dispose();if(!SHARED.has(pc.mesh.geometry)&&!pc.sharedGeo)pc.mesh.geometry.dispose();}
  if(pieces.sharedProfile&&!SHARED.has(pieces.sharedProfile))pieces.sharedProfile.dispose();

  const add=(kind,geo,extra)=>{const m=new THREE.Mesh(geo,makeMat());group.add(m);pieces.push(Object.assign({kind,mesh:m,rnd:rng()},extra||{}));};
  if(P.shape==='burst'){if(P.hub)add('hub',GEO.hub);for(let i=0;i<(P.rays|0);i++)add('ray',GEO.boxStart);}
  else if(P.shape==='stack'){const g=profileGeo();for(let i=0;i<(P.layers|0);i++)add('layer',g,{sharedGeo:true});pieces.sharedProfile=g;}
  else if(P.shape==='bars'){const g=P.growFrom==='start'?GEO.boxStart:GEO.boxCenter;for(let i=0;i<(P.bars|0);i++)add('bar',g);}
  else{for(const s of CUSTOM.shapes){const g=new THREE.ExtrudeGeometry(s,{depth:1,bevelEnabled:false,curveSegments:8});g.translate(0,0,-0.5);g.computeBoundingBox();const c=new THREE.Vector3();g.boundingBox.getCenter(c);g.translate(-c.x,-c.y,0);add('part',g,{cx:c.x,cy:c.y});}}

  main.forEach((p,i)=>{p.k=i;p.n=n;p.ord=n>1?i/(n-1):0;p.rr=n>1?ranks[i]/(n-1):0;});
  pieces.filter(p=>p.kind==='hub').forEach(p=>{p.k=0;p.n=n;p.ord=0;p.rr=0;});

/* ---------- per-frame layout ---------- */
let t=0,phase=0,MP=0;
function timeline(){const x=((t%P.dur)+P.dur)%P.dur/P.dur;const p=P.playMode==='pingpong'?(x<0.5?x*2:2-x*2):P.playMode==='hold'?Math.min(1,x/0.8):x;return ease(P.easing,p);}
const qBase=new THREE.Quaternion(),qSpin=new THREE.Quaternion(),eul=new THREE.Euler(),AX={x:new THREE.Vector3(1,0,0),y:new THREE.Vector3(0,1,0),z:new THREE.Vector3(0,0,1)};
function layout(){

  qSpin.setFromAxisAngle(AX.y,P.spinTurns*ph);group.quaternion.copy(qBase).multiply(qSpin);
  for(const pc of pieces){
    const m=pc.mesh,o=pc.ord;
    const ext=1-P.extAmt*(0.5-0.5*Math.cos(ph*P.extCycles-o*TAU*P.extRipple));
    const sep=P.sepAmt*(0.5-0.5*Math.cos(ph*P.sepCycles-o*TAU*P.sepRipple));
    let bo=P.buildOrder==='reverse'?1-o:P.buildOrder==='center'?Math.abs(o-0.5)*2:P.buildOrder==='random'?pc.rr:o;if(pc.kind==='hub')bo=0;
    let bl=1;if(P.buildOn){const st=P.buildStagger;bl=ss(0,1,p*(1+st)-bo*st);}
    let x=0,y=0,z=0,rx=0,ry=0,rz=0,sx=1,sy=1,sz=1,ax='x',dx=0,dy=1,dz=0;
    if(pc.kind==='hub'){const R=Math.max(0.03,P.inner+P.rayWidth*0.6);sx=R;sy=R;sz=P.rayDepth;ax='z';dx=0;dy=0;dz=1;}
    else if(pc.kind==='ray'){const n=pc.n,i=pc.k,a=i/n*TAU+P.rayRot*DEG;
      let lf=1;if(P.lenPattern==='alternate')lf=i%2?1-P.lenVar:1;else if(P.lenPattern==='random')lf=1-P.lenVar*pc.rnd;else if(P.lenPattern==='wave')lf=1-P.lenVar*(0.5+0.5*Math.cos(i/n*TAU*3));
      const r0=Math.max(0,P.inner-0.02)+sep;x=Math.cos(a)*r0;y=Math.sin(a)*r0;z=P.stagger*(i%2?0.5:-0.5)*P.rayDepth;rz=a;

  case 'select':{const lab=document.createElement('label');lab.className='ctl';lab.innerHTML='<span class="lab"></span><select></select>';lab.querySelector('.lab').textContent=it.l;
    const s=lab.querySelector('select');if(it.k)s.dataset.k=it.k;for(const[v,l]of it.o){const op=document.createElement('option');op.value=v;op.textContent=l;s.append(op);}
    s.value=String(it.get?it.get():P[it.k]);s.addEventListener('change',()=>{const v=typeof BASE[it.k]==='number'?+s.value:s.value;if(it.setv)it.setv(v);else set(it.k,v);});return lab;}
  case 'seg':{el.className='ctl';el.innerHTML='<span class="lab"></span><span></span><div class="seg" role="group"></div>';el.querySelector('.lab').textContent=it.l;
    const g=el.querySelector('.seg');g.setAttribute('aria-label',it.l);
    for(const[v,l]of it.o){const b=document.createElement('button');b.type='button';b.textContent=l;b.setAttribute('aria-pressed',P[it.k]===v);
      b.addEventListener('click',()=>{g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');set(it.k,v);});g.append(b);}return el;}
  case 'toggle':{const lab=document.createElement('label');lab.className='tog';lab.innerHTML='<span></span><input type="checkbox">';lab.firstChild.textContent=it.l;
    const c=lab.querySelector('input');c.checked=!!P[it.k];c.addEventListener('change',()=>set(it.k,c.checked));return lab;}
  case 'swatches':{el.className='ctl';el.innerHTML='<span class="lab"></span><span></span><div class="sws" style="grid-column:1/-1"></div>';el.querySelector('.lab').textContent=it.l;
    const box=el.querySelector('.sws');for(const[k,l]of it.keys){const w=document.createElement('label');w.className='sw';w.innerHTML='<input type="color"><span></span>';w.lastChild.textContent=l;
      const c=w.querySelector('input');c.value=P[k];c.setAttribute('aria-label',it.l+' '+l);c.addEventListener('input',()=>set(k,c.value));box.append(w);}return el;}
  case 'pal':{el.className='ctl';el.innerHTML='<span class="lab">Palette</span><span></span><div class="sws" style="grid-column:1/-1"></div>';const box=el.querySelector('.sws');
    P.pal.forEach((cv,ix)=>{const w=document.createElement('div');w.className='sw';w.innerHTML='<input type="color"><button type="button" class="x" aria-label="Remove color">×</button>';
      const c=w.querySelector('input');c.value=cv;c.setAttribute('aria-label','Palette color '+(ix+1));c.addEventListener('input',()=>{P.pal[ix]=c.value;P.palette='custom';needRender=true;});
      w.querySelector('button').addEventListener('click',()=>{if(P.pal.length>1){P.pal.splice(ix,1);needRender=true;renderPanel();}});box.append(w);});
    if(P.pal.length<8){const a=document.createElement('button');a.type='button';a.className='gadd';a.textContent='+';a.setAttribute('aria-label','Add color');
      a.addEventListener('click',()=>{const extra=['#3b5bff','#00d6a8','#ff3b6b','#ffc800','#2b0a10','#ffffff'];P.pal.push(extra[P.pal.length%extra.length]);needRender=true;renderPanel();});box.append(a);}return el;}
  case 'file':{const b=document.createElement('button');b.type='button';b.className='btn';b.textContent=it.l;b.style.width='100%';b.addEventListener('click',()=>document.getElementById('file').click());return b;}
  case 'btn':{const b=document.createElement('button');b.type='button';b.className='btn primary';b.textContent=it.l;b.style.width='100%';b.addEventListener('click',()=>it.rec?it.fn(b):it.fn());if(it.rec&&recording)b.disabled=true;return b;}
  case 'btn2':{const b=document.createElement('button');b.type='button';b.className='btn';b.textContent=it.l;b.addEventListener('click',it.fn);return b;}
  case 'note':{const p=document.createElement('p');p.className='note';p.textContent=it.l;return p;}
  case 'sub':{const p=document.createElement('p');p.className='sub';p.textContent=it.l;return p;}
  case 'status':{const p=document.createElement('p');p.className='status';p.setAttribute('role','status');statusEl=p;return p;}
  }
  return el;
}
function renderPanel(){
  const root=document.getElementById('sections');const sc=root.parentElement.scrollTop;root.innerHTML='';
  for(const sec of sections()){if(sec.show&&!sec.show())continue;
    const d=document.createElement('details');d.open=!!openState[sec.id];d.addEventListener('toggle',()=>{openState[sec.id]=d.open;});
    const s=document.createElement('summary');s.textContent=sec.title;d.append(s);const body=document.createElement('div');body.className='body';
    for(const it of sec.items){if(it.show&&!it.show())continue;body.append(control(it));}d.append(body);root.append(d);}
  root.parentElement.scrollTop=sc;document.getElementById('shname').textContent='/ '+SHAPES[P.shape].name;
}
function renderShapes(){const root=document.getElementById('shapes');root.innerHTML='';
  for(const[k,s]of Object.entries(SHAPES)){const b=document.createElement('button');b.type='button';b.className='sh';b.setAttribute('aria-pressed',P.shape===k);
    b.innerHTML='<b></b><small></small>';b.querySelector('b').textContent=s.name;b.querySelector('small').textContent=s.desc;b.addEventListener('click',()=>{if(!recording)applyShape(k);});root.append(b);}}
function syncPlay(){document.getElementById('play').textContent=playing?'Pause':'Play';}
document.getElementById('play').addEventListener('click',()=>{if(recording)return;playing=!playing;syncPlay();needRender=true;});
scrub.addEventListener('input',()=>{if(recording)return;playing=false;syncPlay();t=scrub.value/1000*P.dur;needRender=true;});
document.getElementById('reset').addEventListener('click',()=>{if(!recording)applyShape(P.shape);});
document.getElementById('shuffle').addEventListener('click',()=>{
  const r=Math.random,hsl=(h,s,l)=>'#'+new THREE.Color().setHSL(h,s,l).getHexString();const h=r();
  P.top=hsl(h,0.85,0.78);P.left=hsl((h+0.08+r()*0.1)%1,0.95,0.55);P.right=hsl((h+0.5+r()*0.15)%1,0.8,0.7);P.bottom=hsl(h,0.6,0.25);
  P.topB=hsl((h+0.15)%1,0.95,0.6);P.leftB=P.left;P.rightB=hsl((h+0.3)%1,0.7,0.35);P.bottomB=P.bottom;
  P.pal=[0,1,2,3].map(i=>hsl((h+i*0.17+r()*0.05)%1,0.85,0.6));P.palette='custom';needRender=true;renderPanel();});
document.getElementById('file').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)loadFile(f);e.target.value='';});
let drag=null;
out.addEventListener('pointerdown',e=>{if(recording)return;drag={x:e.clientX,y:e.clientY,ry:P.rotY,rx:P.rotX};out.setPointerCapture(e.pointerId);});
out.addEventListener('pointermove',e=>{if(!drag)return;P.rotY=Math.max(-180,Math.min(180,drag.ry+(e.clientX-drag.x)*0.5));P.rotX=Math.max(-180,Math.min(180,drag.rx+(e.clientY-drag.y)*0.5));syncVal('rotY');syncVal('rotX');needRender=true;});
const endDrag=()=>{drag=null;};out.addEventListener('pointerup',endDrag);out.addEventListener('pointercancel',endDrag);
window.addEventListener('resize',()=>{resizeNeeded=true;needRender=true;});


/* ---------- presets (mine + team) ---------- */
function makePresets(cfg){
  const LS='studio-presets.'+cfg.key,NAME='studio-person';let mine=[];
  try{mine=JSON.parse(localStorage.getItem(LS)||'[]');if(!Array.isArray(mine))mine=[];}catch(e){mine=[];}
  let team=[],teamState='idle',tab='mine',open=true,armed=null,msg='',busy=false;
  const box=document.getElementById('presets');const clone=o=>JSON.parse(JSON.stringify(o));
  const persist=()=>{try{localStorage.setItem(LS,JSON.stringify(mine));return true;}catch(e){msg='Couldn’t store presets in this browser. Use Export to keep them.';return false;}};
  const getName=()=>{try{return localStorage.getItem(NAME)||'';}catch(e){return'';}};
  const setName=v=>{try{localStorage.setItem(NAME,v);}catch(e){}};
  async function api(method,body,qs){const r=await fetch('api/presets?tool='+encodeURIComponent(cfg.key)+(qs||''),{method,credentials:'same-origin',headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
    let j={};try{j=await r.json();}catch(e){}if(!r.ok)throw new Error(j.error||('Request failed ('+r.status+')'));return j;}
  async function loadTeam(){if(location.protocol==='file:'){teamState='off';render();return;}teamState='loading';render();
    try{const j=await api('GET');team=j.presets||[];teamState='ok';}catch(e){teamState='error';msg=e.message;}render();}
  function apply(pr){try{cfg.restore(clone(pr));msg='Applied '+pr.name+'.';}catch(e){msg='That preset couldn’t be applied.';}armed=null;render();}
  async function save(name){
    const snap=Object.assign({name,tool:cfg.key,at:Date.now()},cfg.snapshot());
    if(tab==='mine'){const i=mine.findIndex(p=>p.name===name);if(i>=0){mine[i]=snap;msg='Updated '+name+'.';}else{mine.push(snap);msg='Saved '+name+'.';}persist();render();return;}
    const by=getName().trim();if(!by){msg='Add your name first, so the team knows who saved it.';render();return;}
    snap.by=by;busy=true;msg='Saving to team…';render();
    try{const j=await api('POST',{preset:snap});const old=team.filter(p=>p.name===name&&p.by===by);
      for(const o of old){try{await api('DELETE',null,'&id='+encodeURIComponent(o.id));}catch(e){}}
      team=team.filter(p=>!old.includes(p)).concat([j.preset]);msg=(old.length?'Updated ':'Shared ')+name+' with the team.';}
    catch(e){msg=e.message;}busy=false;render();
  }
  async function remove(ix){
    if(tab==='mine'){const p=mine[ix];mine.splice(ix,1);persist();msg='Deleted '+p.name+'.';armed=null;render();return;}
    const p=team[ix];busy=true;render();
    try{await api('DELETE',null,'&id='+encodeURIComponent(p.id));team.splice(ix,1);msg='Deleted '+p.name+' from team presets.';}catch(e){msg=e.message;}
    busy=false;armed=null;render();
  }
  function render(){
    box.innerHTML='';const d=document.createElement('details');d.open=open;d.addEventListener('toggle',()=>{open=d.open;});
    const s=document.createElement('summary');s.textContent='Presets';d.append(s);const body=document.createElement('div');body.className='body';
    const tabs=document.createElement('div');tabs.className='ptabs';tabs.setAttribute('role','group');tabs.setAttribute('aria-label','Preset library');
    for(const[k,l]of[['mine','Mine'+(mine.length?' '+mine.length:'')],['team','Team'+(teamState==='ok'&&team.length?' '+team.length:'')]]){
      const b=document.createElement('button');b.type='button';b.textContent=l;b.setAttribute('aria-pressed',tab===k);
      b.addEventListener('click',()=>{tab=k;armed=null;msg='';if(k==='team'&&teamState==='idle')loadTeam();else render();});tabs.append(b);}
    body.append(tabs);
    const list=tab==='mine'?mine:team;const chips=document.createElement('div');chips.className='pchips';
    const note=t=>{const p=document.createElement('p');p.className='note';p.textContent=t;chips.append(p);};
    if(tab==='team'&&teamState==='loading')note('Loading team presets…');
    else if(tab==='team'&&teamState==='off')note('Team presets work on the hosted site. Here you can use Mine, or Export and Import files.');
    else if(tab==='team'&&teamState==='error')note('Team presets couldn’t load.');
    else if(!list.length)note(tab==='mine'?'No presets yet. Set things up, name it, and save.':'No team presets yet. Save one here to share it.');
    list.forEach((pr,ix)=>{const c=document.createElement('span');c.className='pchip';
      const a=document.createElement('button');a.type='button';a.textContent=pr.name;a.title='Apply '+pr.name+(pr.by?' (saved by '+pr.by+')':'');
      if(pr.by){const sm=document.createElement('small');sm.textContent=pr.by;a.append(sm);}
      a.addEventListener('click',()=>apply(pr));
      const x=document.createElement('button');x.type='button';x.className='del'+(armed===ix?' arm':'');x.textContent=armed===ix?'delete?':'×';x.setAttribute('aria-label','Delete '+pr.name);x.disabled=busy;
      x.addEventListener('click',()=>{if(armed===ix)remove(ix);else{armed=ix;render();}});c.append(a,x);chips.append(c);});
    body.append(chips);
    const canTeam=!(tab==='team'&&teamState!=='ok');
    if(tab==='team'&&teamState==='ok'){const r=document.createElement('div');r.className='prow';const n=document.createElement('input');n.type='text';n.placeholder='Your name';n.value=getName();n.setAttribute('aria-label','Your name');
      n.addEventListener('input',()=>setName(n.value));r.append(n);body.append(r);}
    if(tab==='team'&&teamState==='error'){const rb=document.createElement('button');rb.type='button';rb.className='btn';rb.textContent='Try again';rb.addEventListener('click',loadTeam);body.append(rb);}
    if(canTeam){const row=document.createElement('div');row.className='prow';const inp=document.createElement('input');inp.type='text';inp.placeholder='Preset name';inp.setAttribute('aria-label','Preset name');
      const sv=document.createElement('button');sv.type='button';sv.className='btn';sv.textContent=tab==='mine'?'Save':'Share';sv.disabled=busy;
      const go=()=>{if(busy)return;const name=(inp.value||'').trim()||('Preset '+(list.length+1));armed=null;save(name);};
      sv.addEventListener('click',go);inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});row.append(inp,sv);body.append(row);}
    if(tab==='mine'){const row2=document.createElement('div');row2.className='prow two';
      const ex=document.createElement('button');ex.type='button';ex.className='btn';ex.textContent='Export';ex.disabled=!mine.length;
      ex.addEventListener('click',()=>{saveFile(cfg.key+'-presets.json',new Blob([JSON.stringify({tool:cfg.key,version:1,presets:mine},null,1)],{type:'application/json'}));msg='Exported '+mine.length+' preset'+(mine.length===1?'':'s')+'.';render();});
      const im=document.createElement('button');im.type='button';im.className='btn';im.textContent='Import';
      const fi=document.createElement('input');fi.type='file';fi.accept='application/json,.json';fi.hidden=true;im.addEventListener('click',()=>fi.click());
      fi.addEventListener('change',()=>{const f=fi.files&&fi.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);const arr=Array.isArray(data)?data:data.presets;
          if(!Array.isArray(arr))throw 0;if(data.tool&&data.tool!==cfg.key){msg='Those presets are for '+data.tool+', not this tool.';render();return;}
          let n=0;for(const p of arr){if(!p||!p.P)continue;const i=mine.findIndex(q=>q.name===p.name);if(i>=0)mine[i]=p;else mine.push(p);n++;}
          persist();msg='Imported '+n+' preset'+(n===1?'':'s')+'.';}catch(e){msg='That file isn’t a presets file.';}render();};r.readAsText(f);fi.value='';});
      row2.append(ex,im,fi);body.append(row2);}
    const st=document.createElement('p');st.className='note';st.setAttribute('role','status');st.textContent=msg;body.append(st);
    d.append(body);box.append(d);
  }
  render();
}
function loadImgURL(url,cb){const im=new Image();im.onload=()=>{const cv=document.createElement('canvas');cv.width=im.width;cv.height=im.height;cv.getContext('2d').drawImage(im,0,0);cb(cv);};im.src=url;}
defaultSrc();P=Object.assign({},BASE);applyShape('burst');syncPlay();
makePresets({key:'form-studio',
  snapshot:()=>({P:JSON.parse(JSON.stringify(P)),media:SRC&&SRC.type==='svg'?{svg:SRC.text}:SRC&&SRC.url?{url:SRC.url}:null}),
  restore:s=>{if(recording)return;P=Object.assign({},BASE,s.P);P.pal=(P.pal||BASE.pal).slice();P.kf=P.kf||{};selKey={};
    const done=()=>{needBuild=true;needRender=true;resizeNeeded=true;renderShapes();renderPanel();};
    if(s.media&&s.media.svg){loadSVG(s.media.svg,'preset');done();}
    else if(s.media&&s.media.url)loadImgURL(s.media.url,cv=>{SRC=imgSrc(cv);SRC.url=s.media.url;customDirty=true;done();});
    else{defaultSrc();customDirty=true;done();}}});

requestAnimationFrame(tick);
})();
