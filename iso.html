<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iso · Tools by Athul</title>
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--grid:#131313;--line:#222;--line2:#363636;--fg:#ececec;--dim:#8c8c8c;--faint:#4f4f4f;--hi:#fff;--inv:#000;--acc:#3D8BFF;
  --sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:12px/1.4 var(--sans);-webkit-font-smoothing:antialiased;
  display:grid;grid-template-columns:240px minmax(0,1fr) 272px;grid-template-rows:44px minmax(0,1fr) var(--tlh,200px);
  grid-template-areas:"top top top" "left stage right" "left tl right";overflow:hidden}
body.tl-closed{--tlh:34px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--hi);outline-offset:1px}
[hidden]{display:none !important}

/* top bar */
.top{grid-area:top;display:flex;align-items:center;gap:6px;padding:0 10px 0 14px;border-bottom:1px solid var(--line);position:relative}
.brand{font-weight:600;font-size:13px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.dims{font-family:var(--mono);color:var(--dim);font-size:11px;margin-left:10px}
.spacer{flex:1}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.btn{height:28px;padding:0 11px;border:1px solid var(--line2);background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;border-radius:0}
.btn:hover{background:var(--hi);color:var(--inv);border-color:var(--hi)}
.btn.solid{background:var(--hi);color:var(--inv);border-color:var(--hi)}
.btn.solid:hover{background:#cfcfcf;border-color:#cfcfcf}
.btn.on{background:var(--hi);color:var(--inv);border-color:var(--hi)}
.btn.icon{width:28px;padding:0}
.btn.sm{height:22px;padding:0 8px;font-size:11px}
.btn.sm.icon{width:22px;padding:0}
.btn svg{flex:none}
.btn:disabled{opacity:.35;pointer-events:none}
.btn svg{display:block}
.tools{display:flex;gap:0;border:1px solid var(--line2)}
.tools .btn{border:0;width:32px;height:28px;padding:0}
.tools .btn+.btn{border-left:1px solid var(--line2)}

/* panels */
.panel{overflow-y:auto;overscroll-behavior:contain;min-height:0}
#left{grid-area:left;border-right:1px solid var(--line);display:flex;flex-direction:column}
#right{grid-area:right;border-left:1px solid var(--line)}
.ph{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 14px;font-weight:500;border-bottom:1px solid var(--line);flex:none}
.ph .acts{display:flex;gap:2px}
.x{width:22px;height:22px;border:0;background:none;cursor:pointer;color:var(--dim);padding:0;display:grid;place-items:center}
.x:hover{color:var(--fg);background:#111}
.sec{border-bottom:1px solid var(--line)}
.sec-h{width:100%;height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 14px;background:none;border:0;cursor:pointer;font-weight:500;text-align:left}
.sec-h:hover{background:#0c0c0c}
.sec-h .chev{font-family:var(--mono);color:var(--dim)}
.sec.closed .sec-b{display:none}
.sec-b{padding:2px 14px 12px;display:grid;gap:6px}
.row{display:grid;grid-template-columns:54px minmax(0,1fr) 14px;column-gap:6px;align-items:center;min-height:22px}
.row .lab{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;gap:4px;align-items:center;min-width:0}
.ctl>*{min-width:0}
.num{width:100%;height:22px;background:transparent;border:1px solid var(--line);font-family:var(--mono);font-size:11px;text-align:right;padding:0 5px;-moz-appearance:textfield;border-radius:0}
.num::-webkit-inner-spin-button,.num::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.num:focus{border-color:var(--line2);outline:none}
.ax{display:flex;align-items:center;flex:1;min-width:0;border:1px solid var(--line)}
.ax span{font-family:var(--mono);font-size:10px;color:var(--faint);padding:0 0 0 5px;cursor:ew-resize;user-select:none}
.ax span:hover{color:var(--fg)}
.ax .num{border:0}
.ax:focus-within{border-color:var(--line2)}
select{height:22px;background:var(--bg);border:1px solid var(--line2);padding:0 6px;width:100%;border-radius:0;cursor:pointer}
.txt{width:100%;height:22px;background:transparent;border:1px solid var(--line);padding:0 6px;border-radius:0}
textarea.txt{height:auto;min-height:56px;font-family:var(--mono);font-size:11px;padding:6px;resize:vertical}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--dim)}
.chk input{appearance:none;-webkit-appearance:none;width:12px;height:12px;border:1px solid var(--line2);margin:0;cursor:pointer;border-radius:0;flex:none}
.chk input:checked{background:var(--fg);border-color:var(--fg)}
.colorrow{display:flex;gap:4px;align-items:center;min-width:0;flex:1}
input[type=color]{-webkit-appearance:none;appearance:none;width:22px;height:22px;flex:none;border:1px solid var(--line2);padding:0;background:none;cursor:pointer;border-radius:0}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
input[type=color]::-webkit-color-swatch{border:0;border-radius:0}
input[type=color]::-moz-color-swatch{border:0;border-radius:0}
.hex{flex:1;height:22px;background:transparent;border:1px solid var(--line);font-family:var(--mono);font-size:11px;padding:0 5px;min-width:0;border-radius:0;text-transform:uppercase}
.swb{width:22px;height:22px;flex:none;border:1px solid var(--line);background:conic-gradient(#10262C 0 25%,#1F5670 0 50%,#6FD3B8 0 75%,#FDD8A0 0);cursor:pointer;padding:0}
.swb:hover{border-color:var(--fg)}
.btnrow{display:flex;gap:4px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line2);flex:1;min-width:0}
.seg button{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;height:20px;border:0;background:none;cursor:pointer;color:var(--dim);font-size:11px;padding:0 4px;border-radius:0;min-width:0;display:grid;place-items:center}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--hi);color:var(--inv)}
.seg button:hover:not(.on){color:var(--fg)}
.hint{color:var(--faint);font-size:11px}
.kf{width:14px;height:14px;padding:0;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.kf::before{content:"";width:7px;height:7px;border:1px solid var(--faint);transform:rotate(45deg)}
.kf:hover::before{border-color:var(--fg)}
.kf.anim::before{border-color:var(--fg)}
.kf.on::before{background:var(--fg);border-color:var(--fg)}
.row.animated .lab{color:var(--fg)}
.bools{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line2)}
.bools button{height:28px;border:0;background:none;cursor:pointer;color:var(--dim);display:grid;place-items:center;padding:0}
.bools button+button{border-left:1px solid var(--line2)}
.bools button:hover{color:var(--hi);background:#111}

/* layers */
.layers{flex:1;overflow:auto;padding:4px 0}
.lrow{display:flex;align-items:center;gap:4px;height:26px;padding-right:6px;cursor:default;color:var(--dim);user-select:none;position:relative}
.lrow:hover{background:#0c0c0c;color:var(--fg)}
.lrow.on{background:#141a24;color:var(--hi)}
.lrow.off .nm{opacity:.4}
.lrow .tw{width:14px;height:14px;border:0;background:none;color:var(--faint);cursor:pointer;padding:0;font-family:var(--mono);font-size:9px;flex:none}
.lrow .g{font-family:var(--mono);font-size:11px;width:14px;text-align:center;color:var(--faint);flex:none}
.lrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .ic{width:20px;height:20px;border:0;background:none;cursor:pointer;color:var(--faint);padding:0;display:grid;place-items:center;visibility:hidden}
.lrow:hover .ic,.lrow .ic.set{visibility:visible}
.lrow .ic:hover{color:var(--fg)}
.lrow input{height:20px;background:var(--bg);border:1px solid var(--line2);flex:1;min-width:0;padding:0 4px}
.lrow.drop-before::before,.lrow.drop-after::after{content:"";position:absolute;left:8px;right:4px;height:2px;background:var(--acc)}
.lrow.drop-before::before{top:-1px}.lrow.drop-after::after{bottom:-1px}
.lrow.drop-in{box-shadow:inset 0 0 0 1px var(--acc)}
.empty{color:var(--faint);padding:10px 14px}

/* stage */
.stage{grid-area:stage;position:relative;overflow:hidden;
  background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;background-position:-1px -1px;touch-action:none}
#sv{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none}
.topts{position:absolute;left:10px;top:10px;display:flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line);padding:4px 6px;max-width:calc(100% - 20px);flex-wrap:wrap}
.topts .lab{color:var(--dim)}
.topts select{width:auto}
.topts .num{width:52px}
.topts .seg{flex:none}
.topts .seg button{padding:0 10px;flex:none}
.stage-meta{position:absolute;left:10px;bottom:10px;font-family:var(--mono);font-size:11px;color:var(--dim);background:var(--bg);padding:2px 6px;border:1px solid var(--line);pointer-events:none}
.stage-meta b{color:#6FD3B8;font-weight:500}
.viewbar{position:absolute;right:10px;bottom:10px;display:flex;gap:4px;background:var(--bg);padding:3px;border:1px solid var(--line)}

/* timeline */
.tl{grid-area:tl;border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tl-bar{height:34px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--line)}
.time{font-family:var(--mono);font-size:11px;min-width:96px;padding-left:4px}
.tl-field{display:flex;align-items:center;gap:6px;color:var(--dim)}
.tl-field .num{width:50px}
.tl-field select{width:auto}
.rec{color:var(--dim)}
.rec.on{color:#ff5a5a;border-color:#ff5a5a}
.tl-body{flex:1;overflow:auto;min-height:0}
.tl-inner{position:relative;min-height:100%}
.tl-row{display:grid;grid-template-columns:170px minmax(0,1fr);height:24px;border-bottom:1px solid var(--line)}
.tl-row.head{position:sticky;top:0;background:var(--bg);z-index:2}
.tl-row.obj .tl-label{color:var(--fg)}
.tl-label{display:flex;align-items:center;gap:4px;padding:0 6px 0 12px;border-right:1px solid var(--line);color:var(--dim);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-label.sub{padding-left:24px}
.lane{position:relative;overflow:visible}
.ruler{position:relative;cursor:ew-resize;overflow:hidden}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line2);font-family:var(--mono);font-size:10px;color:var(--faint);padding:4px 0 0 4px;pointer-events:none}
.key{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:var(--bg);border:1px solid var(--fg);transform:rotate(45deg);cursor:grab;touch-action:none;z-index:1}
.key.sel{background:var(--fg);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--fg)}
.playhead{position:absolute;top:0;bottom:0;width:1px;background:var(--hi);pointer-events:none;z-index:3}
.playhead::before{content:"";position:absolute;top:0;left:-4px;width:9px;height:7px;background:var(--hi)}
.tl-empty{padding:12px;color:var(--faint)}
body.tl-closed .tl-body{display:none}

/* menus, popovers, dialogs */
.menu{position:fixed;z-index:30;min-width:200px;max-height:75vh;overflow:auto;background:var(--bg);border:1px solid var(--line2);display:grid;padding:2px 0}
.menu-h{font-size:11px;color:var(--faint);padding:8px 12px 4px}
.menu-i{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 10px 0 12px;height:28px;background:none;border:0;width:100%;text-align:left;cursor:pointer}
.menu-i:hover{background:#151515}
.menu-i:disabled{opacity:.35;pointer-events:none}
.menu-i small{color:var(--faint);font-family:var(--mono);font-size:10px}
.menu-sep{height:1px;background:var(--line);margin:3px 0}
.pop{position:fixed;z-index:40;background:var(--bg);border:1px solid var(--line2);padding:8px;display:grid;gap:6px}
.pop .sw{display:grid;grid-template-columns:repeat(6,22px);gap:4px}
.pop .sw button{width:22px;height:22px;border:1px solid var(--line2);cursor:pointer;padding:0;border-radius:0}
.pop .sw button:hover{outline:1px solid var(--hi)}
.icongrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.icongrid button{height:40px;border:1px solid var(--line2);background:none;cursor:pointer;color:var(--fg);display:grid;place-items:center;border-radius:0}
.icongrid button:hover{border-color:var(--hi)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;z-index:50}
.ov-box{width:min(560px,calc(100vw - 32px));max-height:86vh;overflow:auto;border:1px solid var(--line2);background:var(--bg);padding:16px;display:grid;gap:12px}
.ov-box h3{margin:0;font-size:13px;font-weight:600}
.ov-box pre{margin:0;font-family:var(--mono);font-size:11px;color:var(--dim);white-space:pre-wrap;background:#0a0a0a;border:1px solid var(--line);padding:10px}
.ov-box table{border-collapse:collapse;width:100%}
.ov-box td{padding:3px 0;border-bottom:1px solid var(--line);color:var(--dim)}
.ov-box td:first-child{font-family:var(--mono);color:var(--fg);width:170px}
.bar{height:2px;background:var(--line2)}.bar i{display:block;height:100%;background:var(--hi);width:0}
.toast{position:fixed;left:50%;bottom:calc(var(--tlh,200px) + 16px);transform:translateX(-50%);background:var(--hi);color:var(--inv);padding:7px 12px;font-size:12px;z-index:60;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (max-width:900px){
  body{grid-template-columns:1fr;grid-template-rows:auto 56vh auto auto auto;grid-template-areas:"top" "stage" "tl" "right" "left";overflow:auto;height:auto}
  .top{flex-wrap:wrap;padding:8px 12px;gap:4px}.dims{display:none}
  #left,#right{border:0;border-top:1px solid var(--line);max-height:none}
  .tl{height:200px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1 15 5v6l-7 4-7-4V5z" fill="none" stroke="#fff" stroke-width="1.2"/><path d="M8 9 15 5M8 9 1 5M8 9v6" stroke="#fff" stroke-width="1.2"/><path d="M8 1 15 5 8 9 1 5z" fill="#6FD3B8"/></svg>
    Iso Studio
  </div>
  <span class="dims" id="dims"></span>
  <span class="spacer"></span>
  <div class="tools" id="tools" role="toolbar" aria-label="Tools"></div>
  <span class="sep"></span>
  <button class="btn" id="bInsert" aria-haspopup="true">Insert</button>
  <span class="spacer"></span>
  <button class="btn icon" id="bUndo" title="Undo (Ctrl/Cmd+Z)" aria-label="Undo"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 3 2 6l3 3"/><path d="M2 6h6.5a3.5 3.5 0 0 1 0 7H6"/></svg></button>
  <button class="btn icon" id="bRedo" title="Redo (Shift+Ctrl/Cmd+Z)" aria-label="Redo"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M9 3l3 3-3 3"/><path d="M12 6H5.5a3.5 3.5 0 0 0 0 7H8"/></svg></button>
  <span class="sep"></span>
  <button class="btn" id="bFile" aria-haspopup="true">File</button>
  <button class="btn solid" id="bExp" aria-haspopup="true">Export</button>
  <button class="btn icon" id="bHelp" title="Shortcuts (?)" aria-label="Help">?</button>
</header>

<aside class="panel" id="left" aria-label="Layers"></aside>

<section class="stage" id="stage">
  <svg id="sv" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="topts" id="topts" hidden></div>
  <div class="stage-meta" id="meta"></div>
  <div class="viewbar">
    <button class="btn sm" id="vRotL" title="Rotate view 90°">⟲</button>
    <button class="btn sm" id="vRotR" title="Rotate view 90°">⟳</button>
    <button class="btn sm solid" id="vIso" title="Snap to exact isometric (I)">Snap iso</button>
    <button class="btn sm" id="vFit" title="Fit to artboard (Shift+1)">Fit</button>
  </div>
</section>

<aside class="panel" id="right" aria-label="Design"></aside>

<section class="tl" id="tl" aria-label="Timeline">
  <div class="tl-bar" id="tlbar"></div>
  <div class="tl-body" id="tlbody"><div class="tl-inner" id="tlinner"></div></div>
</section>

<div class="overlay" id="overlay" hidden><div class="ov-box" id="ovbox"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<input type="file" id="fileSvg" accept=".svg,image/svg+xml" hidden>

<script>
'use strict';
/* =========================================================================
   Iso Studio — isometric illustration tool (single file, no dependencies)
   ========================================================================= */
const D2R=Math.PI/180;
const ISO_PITCH=Math.asin(Math.tan(30*D2R))/D2R; // 35.264° → 30° screen axes
const DIM_PITCH=30;                               // 2:1 pixel isometric
const INK='#10262C';
const PAL=[['#10262C','Dark teal'],['#1F5670','Teal'],['#2C8C9E','Teal mid'],['#6FD3B8','Mint deep'],['#C4F2E3','Mint'],['#FDD8A0','Peach'],
  ['#8A5A12','Amber'],['#FFFFFF','White'],['#F3F5F5','Grey'],['#E9EDED','Line grey'],['#CBEEF8','Light blue'],['#0B2B30','Hero dark']];

/* ---------- vector math ---------- */
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const nrm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l]};
const neg=a=>[-a[0],-a[1],-a[2]];
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const r2=v=>Math.round(v*100)/100;
const fmt=v=>{const n=Math.round(v*1000)/1000;return String(Object.is(n,-0)?0:n)};
const AXV={x:[1,0,0],y:[0,1,0],z:[0,0,1]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function newell(vs){let x=0,y=0,z=0;for(let i=0;i<vs.length;i++){const a=vs[i],b=vs[(i+1)%vs.length];
  x+=(a[1]-b[1])*(a[2]+b[2]);y+=(a[2]-b[2])*(a[0]+b[0]);z+=(a[0]-b[0])*(a[1]+b[1])}
  const l=Math.hypot(x,y,z);return l<1e-10?null:[x/l,y/l,z/l]}
function roleOf(n){if(n[1]>0.7)return 'top';if(n[1]<-0.7)return 'bottom';
  return Math.abs(n[0])>=Math.abs(n[2])?(n[0]>0?'+x':'-x'):(n[2]>0?'+z':'-z')}
function faceAxes(n){const up=Math.abs(n[1])>0.9?[0,0,-1]:[0,1,0];const U=nrm(cross(up,n));return {U,V:cross(n,U)}}

/* =========================================================================
   BSP (used for both CSG booleans and exact back-to-front painting)
   polygon = {v:[[x,y,z]...], n:[...], w:number, m:meta}
   ========================================================================= */
const EPS=1e-5;
function splitPoly(pl,poly,cf,cb,f,b){
  let type=0;const ts=[];
  for(const v of poly.v){const t=dot(pl.n,v)-pl.w;const ty=t<-EPS?2:t>EPS?1:0;type|=ty;ts.push(ty)}
  if(type===0){(dot(pl.n,poly.n)>0?cf:cb).push(poly)}
  else if(type===1)f.push(poly);

/* ---------- history & persistence ---------- */
const hist={stack:[],i:-1};
const snap=()=>JSON.stringify({...S,view:undefined});

  if(hist.stack.length>200)hist.stack.shift();hist.i=hist.stack.length-1;save();updUndo()}
function restore(s){const v=S.view;S=JSON.parse(s);S.view=v;sel=sel.filter(id=>findObj(id));refreshAll()}
function undo(){if(hist.i>0){hist.i--;restore(hist.stack[hist.i]);save();updUndo()}}

function updUndo(){const u=$('bUndo'),r=$('bRedo');if(u)u.disabled=hist.i<=0;if(r)r.disabled=hist.i>=hist.stack.length-1}
let saveT=0;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('isostudio.scene.v2',JSON.stringify(S))}catch(e){}},300)}

  out.grid=Object.assign(newScene().grid,sc&&sc.grid||{});out.timeline=Object.assign(newScene().timeline,sc&&sc.timeline||{});out.floor=Object.assign(newScene().floor,sc&&sc.floor||{});

    if(!o.style)o.style=o.type==='icon'?{faces:{all:{fill:{type:'none'}}},stroke:{on:false}}:presetStyle('outline');

/* =========================================================================
   View & projection
   ========================================================================= */
function makeView(){const v=S.view,y=v.yaw*D2R,p=v.pitch*D2R,z=v.scale;
  const V=[Math.cos(p)*Math.sin(y),Math.sin(p),Math.cos(p)*Math.cos(y)],R=[Math.cos(y),0,-Math.sin(y)],U=cross(V,R);
  const ox=S.artboard.w/2+v.pan[0],oy=S.artboard.h/2+v.pan[1];
  return {V,R,U,z,ox,oy,

    vec:d=>[dot(d,R)*z,-dot(d,U)*z],
    rayPlane(x,y,n,w){const o=add(mul(R,(x-ox)/z),mul(U,-(y-oy)/z));const nv=dot(n,V);if(Math.abs(nv)<1e-6)return null;return add(o,mul(V,(w-dot(n,o))/nv))}}}

  return [dot(U,vw.R)*z,-dot(U,vw.U)*z,dot(V,vw.R)*z,-dot(V,vw.U)*z,vw.ox+w*dot(n,vw.R)*z,vw.oy-w*dot(n,vw.U)*z]}
const isoPitch=()=>S.view.proj==='dimetric'?DIM_PITCH:ISO_PITCH;

/* =========================================================================
   Scene build (cached on geometry signature)
   ========================================================================= */
let SC=null;
function buildScene(list=S.objects){
  const sig=JSON.stringify(list,(k,v)=>(SKIPK.has(k)&&k!=='opacity')?undefined:v);

  const out={solids:[],lines:[]};for(const o of list)collect(o,[0,0,0],o.id,out,'');
  const frags=[];for(const s of out.solids)for(const p of s.polys)frags.push({v:p.v,n:p.n,w:p.w,m:p.mm});
  const bsp=bNode();bspBuild(bsp,frags);
  SC={sig,solids:out.solids,lines:out.lines,bsp};return SC}

/* ---------- occlusion helpers ---------- */
function mkOcc(fr,vw){const n=fr.p.n,nV=fr.nv;if(Math.abs(nV)<1e-4)return null;const z=vw.z;
  const nR=dot(n,vw.R),nU=dot(n,vw.U);const pts=fr.pts;

  return {pts,sg:ar>0?1:-1,bb:[x0,y0,x1,y1],cx:-nR/(z*nV),cy:nU/(z*nV),c0:(fr.p.w+vw.ox*nR/z-vw.oy*nU/z)/nV}}
function makeGrid(items,cell){const g=new Map();items.forEach((it,i)=>{const b=it.bb;

  return {g,cell,stamp:new Uint32Array(items.length),n:0}}
function gridQuery(G,b){const out=[];G.n++;const c=G.cell;
  for(let cx=Math.floor(b[0]/c);cx<=Math.floor(b[2]/c);cx++)for(let cy=Math.floor(b[1]/c);cy<=Math.floor(b[3]/c);cy++){const l=G.g.get(cx*73856+cy*19349663);if(!l)continue;
    for(const i of l)if(G.stamp[i]!==G.n){G.stamp[i]=G.n;out.push(i)}}return out}
function inside(o,x,y){const p=o.pts,L=p.length;for(let i=0;i<L;i++){const a=p[i],b=p[(i+1)%L];const ex=b[0]-a[0],ey=b[1]-a[1];
  const c=(ex*(y-a[1])-ey*(x-a[0]))*o.sg;if(c<=0.02*Math.hypot(ex,ey))return false}return true}

    for(let i=0;i<L;i++){const P=p[i],Qq=p[(i+1)%L];const ex=Qq[0]-P[0],ey=Qq[1]-P[1];const den=dx*ey-dy*ex;if(Math.abs(den)<1e-12)continue;
      const wx=P[0]-a[0],wy=P[1]-a[1];const t=(wx*ey-wy*ex)/den,u=(wx*dy-wy*dx)/den;if(t>1e-6&&t<1-1e-6&&u>=-1e-6&&u<=1+1e-6)ts.push(t)}

/* =========================================================================
   Frame: ordered fragments + clipped edges
   ========================================================================= */
function frame(){
  const list=evalObjects();const sc=buildScene(list),vw=makeView(),BY=indexObjs(list);
  const order=[];bspTraverse(sc.bsp,vw.V,order);
  const sty=new Map();let curA=1;const getSt=(owner,role,a=curA)=>{const k=owner.id+'|'+role+'|'+a;let v=sty.get(k);if(!v){v=fadeStyle(faceStyle(owner,role),a);sty.set(k,v)}return v};
  for(const s of sc.solids){const owner=BY.get(s.oid);s.allOp=!!owner;curA=s.alpha??1;if(owner)for(const sp of s.polys)if(!isOpaque(getSt(owner,sp.role).fill)){s.allOp=false;break}}
  const frs=[];
  for(const p of order){const nv=dot(p.n,vw.V);if(Math.abs(nv)<1e-6)continue;const s=p.m.s,sp=s.polys[p.m.pi],owner=BY.get(s.oid);if(!owner)continue;
    if(nv<0&&s.closed&&s.allOp)continue; // back faces of solid opaque shapes are never seen
    const st=getSt(owner,sp.role,s.alpha??1);frs.push({p,s,sp,owner,st,pts:p.v.map(vw.P),nv,op:isOpaque(st.fill)})}
  const occ=[];for(const fr of frs){if(!fr.op)continue;const o=mkOcc(fr,vw);if(o)occ.push(o)}
  const G=makeGrid(occ,48);const segs=[];
  for(const s of sc.solids){const owner=BY.get(s.oid);if(!owner)continue;const hs=hiddenStyle(owner);curA=s.alpha??1;
    const allOp=s.allOp;
    // see-through shapes: their own front faces still hide their back edges (drawn dashed / solid / not at all)
    let self=null;if(!allOp&&!s.deco){self=[];for(const sp of s.polys){const nv=dot(sp.n,vw.V);if(nv<=1e-6)continue;const o=mkOcc({p:sp,nv,pts:sp.v.map(vw.P)},vw);if(o)self.push(o)}}
    for(const e of s.edges){const fac=e.f.map(pi=>dot(s.polys[pi].n,vw.V)>1e-7);
      if(e.k==='s'&&fac[0]===fac[1])continue;
      const anyF=fac.some(Boolean);if(!anyF&&s.closed&&allOp&&hs.mode==='off')continue;
      const list=anyF?e.f.filter((_,i)=>fac[i]):e.f;let st=null;

      if(!st)continue;

        if(!g[4])segs.push({c:g,st,top:s.top,sk:s.key});
        else if(hs.mode!=='off')segs.push({c:g,st:{color:hs.color,width:hs.width,dash:hs.mode==='dashed'?hs.dash:'',opacity:hs.opacity},top:s.top,hid:1})}}}
  for(const L of sc.lines){const o=BY.get(L.oid);if(!o)continue;const st=Object.assign({on:true,color:'#6FD3B8',width:3,cap:'round'},(o.style||{}).stroke||{});if(!st.on)continue;if((L.alpha??1)<1)st.opacity=(st.opacity??1)*L.alpha;
    const hs=hiddenStyle(o);const W=linePts(o).map(p=>add(p,L.off));
    for(let i=0;i<W.length-1;i++)for(const g of clipSeg(W[i],W[i+1],vw,occ,G)){
      if(!g[4])segs.push({c:g,st,top:L.top});else if(hs.mode!=='off')segs.push({c:g,st:{color:hs.color,width:hs.width,dash:hs.mode==='dashed'?hs.dash:'',opacity:hs.opacity,cap:st.cap},top:L.top,hid:1})}}
  return {vw,frs,segs,sc,BY,list}}
function fadeStyle(st,a){if(a>=0.999)return st;const f=clone(st.fill);
  if(f.type==='solid')f.opacity=(f.opacity??1)*a;else if(f.type==='linear')f.stops=f.stops.map(s=>({...s,o:(s.o??1)*a}));else if(f.type==='hatch'){f.bg=null}

/* ---------- paint (fills, gradients, hatches) ---------- */
function paintCtx(vw,prefix){return {vw,defs:[],map:new Map(),n:0,prefix,id(){return prefix+(this.n++)}}}
const P2=v=>r2(v);
function pathD(pts){let d='M'+P2(pts[0][0])+' '+P2(pts[0][1]);for(let i=1;i<pts.length;i++)d+='L'+P2(pts[i][0])+' '+P2(pts[i][1]);return d+'Z'}
function groupBox(fr,vw,screen){
  const s=fr.s,pis=s.groups.get(fr.sp.gk)||[fr.p.m.pi];
  if(screen){let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
    for(const pi of pis)for(const v of s.polys[pi].v){const q=vw.P(v);x0=Math.min(x0,q[0]);y0=Math.min(y0,q[1]);x1=Math.max(x1,q[0]);y1=Math.max(y1,q[1])}
    return {b:[x0,y0,x1,y1]}}
  const {U,V}=faceAxes(fr.sp.n);let u0=Infinity,v0=Infinity,u1=-Infinity,v1=-Infinity;
  for(const pi of pis)for(const v of s.polys[pi].v){const u=dot(v,U),w=dot(v,V);u0=Math.min(u0,u);v0=Math.min(v0,w);u1=Math.max(u1,u);v1=Math.max(v1,w)}
  return {b:[u0,v0,u1,v1],M:faceMat(U,V,fr.sp.n,fr.sp.w,vw)}}
function paint(fr,ctx){const f=fr.st.fill;if(!f||f.type==='none')return null;
  if(f.type==='solid')return {p:f.color||'#FFFFFF',o:f.opacity??1};
  const key=fr.s.key+'|'+fr.sp.gk+'|'+JSON.stringify(f);let id=ctx.map.get(key);
  if(!id){id=ctx.id();ctx.map.set(key,id);const screen=fr.sp.role==='curve'||f.space==='screen';const gb=groupBox(fr,ctx.vw,screen);const b=gb.b;
    const mat=gb.M?` ${f.type==='linear'?'gradientTransform':'patternTransform'}="matrix(${gb.M.map(x=>+x.toFixed(4)).join(' ')})"`:'';
    if(f.type==='linear'){const a=(f.angle??90)*D2R;const dir=screen?[Math.cos(a),Math.sin(a)]:[Math.cos(a),-Math.sin(a)];
      const cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2,h=Math.abs(dir[0])*(b[2]-b[0])/2+Math.abs(dir[1])*(b[3]-b[1])/2||1;
      const st=f.stops||[{c:'#fff',o:1},{c:INK,o:1}];
      ctx.defs.push(`<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${+(cx-dir[0]*h).toFixed(4)}" y1="${+(cy-dir[1]*h).toFixed(4)}" x2="${+(cx+dir[0]*h).toFixed(4)}" y2="${+(cy+dir[1]*h).toFixed(4)}"${mat}>`+
        st.map((s,i)=>`<stop offset="${s.at??(i/(st.length-1))}" stop-color="${s.c}"${(s.o??1)<1?` stop-opacity="${s.o}"`:''}/>`).join('')+`</linearGradient>`)}
    else if(f.type==='hatch'){const z=ctx.vw.z;const sp=Math.max(0.02,+f.spacing||0.2),lw=+f.width||1;
      if(screen){const H=sp*z;ctx.defs.push(`<pattern id="${id}" patternUnits="userSpaceOnUse" width="10" height="${H}" patternTransform="rotate(${f.angle||0})">${f.bg?`<rect width="10" height="${H}" fill="${f.bg}"/>`:''}<rect width="10" height="${lw}" fill="${f.color||INK}"/></pattern>`)}
      else{const M=gb.M;ctx.defs.push(`<pattern id="${id}" patternUnits="userSpaceOnUse" width="1" height="${sp}" patternTransform="matrix(${M.map(x=>+x.toFixed(4)).join(' ')}) rotate(${f.angle||0})">${f.bg?`<rect x="-.01" width="1.02" height="${sp}" fill="${f.bg}"/>`:''}<rect x="-.01" width="1.02" height="${+(lw/z).toFixed(4)}" fill="${f.color||INK}"/></pattern>`)}}}
  return {p:`url(#${id})`,o:1}}

window.addEventListener('keydown',e=>{

  if(mod&&lk==='u'){e.preventDefault();combine('union');return}
  if(mod&&lk==='a'){e.preventDefault();selectIds(S.objects.map(o=>o.id));return}
  if(mod&&k===']'){e.preventDefault();reorder(e.altKey||e.shiftKey?'front':1);return}
  if(mod&&k==='['){e.preventDefault();reorder(e.altKey||e.shiftKey?'back':-1);return}

  overlayShow(h('h3',null,title),t,h('div',{class:'btnrow'},h('button',{class:'btn solid',onclick:()=>{overlayHide();cb(t.value)}},'Import'),h('button',{class:'btn',onclick:overlayHide},'Cancel')));setTimeout(()=>t.focus(),30)}
function confirmDialog(title,msg,btns){overlayShow(h('h3',null,title),h('div',{style:'color:var(--dim)'},msg),h('div',{class:'btnrow'},btns.map(([l,fn],i)=>h('button',{class:'btn'+(i===0?' solid':''),onclick:()=>{overlayHide();fn()}},l)),h('button',{class:'btn',onclick:overlayHide},'Cancel')))}
function loadTemplate(k){const t=TEMPLATES[k];S=normalizeScene(t.build());sel=[];T=0;refreshAll();fitView();commit();toast(t.label+' loaded')}
function showHelp(){const K=[['V','Select & move (drag empty space to box-select)'],['H / hold Space','Hand: pan'],['O','Orbit camera (Shift snaps)'],['I','Snap to exact isometric'],['Shift+1','Fit to artboard'],
  ['B','Block tool: drag on a face or floor (New / Add to / Cut from)'],['P','Push/pull: drag a face out to extrude, in to cut'],['L','Line on a face'],
  ['Shift+click','Add to selection'],['Double-click','Select inside a group or boolean'],['Enter / Shift+Enter','Select child / parent'],['Alt+drag','Duplicate while moving'],['Arrows (Alt+↑↓ = Y)','Nudge (Shift = ×4)'],
  ['Ctrl/Cmd+G / Shift+G','Group / ungroup'],['Ctrl/Cmd+U','Union'],['Ctrl/Cmd+E','Flatten boolean'],['Ctrl/Cmd+] / [','Layer forward / backward'],['Ctrl/Cmd+D, C, V','Duplicate, copy, paste'],
  ['Shift+Space','Play / pause'],['K','Auto-key on/off'],[', / .','Previous / next frame'],['Delete','Delete layers (or selected keyframes)'],['Right-click','Context menu']];
  overlayShow(h('h3',null,'Shortcuts'),h('table',null,K.map(([a,b])=>h('tr',null,h('td',null,a),h('td',null,b)))),h('h3',null,'JSON format'),h('pre',null,JSON_DOC),
    h('div',{class:'btnrow'},h('button',{class:'btn solid',onclick:overlayHide},'Close')))}
$('bUndo').onclick=undo;$('bRedo').onclick=redo;$('bHelp').onclick=showHelp;
$('vIso').onclick=snapIso;$('vRotL').onclick=()=>rotView(-90);$('vRotR').onclick=()=>rotView(90);$('vFit').onclick=fitView;

/* ---------- MP4 export (WebCodecs + mp4-muxer) ---------- */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load '+src));document.head.append(s)})}
async function exportMP4(){if(!('VideoEncoder' in window)){toast('This browser cannot encode video (try Chrome)');return}
  try{if(!window.Mp4Muxer)await loadScript('https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.js')}catch(e){toast('Video library unavailable offline');return}
  const k=2,W=Math.round(S.artboard.w*k/2)*2,H=Math.round(S.artboard.h*k/2)*2,fps=S.timeline.fps,n=Math.max(1,Math.round(S.timeline.dur*fps));
  const bar=h('div',{class:'bar'},h('i'));overlayShow(h('h3',null,'Rendering MP4…'),bar);
  const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:'avc',width:W,height:H},fastStart:'in-memory'});
  const enc=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>toast(e.message)});
  enc.configure({codec:'avc1.640028',width:W,height:H,bitrate:8e6,framerate:fps});
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');const t0=T;
  for(let i=0;i<n;i++){T=i/fps;const str=exportSVG();const img=new Image();await new Promise(r=>{img.onload=r;img.onerror=r;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(str)});
    g.fillStyle=S.artboard.transparent?'#FFFFFF':S.artboard.bg;g.fillRect(0,0,W,H);g.drawImage(img,0,0,W,H);
    const f=new VideoFrame(cv,{timestamp:Math.round(i*1e6/fps)});enc.encode(f,{keyFrame:i%fps===0});f.close();bar.firstChild.style.width=(100*(i+1)/n)+'%';
    if(enc.encodeQueueSize>8)await new Promise(r=>setTimeout(r,5))}
  await enc.flush();muxer.finalize();T=t0;renderStage();overlayHide();download('iso-animation.mp4',new Blob([muxer.target.buffer],{type:'video/mp4'}));toast('MP4 saved')}

/* ---------- boot ---------- */
(function boot(){let loaded=false;try{const s=localStorage.getItem('isostudio.scene.v2')||localStorage.getItem('isostudio.scene.v1');if(s){S=normalizeScene(JSON.parse(s));loaded=true}}catch(e){}
  renderTools();renderToolOpts();setTool('select');refreshPanels();renderTimeline();
  if(!loaded){S=normalizeScene(TEMPLATES.faq.build());refreshPanels();requestAnimationFrame(()=>{fitView();commit()})}else commit();
  renderStage();updUndo()})();
</script>
