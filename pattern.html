/* ---------- simplex noise ---------- */
const Noise=(function(){

    for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));const t=p[i];p[i]=p[j];p[j]=t;}
    for(let i=0;i<512;i++){perm[i]=p[i&255];pm[i]=perm[i]%12;}}
  const F3=1/3,G3=1/6;
  function n3(x,y,z){
    let n0=0,n1=0,n2=0,n3=0;
    const s=(x+y+z)*F3;const i=Math.floor(x+s),j=Math.floor(y+s),k=Math.floor(z+s);
    const t=(i+j+k)*G3;const x0=x-(i-t),y0=y-(j-t),z0=z-(k-t);
    let i1,j1,k1,i2,j2,k2;
    if(x0>=y0){if(y0>=z0){i1=1;j1=0;k1=0;i2=1;j2=1;k2=0;}else if(x0>=z0){i1=1;j1=0;k1=0;i2=1;j2=0;k2=1;}else{i1=0;j1=0;k1=1;i2=1;j2=0;k2=1;}}
    else{if(y0<z0){i1=0;j1=0;k1=1;i2=0;j2=1;k2=1;}else if(x0<z0){i1=0;j1=1;k1=0;i2=0;j2=1;k2=1;}else{i1=0;j1=1;k1=0;i2=1;j2=1;k2=0;}}
    const x1=x0-i1+G3,y1=y0-j1+G3,z1=z0-k1+G3,x2=x0-i2+2*G3,y2=y0-j2+2*G3,z2=z0-k2+2*G3,x3=x0-1+3*G3,y3=y0-1+3*G3,z3=z0-1+3*G3;
    const ii=i&255,jj=j&255,kk=k&255;
    let t0=0.6-x0*x0-y0*y0-z0*z0;if(t0>0){const gi=pm[ii+perm[jj+perm[kk]]]*3;t0*=t0;n0=t0*t0*(g[gi]*x0+g[gi+1]*y0+g[gi+2]*z0);}
    let t1=0.6-x1*x1-y1*y1-z1*z1;if(t1>0){const gi=pm[ii+i1+perm[jj+j1+perm[kk+k1]]]*3;t1*=t1;n1=t1*t1*(g[gi]*x1+g[gi+1]*y1+g[gi+2]*z1);}
    let t2=0.6-x2*x2-y2*y2-z2*z2;if(t2>0){const gi=pm[ii+i2+perm[jj+j2+perm[kk+k2]]]*3;t2*=t2;n2=t2*t2*(g[gi]*x2+g[gi+1]*y2+g[gi+2]*z2);}
    let t3=0.6-x3*x3-y3*y3-z3*z3;if(t3>0){const gi=pm[ii+1+perm[jj+1+perm[kk+1]]]*3;t3*=t3;n3=t3*t3*(g[gi]*x3+g[gi+1]*y3+g[gi+2]*z3);}
    return 32*(n0+n1+n2+n3);
  }

})();

let IMG=null;
function makeImgData(cv){
  const ctx=cv.getContext('2d');const d=ctx.getImageData(0,0,cv.width,cv.height).data;const n=cv.width*cv.height;
  const lum=new Float32Array(n),alp=new Float32Array(n);
  for(let i=0;i<n;i++){lum[i]=(0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2])/255;alp[i]=d[i*4+3]/255;}

}
function defaultImg(){
  const cv=document.createElement('canvas');cv.width=cv.height=200;const c=cv.getContext('2d');
  c.fillStyle='#fff';c.fillRect(0,0,200,200);c.fillStyle='#000';c.strokeStyle='#000';
  c.lineWidth=30;c.beginPath();c.arc(100,100,64,0,TAU);c.stroke();
  c.beginPath();c.arc(100,100,22,0,TAU);c.fill();
  c.save();c.translate(100,100);c.rotate(-0.7);c.fillRect(-8,-98,16,60);c.restore();
  makeImgData(cv);
}
function loadFile(f){
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const s=Math.min(1,220/Math.max(im.width,im.height));const cv=document.createElement('canvas');
    cv.width=Math.max(2,Math.round(im.width*s));cv.height=Math.max(2,Math.round(im.height*s));
    cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);makeImgData(cv);IMG.url=cv.toDataURL();
    P.shape='png';needStruct=needRender=true;renderPanel();status('Loaded '+f.name);
  };im.onerror=()=>status('That file couldn’t be read as an image. Try a PNG or JPG.');im.src=r.result;};
  r.readAsDataURL(f);
}

const VS_L=`attribute vec3 col;attribute float alp;varying vec3 vC;varying float vA;void main(){vC=col;vA=alp;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`;

class Batch{
  constructor(points){

    this.obj.frustumCulled=false;scene.add(this.obj);
  }
  ensure(cap){

  }

    this.pos[k3]=x;this.pos[k3+1]=y;this.pos[k3+2]=z;this.col[k3]=r;this.col[k3+1]=g;this.col[k3+2]=b;this.alp[k]=a;
    if(this.points)this.siz[k]=s;this.n=k+1;
  }

function shapePos(name,u,v,o){

    case 'vortex':{y=(v-0.5)*2.6;let r=0.16+0.8*Math.pow(Math.max(v-0.36,0)/0.64,1.5);r+=0.82*Math.exp(-Math.pow((v-0.34)/0.075,2));r+=0.14*Math.exp(-Math.pow((v-0.14)/0.1,2));r*=1+0.1*Math.sin(a*2+v*6);x=Math.cos(a)*r;z=Math.sin(a)*r;break;}
    case 'torus':{const b=v*TAU,RR=0.82,rr=0.42;x=(RR+rr*Math.cos(b))*Math.cos(a);z=(RR+rr*Math.cos(b))*Math.sin(a);y=rr*Math.sin(b);break;}
    case 'blob':{const th=v*Math.PI;const dx=Math.sin(th)*Math.cos(a),dy=-Math.cos(th),dz=Math.sin(th)*Math.sin(a);const r=1+0.3*Noise.n3(dx*1.3+5,dy*1.3,dz*1.3);x=dx*r;y=dy*r*1.15;z=dz*r;break;}

    case 'sphere':{const th=v*Math.PI;x=Math.sin(th)*Math.cos(a);y=-Math.cos(th);z=Math.sin(th)*Math.sin(a);break;}
    case 'wave':{x=(u-0.5)*3.2;z=(v-0.5)*3.2;y=0.28*Math.sin(x*2.1)*Math.cos(z*1.5);break;}

}

function buildStruct(){

      {k:'easing',l:'Easing',t:'seg',o:[['linear','Linear'],['in','In'],['out','Out'],['inout','In-out']]},
      R('loop','Duration (s)',2,30,0.5),
      {t:'note',l:'Ambient drift runs underneath every animation:'},
      R('flow','Flow',0,1.5,0.01),R('spin','Spins per loop',-2,2,1),R('twistWave','Twist wave',0,1.5,0.01),R('breathe','Breathe',0,1.5,0.01),R('iridDrift','Color drift',0,2,0.01)]},
    {id:'kf',title:'Keyframes',items:[{t:'note',l:'Pick a setting and give it a start and end value. It moves between them using the timing in Motion.'},{t:'kf'}]},
    {id:'overlay',title:'Overlays',items:[
      {k:'frame',l:'Nested frame',t:'toggle'},R('frameLayers','Frame lines',1,20,1,{show:()=>P.frame}),R('frameDepth','Frame depth',0,0.6,0.01,{show:()=>P.frame}),
      R('scan','Scanlines',0,400,1),R('scanOp','Scanline opacity',0,1,0.01),R('scanBand','Scanline band width',0.05,1,0.01),
      R('glitch','Glitch streak',0,1,0.01),R('glitchY','Streak position',0,1,0.01),R('grain','Grain',0,1,0.01),R('vignette','Vignette',0,1,0.01)]},
    {id:'export',title:'Export',items:[
      {k:'aspect',l:'Aspect ratio',t:'select',o:[['9:16','9:16 story'],['2:3','2:3'],['3:4','3:4 poster'],['4:5','4:5'],['1:1','1:1'],['16:9','16:9']]},
      {k:'pngSize',l:'Image size (long edge)',t:'select',o:[['2000','2000 px'],['3000','3000 px'],['4000','4000 px']]},
      {t:'btn',l:'Save PNG',fn:exportPNG},
      {k:'vidSize',l:'Video size (long edge)',t:'select',o:[['1280','1280 px'],['1920','1920 px']]},
      {t:'btn',l:'Record loop',fn:record,rec:1},
      {t:'note',l:'Video records one full loop in real time, so it starts and ends on the same frame.'},
      {t:'status'}]}
  ];
}
const openState={shape:false,form:false,effect:true,grad:true,motion:true,kf:false,color:false,camera:false,overlay:false,export:false};
function fmt(v,step){const d=step<1?((String(step).split('.')[1]||'').length):0;return(+v).toFixed(d);}
function set(k,v){
  P[k]=v;
  if(['bgStyle','bgA','bgB','lineCol','shadeCol','partCol','blend'].includes(k)&&P.palette!=='custom'){P.palette='custom';const s=document.querySelector('[data-k="palette"]');if(s)s.value='custom';}
  if(STRUCT.has(k))needStruct=true;if(BGK.has(k))needBG=true;
  if(k==='aspect')resizeNeeded=true;
  if(k==='palette'&&PALETTES[v]){Object.assign(P,PALETTES[v]);P.gradColors=PALETTES[v].gradColors.slice();needBG=true;renderPanel();}
  if(RERENDER.has(k))renderPanel();
  needRender=true;
}
function syncVal(k){document.querySelectorAll('[data-k="'+k+'"]').forEach(el=>{if(el.type==='range'){el.value=P[k];const o=el.parentElement.querySelector('output');if(o)o.textContent=fmt(P[k],+el.step);}});}
function control(it){
  const el=document.createElement('div');
  if(it.t==='range'){
    const lab=document.createElement('label');lab.className='ctl';
    lab.innerHTML='<span class="lab"></span><output></output><input type="range">';
    lab.querySelector('.lab').textContent=it.l;const inp=lab.querySelector('input'),o=lab.querySelector('output');
    const cur=it.get?it.get():P[it.k];
    inp.min=it.min;inp.max=it.max;inp.step=it.step;inp.value=cur;if(it.k)inp.dataset.k=it.k;o.textContent=fmt(cur,it.step);
    if(it.k&&P.kf[it.k]){lab.querySelector('.lab').textContent=it.l+' (keyframed)';inp.disabled=true;}
    inp.addEventListener('input',()=>{const v=parseFloat(inp.value);o.textContent=fmt(v,it.step);if(it.setv)it.setv(v);else set(it.k,v);});
    return lab;
  }
  if(it.t==='select'){
    const lab=document.createElement('label');lab.className='ctl';lab.innerHTML='<span class="lab"></span><select></select>';
    lab.querySelector('.lab').textContent=it.l;const s=lab.querySelector('select');s.dataset.k=it.k;
    for(const[v,l]of it.o){const op=document.createElement('option');op.value=v;op.textContent=l;s.append(op);}
    s.value=String(P[it.k]);s.addEventListener('change',()=>set(it.k,typeof BASE[it.k]==='number'?+s.value:s.value));return lab;
  }
  if(it.t==='seg'){
    el.className='ctl';el.innerHTML='<span class="lab"></span><span></span><div class="seg" role="group"></div>';el.querySelector('.lab').textContent=it.l;
    const g=el.querySelector('.seg');g.setAttribute('aria-label',it.l);
    for(const[v,l]of it.o){const b=document.createElement('button');b.type='button';b.textContent=l;b.setAttribute('aria-pressed',P[it.k]===v);
      b.addEventListener('click',()=>{g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');set(it.k,v);});g.append(b);}
    return el;
  }
  if(it.t==='toggle'){
    const lab=document.createElement('label');lab.className='tog';lab.innerHTML='<span></span><input type="checkbox">';lab.firstChild.textContent=it.l;
    const c=lab.querySelector('input');c.checked=!!P[it.k];c.addEventListener('change',()=>set(it.k,c.checked));return lab;
  }
  if(it.t==='text'){
    const lab=document.createElement('label');lab.className='ctl';lab.innerHTML='<span class="lab"></span><input type="text">';lab.querySelector('.lab').textContent=it.l;
    const i=lab.querySelector('input');i.value=P[it.k];i.addEventListener('input',()=>set(it.k,i.value));return lab;
  }
  if(it.t==='colors'){
    el.className='colors';
    for(const[k,l]of[['bgA','Bg 1'],['bgB','Bg 2'],['lineCol','Lines'],['shadeCol','Light'],['partCol','Dust']]){
      const lab=document.createElement('label');lab.className='sw';lab.innerHTML='<input type="color"><span></span>';lab.lastChild.textContent=l;
      const c=lab.querySelector('input');c.value=P[k];c.setAttribute('aria-label',l+' color');c.addEventListener('input',()=>set(k,c.value));el.append(lab);}
    return el;
  }
  if(it.t==='gradcolors'){
    el.className='ctl';el.innerHTML='<span class="lab"></span><span></span><div class="gcols" style="grid-column:1/-1"></div>';el.querySelector('.lab').textContent=it.l;
    const box=el.querySelector('.gcols');
    P.gradColors.forEach((cv,ix)=>{const w=document.createElement('div');w.className='gc';w.innerHTML='<input type="color"><button type="button" aria-label="Remove color">×</button>';
      const c=w.querySelector('input');c.value=cv;c.setAttribute('aria-label','Gradient color '+(ix+1));c.addEventListener('input',()=>{P.gradColors[ix]=c.value;needRender=true;});
      w.querySelector('button').addEventListener('click',()=>{P.gradColors.splice(ix,1);needRender=true;renderPanel();});box.append(w);});
    if(P.gradColors.length<6){const a=document.createElement('button');a.type='button';a.className='gadd';a.textContent='+';a.setAttribute('aria-label','Add color');
      a.addEventListener('click',()=>{const pal=['#5b4fd6','#b35a3a','#e9c25a','#9fb7ff','#ff8fb1','#1fbf9a'];P.gradColors.push(pal[P.gradColors.length%pal.length]);needRender=true;renderPanel();});box.append(a);}
    return el;
  }
  if(it.t==='kf'){
    el.style.display='grid';el.style.gap='8px';
    for(const k of Object.keys(P.kf)){const d=rangeDef(k);if(!d)continue;const f=P.kf[k];
      const box=document.createElement('div');box.className='kf';box.innerHTML='<header><span></span><button type="button">Remove</button></header>';box.querySelector('span').textContent=d.l;
      box.querySelector('button').addEventListener('click',()=>{delete P.kf[k];needRender=true;renderPanel();});
      for(const[side,lab]of[['a','Start'],['b','End']]){const c=control(Object.assign({},d,{l:lab,k:null,get:()=>f[side],setv:v=>{f[side]=v;needRender=true;}}));box.append(c);}
      el.append(box);}
    const lab=document.createElement('label');lab.className='ctl';lab.innerHTML='<span class="lab">Add a setting</span><span></span><select></select>';
    const s=lab.querySelector('select');const o0=document.createElement('option');o0.value='';o0.textContent='Choose…';s.append(o0);
    for(const k of kfKeys()){if(P.kf[k])continue;const d=rangeDef(k);if(!d)continue;const op=document.createElement('option');op.value=k;op.textContent=d.l;s.append(op);}
    s.addEventListener('change',()=>{const k=s.value;if(!k)return;const d=rangeDef(k);const v=P[k];P.kf[k]={a:v,b:Math.min(d.max,Math.max(d.min,v+(d.max-d.min)*0.25))};needRender=true;renderPanel();});
    el.append(lab);return el;
  }
  if(it.t==='file'){
    const b=document.createElement('button');b.type='button';b.className='btn';b.textContent=IMG&&isPng()?'Replace PNG':it.l;b.style.width='100%';
    b.addEventListener('click',()=>document.getElementById('file').click());return b;
  }
  if(it.t==='btn'){
    const b=document.createElement('button');b.type='button';b.className='btn primary';b.textContent=it.l;b.style.width='100%';
    b.addEventListener('click',()=>it.rec?it.fn(b):it.fn());if(it.rec&&recording){b.disabled=true;}return b;
  }
  if(it.t==='note'){const p=document.createElement('p');p.className='note';p.textContent=it.l;return p;}
  if(it.t==='status'){const p=document.createElement('p');p.className='status';p.setAttribute('role','status');statusEl=p;return p;}
  return el;
}
const KF_GENERAL=['twist','noise','bend','scale','orbit','tilt','zoom','posX','posY','lineOp','irid','hueShift','lineTint','gradIntensity','gradSize','gradWidth','gradLength','motionAmt'];
function kfKeys(){const fxk=EFFECTS[P.effect].controls.filter(c=>c.t==='range'&&!c.heavy).map(c=>c.k);return KF_GENERAL.concat(fxk);}
function rangeDef(k){for(const sec of sections())for(const it of sec.items)if(it.t==='range'&&it.k===k)return it;return null;}
function renderPanel(){
  const root=document.getElementById('sections');root.innerHTML='';
  for(const sec of sections()){
    const d=document.createElement('details');d.open=!!openState[sec.id];d.addEventListener('toggle',()=>{openState[sec.id]=d.open;});
    const s=document.createElement('summary');s.textContent=sec.title;d.append(s);
    const body=document.createElement('div');body.className='body';
    for(const it of sec.items){if(it.show&&!it.show())continue;body.append(control(it));}
    d.append(body);root.append(d);
  }
  document.getElementById('fxname').textContent='/ '+EFFECTS[P.effect].name;
}
function renderEffects(){
  const root=document.getElementById('effects');root.innerHTML='';
  for(const[k,e]of Object.entries(EFFECTS)){
    const b=document.createElement('button');b.type='button';b.className='fx';b.setAttribute('aria-pressed',P.effect===k);
    b.innerHTML='<b></b><small></small>';b.querySelector('b').textContent=e.name;b.querySelector('small').textContent=e.desc;
    b.addEventListener('click',()=>{if(!recording)applyEffect(k);});root.append(b);
  }
}
function syncPlay(){document.getElementById('play').textContent=playing?'Pause':'Play';}
document.getElementById('play').addEventListener('click',()=>{if(recording)return;playing=!playing;syncPlay();needRender=true;});
document.getElementById('reset').addEventListener('click',()=>{if(!recording)applyEffect(P.effect);});
document.getElementById('shuffle').addEventListener('click',()=>{
  if(recording)return;const r=Math.random,rs=(a,b,s)=>{const v=a+r()*(b-a);return+(Math.round(v/s)*s).toFixed(4);};
  P.seed=1+Math.floor(r()*998);P.twist=rs(-2.5,2.5,0.01);P.noise=rs(0,0.55,0.01);P.noiseScale=rs(0.6,3,0.01);P.bend=rs(-0.7,0.7,0.01);
  P.hueShift=rs(0,1,0.01);P.tilt=rs(-0.5,0.5,0.01);P.orbit=rs(-1.2,1.2,0.01);
  if(P.shape!=='png'&&r()<0.5){const sh=['vortex','torus','blob','column','sphere','wave','ribbon'];P.shape=sh[Math.floor(r()*sh.length)];}
  for(const it of EFFECTS[P.effect].controls){if(it.t==='range'&&!it.heavy)P[it.k]=rs(it.min,it.max,it.step);
    else if(it.t==='select')P[it.k]=it.o[Math.floor(r()*it.o.length)][0];}
  needStruct=needBG=needRender=true;renderPanel();
});
document.getElementById('file').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)loadFile(f);e.target.value='';});
// drag to orbit
let drag=null;
out.addEventListener('pointerdown',e=>{if(recording)return;drag={x:e.clientX,y:e.clientY,o:P.orbit,t:P.tilt};out.setPointerCapture(e.pointerId);});
out.addEventListener('pointermove',e=>{if(!drag)return;P.orbit=Math.max(-3.14,Math.min(3.14,drag.o+(e.clientX-drag.x)*0.008));P.tilt=Math.max(-1.5,Math.min(1.5,drag.t+(e.clientY-drag.y)*0.008));syncVal('orbit');syncVal('tilt');needRender=true;});
const endDrag=()=>{drag=null;};out.addEventListener('pointerup',endDrag);out.addEventListener('pointercancel',endDrag);
window.addEventListener('resize',()=>{resizeNeeded=true;needRender=true;});


/* ---------- presets (mine + team) ---------- */
function makePresets(cfg){
  const LS='studio-presets.'+cfg.key,NAME='studio-person';let mine=[];
  try{mine=JSON.parse(localStorage.getItem(LS)||'[]');if(!Array.isArray(mine))mine=[];}catch(e){mine=[];}
  let team=[],teamState='idle',tab='mine',open=true,armed=null,msg='',busy=false;
  const box=document.getElementById('presets');const clone=o=>JSON.parse(JSON.stringify(o));
  const persist=()=>{try{localStorage.setItem(LS,JSON.stringify(mine));return true;}catch(e){msg='Couldn’t store presets in this browser. Use Export to keep them.';return false;}};
  const getName=()=>{try{return localStorage.getItem(NAME)||'';}catch(e){return'';}};
  const setName=v=>{try{localStorage.setItem(NAME,v);}catch(e){}};
  async function api(method,body,qs){const r=await fetch('api/presets?tool='+encodeURIComponent(cfg.key)+(qs||''),{method,credentials:'same-origin',headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
    let j={};try{j=await r.json();}catch(e){}if(!r.ok)throw new Error(j.error||('Request failed ('+r.status+')'));return j;}
  async function loadTeam(){if(location.protocol==='file:'){teamState='off';render();return;}teamState='loading';render();
    try{const j=await api('GET');team=j.presets||[];teamState='ok';}catch(e){teamState='error';msg=e.message;}render();}
  function apply(pr){try{cfg.restore(clone(pr));msg='Applied '+pr.name+'.';}catch(e){msg='That preset couldn’t be applied.';}armed=null;render();}
  async function save(name){
    const snap=Object.assign({name,tool:cfg.key,at:Date.now()},cfg.snapshot());
    if(tab==='mine'){const i=mine.findIndex(p=>p.name===name);if(i>=0){mine[i]=snap;msg='Updated '+name+'.';}else{mine.push(snap);msg='Saved '+name+'.';}persist();render();return;}
    const by=getName().trim();if(!by){msg='Add your name first, so the team knows who saved it.';render();return;}
    snap.by=by;busy=true;msg='Saving to team…';render();
    try{const j=await api('POST',{preset:snap});const old=team.filter(p=>p.name===name&&p.by===by);
      for(const o of old){try{await api('DELETE',null,'&id='+encodeURIComponent(o.id));}catch(e){}}
      team=team.filter(p=>!old.includes(p)).concat([j.preset]);msg=(old.length?'Updated ':'Shared ')+name+' with the team.';}
    catch(e){msg=e.message;}busy=false;render();
  }
  async function remove(ix){
    if(tab==='mine'){const p=mine[ix];mine.splice(ix,1);persist();msg='Deleted '+p.name+'.';armed=null;render();return;}
    const p=team[ix];busy=true;render();
    try{await api('DELETE',null,'&id='+encodeURIComponent(p.id));team.splice(ix,1);msg='Deleted '+p.name+' from team presets.';}catch(e){msg=e.message;}
    busy=false;armed=null;render();
  }
  function render(){
    box.innerHTML='';const d=document.createElement('details');d.open=open;d.addEventListener('toggle',()=>{open=d.open;});
    const s=document.createElement('summary');s.textContent='Presets';d.append(s);const body=document.createElement('div');body.className='body';
    const tabs=document.createElement('div');tabs.className='ptabs';tabs.setAttribute('role','group');tabs.setAttribute('aria-label','Preset library');
    for(const[k,l]of[['mine','Mine'+(mine.length?' '+mine.length:'')],['team','Team'+(teamState==='ok'&&team.length?' '+team.length:'')]]){
      const b=document.createElement('button');b.type='button';b.textContent=l;b.setAttribute('aria-pressed',tab===k);
      b.addEventListener('click',()=>{tab=k;armed=null;msg='';if(k==='team'&&teamState==='idle')loadTeam();else render();});tabs.append(b);}
    body.append(tabs);
    const list=tab==='mine'?mine:team;const chips=document.createElement('div');chips.className='pchips';
    const note=t=>{const p=document.createElement('p');p.className='note';p.textContent=t;chips.append(p);};
    if(tab==='team'&&teamState==='loading')note('Loading team presets…');
    else if(tab==='team'&&teamState==='off')note('Team presets work on the hosted site. Here you can use Mine, or Export and Import files.');
    else if(tab==='team'&&teamState==='error')note('Team presets couldn’t load.');
    else if(!list.length)note(tab==='mine'?'No presets yet. Set things up, name it, and save.':'No team presets yet. Save one here to share it.');
    list.forEach((pr,ix)=>{const c=document.createElement('span');c.className='pchip';
      const a=document.createElement('button');a.type='button';a.textContent=pr.name;a.title='Apply '+pr.name+(pr.by?' (saved by '+pr.by+')':'');
      if(pr.by){const sm=document.createElement('small');sm.textContent=pr.by;a.append(sm);}
      a.addEventListener('click',()=>apply(pr));
      const x=document.createElement('button');x.type='button';x.className='del'+(armed===ix?' arm':'');x.textContent=armed===ix?'delete?':'×';x.setAttribute('aria-label','Delete '+pr.name);x.disabled=busy;
      x.addEventListener('click',()=>{if(armed===ix)remove(ix);else{armed=ix;render();}});c.append(a,x);chips.append(c);});
    body.append(chips);
    const canTeam=!(tab==='team'&&teamState!=='ok');
    if(tab==='team'&&teamState==='ok'){const r=document.createElement('div');r.className='prow';const n=document.createElement('input');n.type='text';n.placeholder='Your name';n.value=getName();n.setAttribute('aria-label','Your name');
      n.addEventListener('input',()=>setName(n.value));r.append(n);body.append(r);}
    if(tab==='team'&&teamState==='error'){const rb=document.createElement('button');rb.type='button';rb.className='btn';rb.textContent='Try again';rb.addEventListener('click',loadTeam);body.append(rb);}
    if(canTeam){const row=document.createElement('div');row.className='prow';const inp=document.createElement('input');inp.type='text';inp.placeholder='Preset name';inp.setAttribute('aria-label','Preset name');
      const sv=document.createElement('button');sv.type='button';sv.className='btn';sv.textContent=tab==='mine'?'Save':'Share';sv.disabled=busy;
      const go=()=>{if(busy)return;const name=(inp.value||'').trim()||('Preset '+(list.length+1));armed=null;save(name);};
      sv.addEventListener('click',go);inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});row.append(inp,sv);body.append(row);}
    if(tab==='mine'){const row2=document.createElement('div');row2.className='prow two';
      const ex=document.createElement('button');ex.type='button';ex.className='btn';ex.textContent='Export';ex.disabled=!mine.length;
      ex.addEventListener('click',()=>{saveFile(cfg.key+'-presets.json',new Blob([JSON.stringify({tool:cfg.key,version:1,presets:mine},null,1)],{type:'application/json'}));msg='Exported '+mine.length+' preset'+(mine.length===1?'':'s')+'.';render();});
      const im=document.createElement('button');im.type='button';im.className='btn';im.textContent='Import';
      const fi=document.createElement('input');fi.type='file';fi.accept='application/json,.json';fi.hidden=true;im.addEventListener('click',()=>fi.click());
      fi.addEventListener('change',()=>{const f=fi.files&&fi.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);const arr=Array.isArray(data)?data:data.presets;
          if(!Array.isArray(arr))throw 0;if(data.tool&&data.tool!==cfg.key){msg='Those presets are for '+data.tool+', not this tool.';render();return;}
          let n=0;for(const p of arr){if(!p||!p.P)continue;const i=mine.findIndex(q=>q.name===p.name);if(i>=0)mine[i]=p;else mine.push(p);n++;}
          persist();msg='Imported '+n+' preset'+(n===1?'':'s')+'.';}catch(e){msg='That file isn’t a presets file.';}render();};r.readAsText(f);fi.value='';});
      row2.append(ex,im,fi);body.append(row2);}
    const st=document.createElement('p');st.className='note';st.setAttribute('role','status');st.textContent=msg;body.append(st);
    d.append(body);box.append(d);
  }
  render();
}
function loadImgURL(url,cb){const im=new Image();im.onload=()=>{const cv=document.createElement('canvas');cv.width=im.width;cv.height=im.height;cv.getContext('2d').drawImage(im,0,0);cb(cv);};im.src=url;}
P=Object.assign({},BASE);applyEffect('dissolve');syncPlay();
makePresets({key:'pattern-studio',
  snapshot:()=>({P:JSON.parse(JSON.stringify(P)),media:IMG&&IMG.url?{url:IMG.url}:null}),
  restore:s=>{if(recording)return;P=Object.assign({},BASE,s.P);P.gradColors=(P.gradColors||BASE.gradColors||[]).slice();P.kf=P.kf||{};
    const done=()=>{needStruct=needBG=needRender=true;resizeNeeded=true;renderEffects();renderPanel();};
    if(s.media&&s.media.url)loadImgURL(s.media.url,cv=>{makeImgData(cv);IMG.url=s.media.url;done();});else{defaultImg();done();}}});

requestAnimationFrame(tick);
})();
