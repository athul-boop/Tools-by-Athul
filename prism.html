<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){

let gradDirty=false,underDirty=false,needBG=false;

/* ---------- params ---------- */
const PALS={

  spectra:{name:'Spectra',pal:['#05040a','#2c3fb8','#ff8a1f','#ff3d6e','#f5e9d8','#7b3cff'],bg:'#000000'},
  sunset:{name:'Sunset',pal:['#12060a','#7a1238','#ff5a3d','#ffb35c','#ffe7c2','#3a1a5e'],bg:'#0a0405'},
  mono:{name:'Mono',pal:['#000000','#3a3a3d','#8d8d94','#d9d9de','#ffffff'],bg:'#000000'}
};
const BASE={
  arrange:'stack',look:'blobs',seed:5,
  layers:3,slabW:1.7,slabD:1.7,slabT:0.62,gap:0.14,twist:0,shift:0,
  cols:4,rows:4,cube:0.92,spacing:1,stagger:0.5,density:0.85,sizeVar:0.15,
  palette:'acid',pal:PALS.acid.pal.slice(),wrap:'face',blobs:4,blobR:0.42,blobSharp:0.5,
  streakAng:0,streakFreq:1.2,band:0.35,bandW:0.07,fade:0.5,opacity:1,
  lightAz:-40,lightEl:55,lightInt:2.2,lightCol:'#fff6ec',ambient:0.55,selfLit:0.35,rough:0.85,
  shadows:true,shadowSoft:4,ground:true,groundOp:0.45,edgeAO:0.35,grain:0.3,
  bgStyle:'solid',bgA:'#000000',bgB:'#14141a',
  proj:'iso',camAz:45,camEl:30,zoom:1,fov:30,rotY:0,

  kf:{},aspect:'4:5',pngSize:3000,vidSize:1920

let P={};function freshP(){return JSON.parse(JSON.stringify(BASE));}

/* ---------- three ---------- */
const out=document.getElementById('out'),octx=out.getContext('2d');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setClearColor(0x000000,0);

const amb=new THREE.AmbientLight(0xffffff,0.5);scene.add(amb);

// shared gradient uniforms (one object per uniform, shared by every box)
const SU={uPal:{value:Array.from({length:8},()=>new THREE.Color())},uNP:{value:1},uRamp:{value:rampTex},uLook:{value:0},uSeed:{value:0},uPh:{value:0},uDrift:{value:1},

  uGrain:{value:0},uFrame:{value:0},uEdgeAO:{value:0},uSelfLit:{value:0}};
const GLSL=`
uniform vec3 uPal[8];uniform int uNP;uniform sampler2D uRamp;uniform float uLook,uBox,uSeed,uPh,uDrift,uBlobs,uBlobR,uSharp,uSA,uSF,uFlow,uBand,uBandW,uFade,uWrap,uGrain,uFrame,uEdgeAO,uSelfLit;
varying vec3 vL;varying vec3 vNl;
float pzh(float n){return fract(sin(n*12.9898+uSeed*78.233)*43758.5453);}

vec3 pzGrad(){vec3 an=abs(vNl);float fid=an.x>0.5?(vNl.x>0.0?1.0:2.0):(an.y>0.5?(vNl.y>0.0?3.0:4.0):(vNl.z>0.0?5.0:6.0));

  for(int k=0;k<6;k++){if(float(k)>=uBlobs)break;float hk=fs+float(k)*3.31;float w;
   if(uWrap>0.5){vec3 c=vec3(pzh(hk),pzh(hk+1.3),pzh(hk+2.1))-0.5;c+=0.28*vec3(sin(uPh*uDrift+hk*6.0),cos(uPh*uDrift+hk*4.0),sin(uPh*uDrift+hk*2.0+1.0));

   else{vec2 c=vec2(pzh(hk),pzh(hk+1.3))-0.5;c+=0.3*vec2(sin(uPh*uDrift+hk*6.0),cos(uPh*uDrift+hk*4.0));
    float r=uBlobR*(0.55+0.9*pzh(hk+4.4));vec2 d=fc-c;w=exp(-dot(d,d)/(r*r));}
   w=smoothstep(0.0,mix(1.0,0.35,uSharp),w);col=mix(col,pzp(pzh(hk+5.5)),clamp(w,0.0,1.0));}}
 else{float a=uSA*0.0174533+pzh(fs*3.3)*1.5708*step(0.5,pzh(fs*9.1));float t;vec2 d2=vec2(cos(a),sin(a));

`;
function makeMat(id){const m=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.85,metalness:0});m.userData.box={value:id};
  m.onBeforeCompile=(sh)=>{Object.assign(sh.uniforms,SU);sh.uniforms.uBox=m.userData.box;
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vL;varying vec3 vNl;').replace('#include <begin_vertex>','#include <begin_vertex>\nvL=position;vNl=normal;');
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\n'+GLSL)
      .replace('vec4 diffuseColor = vec4( diffuse, opacity );','vec4 diffuseColor = vec4( pzGrad(), opacity );')

      .replace('#include <dithering_fragment>','#include <dithering_fragment>\ngl_FragColor.rgb += (fract(sin(dot(gl_FragCoord.xy+uFrame,vec2(12.9898,78.233)))*43758.5453)-0.5)*uGrain*0.55;');};

const boxGeo=new THREE.BoxGeometry(1,1,1);
let boxes=[],needBuild=true;
function rebuild(){

  const add=(extra)=>{const id=boxes.length+1;const m=new THREE.Mesh(boxGeo,makeMat(id));m.castShadow=true;m.receiveShadow=true;group.add(m);boxes.push(Object.assign({mesh:m,id,r:rng()},extra));};
  if(P.arrange==='stack'){for(let i=0;i<(P.layers|0);i++)add({k:i,n:P.layers|0});}
  else{const C=P.cols|0,Rn=P.rows|0;for(let r=0;r<Rn;r++)for(let c=0;c<C;c++){if(rng()>P.density)continue;add({c,r,sv:rng()});}}
  needBuild=false;}
let t=0,phase=0;
function timeX(){return((t%P.dur)+P.dur)%P.dur/P.dur;}
function layout(){
  const ph=phase,pals=P.pal.slice(0,8);const look=P.look==='streaks'?1:0;const la=P.lightAng*DEG;const frame=(Math.floor(t*24)%97)*1.37;
  if(P.arrange==='stack'){const n=boxes.length;for(const b of boxes){const c=b.k-(n-1)/2;const gap=P.gap*(1+P.gapPulse*(0.5-0.5*Math.cos(ph)));

  else{const C=P.cols|0,Rn=P.rows|0,sp=P.spacing;for(const b of boxes){const s=Math.min(P.cube,P.spacing*0.96)*(1-P.sizeVar*b.sv);
      b.mesh.position.set((b.c-(C-1)/2)*sp,(b.r-(Rn-1)/2)*sp+P.bob*0.12*Math.sin(ph+b.c*0.7+b.r*1.3),(((b.c+b.r)%2)-0.5)*P.stagger*sp);
      b.mesh.rotation.set(0,0,0);b.mesh.scale.set(s,s,s);}}

  const pals2=pals.length?pals:['#000000'];SU.uNP.value=pals2.length;for(let i=0;i<8;i++)SU.uPal.value[i].set(pals2[i%pals2.length]);
  SU.uLook.value=look;SU.uSeed.value=P.seed;SU.uPh.value=ph;SU.uDrift.value=P.drift;SU.uBlobs.value=P.blobs;SU.uBlobR.value=P.blobR;SU.uSharp.value=P.blobSharp;

}
function cameraFor(W,H){const az=P.camAz*DEG,el=P.camEl*DEG;const dir=new THREE.Vector3(Math.cos(el)*Math.sin(az),Math.sin(el),Math.cos(el)*Math.cos(az));const asp=W/H;

/* ---------- render ---------- */
let RW=800,RH=1000,needRender=true,resizeNeeded=true,rampDirty=true;
function aspectWH(){const[a,b]=P.aspect.split(':').map(Number);return a/b;}
function setSize(W,H){RW=W;RH=H;renderer.setSize(W,H,false);out.width=W;out.height=H;needRender=true;}
function fitPreview(){const wrap=document.getElementById('wrap'),cs=getComputedStyle(wrap);
  const aw=wrap.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),ah=wrap.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const a=aspectWH();let w=aw,h=aw/a;if(h>ah){h=ah;w=ah*a;}w=Math.max(60,Math.floor(w));h=Math.max(60,Math.floor(h));out.style.width=w+'px';out.style.height=h+'px';
  const dpr=Math.min(2,window.devicePixelRatio||1);let W=Math.round(w*dpr),H=Math.round(h*dpr);const cap=1800/Math.max(W,H);if(cap<1){W=Math.round(W*cap);H=Math.round(H*cap);}
  setSize(W,H);resizeNeeded=false;}
function exportDims(long){const a=aspectWH();let W,H;if(a<1){H=long;W=Math.round(long*a);}else{W=long;H=Math.round(long/a);}return[W&~1,H&~1];}

let last=performance.now(),playing=!window.matchMedia('(prefers-reduced-motion: reduce)').matches,recording=false;

/* ---------- saving ---------- */
let statusEl=null;function status(s){if(statusEl)statusEl.textContent=s;}

    try{await d.save({filename:name,data:blob});status('Saved '+name);}catch(e){const c=e&&e.code;status(c==='declined'?'Save cancelled.':c==='rate_limited'?'Another save is open. Try again in a moment.':c==='too_large'?'File too large here. Try a smaller size.':'Saving isn’t available in this view.');}return;}

function extractPalette(im){
  const S=90,sc=Math.min(1,S/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(im.width*sc));cv.height=Math.max(1,Math.round(im.height*sc));
  const c=cv.getContext('2d');c.drawImage(im,0,0,cv.width,cv.height);const d=c.getImageData(0,0,cv.width,cv.height).data;const px=[];
  for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;px.push([d[i],d[i+1],d[i+2]]);}if(px.length<6)throw new Error('few');
  const rng=mulberry(7),k=6;const cent=[px[Math.floor(rng()*px.length)].slice()];
  while(cent.length<k){let tot=0;const dd=px.map(p=>{let m=1e12;for(const c0 of cent){const a=p[0]-c0[0],b=p[1]-c0[1],e=p[2]-c0[2];m=Math.min(m,a*a+b*b+e*e);}tot+=m;return m;});
    let rr=rng()*tot,ix=0;for(;ix<px.length-1;ix++){rr-=dd[ix];if(rr<=0)break;}cent.push(px[ix].slice());}
  let cnt=new Array(k).fill(0);
  for(let it=0;it<14;it++){const sum=cent.map(()=>[0,0,0]);cnt=new Array(k).fill(0);
    for(const p of px){let bi=0,bd=1e12;for(let j=0;j<k;j++){const a=p[0]-cent[j][0],b=p[1]-cent[j][1],e=p[2]-cent[j][2];const q=a*a+b*b+e*e;if(q<bd){bd=q;bi=j;}}sum[bi][0]+=p[0];sum[bi][1]+=p[1];sum[bi][2]+=p[2];cnt[bi]++;}
    for(let j=0;j<k;j++)if(cnt[j])cent[j]=[sum[j][0]/cnt[j],sum[j][1]/cnt[j],sum[j][2]/cnt[j]];}
  const hex=c0=>'#'+c0.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
  const lum=c0=>0.299*c0[0]+0.587*c0[1]+0.114*c0[2];
  P.pal=cent.filter((_,j)=>cnt[j]>0).sort((a,b)=>lum(a)-lum(b)).map(hex);P.palette='custom';
}

function makePresets(cfg){
  const LS='studio-presets.'+cfg.key,NAME='studio-person';let mine=[];
  try{mine=JSON.parse(localStorage.getItem(LS)||'[]');if(!Array.isArray(mine))mine=[];}catch(e){mine=[];}
  let team=[],teamState='idle',tab='mine',open=true,armed=null,msg='',busy=false;
  const box=document.getElementById('presets');const clone=o=>JSON.parse(JSON.stringify(o));
  const persist=()=>{try{localStorage.setItem(LS,JSON.stringify(mine));return true;}catch(e){msg='Couldn’t store presets in this browser. Use Export to keep them.';return false;}};
  const getName=()=>{try{return localStorage.getItem(NAME)||'';}catch(e){return'';}};
  const setName=v=>{try{localStorage.setItem(NAME,v);}catch(e){}};
  async function api(method,body,qs){const r=await fetch('api/presets?tool='+encodeURIComponent(cfg.key)+(qs||''),{method,credentials:'same-origin',headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
    let j={};try{j=await r.json();}catch(e){}if(!r.ok)throw new Error(j.error||('Request failed ('+r.status+')'));return j;}
  async function loadTeam(){if(location.protocol==='file:'){teamState='off';render();return;}teamState='loading';render();
    try{const j=await api('GET');team=j.presets||[];teamState='ok';}catch(e){teamState='error';msg=e.message;}render();}
  function apply(pr){try{cfg.restore(clone(pr));msg='Applied '+pr.name+'.';}catch(e){msg='That preset couldn’t be applied.';}armed=null;render();}
  async function save(name){
    const snap=Object.assign({name,tool:cfg.key,at:Date.now()},cfg.snapshot());
    if(tab==='mine'){const i=mine.findIndex(p=>p.name===name);if(i>=0){mine[i]=snap;msg='Updated '+name+'.';}else{mine.push(snap);msg='Saved '+name+'.';}persist();render();return;}
    const by=getName().trim();if(!by){msg='Add your name first, so the team knows who saved it.';render();return;}
    snap.by=by;busy=true;msg='Saving to team…';render();
    try{const j=await api('POST',{preset:snap});const old=team.filter(p=>p.name===name&&p.by===by);
      for(const o of old){try{await api('DELETE',null,'&id='+encodeURIComponent(o.id));}catch(e){}}
      team=team.filter(p=>!old.includes(p)).concat([j.preset]);msg=(old.length?'Updated ':'Shared ')+name+' with the team.';}
    catch(e){msg=e.message;}busy=false;render();
  }
  async function remove(ix){
    if(tab==='mine'){const p=mine[ix];mine.splice(ix,1);persist();msg='Deleted '+p.name+'.';armed=null;render();return;}
    const p=team[ix];busy=true;render();
    try{await api('DELETE',null,'&id='+encodeURIComponent(p.id));team.splice(ix,1);msg='Deleted '+p.name+' from team presets.';}catch(e){msg=e.message;}
    busy=false;armed=null;render();
  }
  function render(){
    box.innerHTML='';const d=document.createElement('details');d.open=open;d.addEventListener('toggle',()=>{open=d.open;});
    const s=document.createElement('summary');s.textContent='Presets';d.append(s);const body=document.createElement('div');body.className='body';
    const tabs=document.createElement('div');tabs.className='ptabs';tabs.setAttribute('role','group');tabs.setAttribute('aria-label','Preset library');
    for(const[k,l]of[['mine','Mine'+(mine.length?' '+mine.length:'')],['team','Team'+(teamState==='ok'&&team.length?' '+team.length:'')]]){
      const b=document.createElement('button');b.type='button';b.textContent=l;b.setAttribute('aria-pressed',tab===k);
      b.addEventListener('click',()=>{tab=k;armed=null;msg='';if(k==='team'&&teamState==='idle')loadTeam();else render();});tabs.append(b);}
    body.append(tabs);
    const list=tab==='mine'?mine:team;const chips=document.createElement('div');chips.className='pchips';
    const note=t=>{const p=document.createElement('p');p.className='note';p.textContent=t;chips.append(p);};
    if(tab==='team'&&teamState==='loading')note('Loading team presets…');
    else if(tab==='team'&&teamState==='off')note('Team presets work on the hosted site. Here you can use Mine, or Export and Import files.');
    else if(tab==='team'&&teamState==='error')note('Team presets couldn’t load.');
    else if(!list.length)note(tab==='mine'?'No presets yet. Set things up, name it, and save.':'No team presets yet. Save one here to share it.');
    list.forEach((pr,ix)=>{const c=document.createElement('span');c.className='pchip';
      const a=document.createElement('button');a.type='button';a.textContent=pr.name;a.title='Apply '+pr.name+(pr.by?' (saved by '+pr.by+')':'');
      if(pr.by){const sm=document.createElement('small');sm.textContent=pr.by;a.append(sm);}
      a.addEventListener('click',()=>apply(pr));
      const x=document.createElement('button');x.type='button';x.className='del'+(armed===ix?' arm':'');x.textContent=armed===ix?'delete?':'×';x.setAttribute('aria-label','Delete '+pr.name);x.disabled=busy;
      x.addEventListener('click',()=>{if(armed===ix)remove(ix);else{armed=ix;render();}});c.append(a,x);chips.append(c);});
    body.append(chips);
    const canTeam=!(tab==='team'&&teamState!=='ok');
    if(tab==='team'&&teamState==='ok'){const r=document.createElement('div');r.className='prow';const n=document.createElement('input');n.type='text';n.placeholder='Your name';n.value=getName();n.setAttribute('aria-label','Your name');
      n.addEventListener('input',()=>setName(n.value));r.append(n);body.append(r);}
    if(tab==='team'&&teamState==='error'){const rb=document.createElement('button');rb.type='button';rb.className='btn';rb.textContent='Try again';rb.addEventListener('click',loadTeam);body.append(rb);}
    if(canTeam){const row=document.createElement('div');row.className='prow';const inp=document.createElement('input');inp.type='text';inp.placeholder='Preset name';inp.setAttribute('aria-label','Preset name');
      const sv=document.createElement('button');sv.type='button';sv.className='btn';sv.textContent=tab==='mine'?'Save':'Share';sv.disabled=busy;
      const go=()=>{if(busy)return;const name=(inp.value||'').trim()||('Preset '+(list.length+1));armed=null;save(name);};
      sv.addEventListener('click',go);inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});row.append(inp,sv);body.append(row);}
    if(tab==='mine'){const row2=document.createElement('div');row2.className='prow two';
      const ex=document.createElement('button');ex.type='button';ex.className='btn';ex.textContent='Export';ex.disabled=!mine.length;
      ex.addEventListener('click',()=>{saveFile(cfg.key+'-presets.json',new Blob([JSON.stringify({tool:cfg.key,version:1,presets:mine},null,1)],{type:'application/json'}));msg='Exported '+mine.length+' preset'+(mine.length===1?'':'s')+'.';render();});
      const im=document.createElement('button');im.type='button';im.className='btn';im.textContent='Import';
      const fi=document.createElement('input');fi.type='file';fi.accept='application/json,.json';fi.hidden=true;im.addEventListener('click',()=>fi.click());
      fi.addEventListener('change',()=>{const f=fi.files&&fi.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);const arr=Array.isArray(data)?data:data.presets;
          if(!Array.isArray(arr))throw 0;if(data.tool&&data.tool!==cfg.key){msg='Those presets are for '+data.tool+', not this tool.';render();return;}
          let n=0;for(const p of arr){if(!p||!p.P)continue;const i=mine.findIndex(q=>q.name===p.name);if(i>=0)mine[i]=p;else mine.push(p);n++;}
          persist();msg='Imported '+n+' preset'+(n===1?'':'s')+'.';}catch(e){msg='That file isn’t a presets file.';}render();};r.readAsText(f);fi.value='';});
      row2.append(ex,im,fi);body.append(row2);}
    const st=document.createElement('p');st.className='note';st.setAttribute('role','status');st.textContent=msg;body.append(st);
    d.append(body);box.append(d);
  }
  render();
}
function loadImgURL(url,cb){const im=new Image();im.onload=()=>{const cv=document.createElement('canvas');cv.width=im.width;cv.height=im.height;cv.getContext('2d').drawImage(im,0,0);cb(cv);};im.src=url;}
P=freshP();renderPanel();syncPlay();
makePresets({key:'prism-studio',snapshot:()=>({P:JSON.parse(JSON.stringify(P))}),
  restore:s=>{if(recording)return;P=Object.assign(freshP(),s.P);P.kf=P.kf||{};selKey={};needBuild=true;rampDirty=true;needRender=true;resizeNeeded=true;renderPanel();}});
requestAnimationFrame(tick);
})();

</script>
</body>
