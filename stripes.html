<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stripes · Tools by Athul</title>
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.js"></script>
<style>
:root{
  --bg:#000;--grid:#131313;--line:#222;--line2:#363636;--fg:#ececec;--dim:#8c8c8c;--faint:#4f4f4f;--hi:#fff;--inv:#000;
  --sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:12px/1.4 var(--sans);-webkit-font-smoothing:antialiased;
  display:grid;grid-template-columns:300px minmax(0,1fr);grid-template-rows:44px minmax(0,1fr) 220px;
  grid-template-areas:"top top" "panel stage" "panel tl";overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--hi);outline-offset:1px}

.top{grid-area:top;display:flex;align-items:center;gap:6px;padding:0 10px 0 14px;border-bottom:1px solid var(--line);position:relative}
.brand{font-weight:600;font-size:13px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.crumb{color:var(--faint);font-size:13px}
.tname{font-weight:600;font-size:13px;letter-spacing:-.01em}
.brand{text-decoration:none;color:inherit}.brand:hover{color:var(--hi)}
.dims{font-family:var(--mono);color:var(--dim);font-size:11px;margin-left:10px}
.spacer{flex:1}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.btn{height:28px;padding:0 11px;border:1px solid var(--line2);background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;border-radius:0}
.btn:hover{background:var(--hi);color:var(--inv);border-color:var(--hi)}
.btn.solid{background:var(--hi);color:var(--inv);border-color:var(--hi)}
.btn.solid:hover{background:#cfcfcf;border-color:#cfcfcf}
.btn.icon{width:28px;padding:0}
.btn.sm{height:22px;padding:0 8px;font-size:11px}
.btn:disabled{opacity:.35;pointer-events:none}
.btn svg{display:block}

.panel{grid-area:panel;border-right:1px solid var(--line);overflow-y:auto;overscroll-behavior:contain}
.sec{border-bottom:1px solid var(--line)}
.sec-h{width:100%;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:none;border:0;cursor:pointer;font-weight:500;text-align:left}
.sec-h:hover{background:#0c0c0c}
.sec-h .chev{font-family:var(--mono);color:var(--dim)}
.sec.closed .sec-b{display:none}
.sec-b{padding:4px 14px 14px;display:grid;gap:10px}
.sub{font-size:11px;color:var(--fg);padding-top:10px;border-top:1px solid var(--line);margin-top:2px}
[hidden]{display:none !important}
.row{display:grid;grid-template-columns:16px minmax(0,1fr) 58px;column-gap:6px;row-gap:3px;align-items:center}
.row .lab{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.range input[type=range]{grid-column:2/4}
.row.sel{grid-template-columns:16px 96px minmax(0,1fr)}
.row.full{grid-template-columns:16px minmax(0,1fr)}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line2)}
input[type=range]::-moz-range-track{height:1px;background:var(--line2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;background:var(--fg);border:0;margin-top:-4px;border-radius:0}
input[type=range]::-moz-range-thumb{width:9px;height:9px;background:var(--fg);border:0;border-radius:0}
input[type=range]:hover::-webkit-slider-thumb{background:var(--hi)}
.num{width:100%;height:20px;background:transparent;border:1px solid var(--line);font-family:var(--mono);font-size:11px;text-align:right;padding:0 5px;-moz-appearance:textfield;border-radius:0}
.num::-webkit-inner-spin-button,.num::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.num:focus{border-color:var(--line2)}
select{height:24px;background:var(--bg);border:1px solid var(--line2);padding:0 6px;width:100%;border-radius:0;cursor:pointer}
.kf{width:14px;height:14px;padding:0;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.kf::before{content:"";width:7px;height:7px;border:1px solid var(--faint);transform:rotate(45deg)}
.kf:hover::before{border-color:var(--fg)}
.kf.anim::before{border-color:var(--fg)}
.kf.on::before{background:var(--fg)}
.row.animated .lab{color:var(--fg)}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;grid-column:2/4;color:var(--dim)}
.chk input{appearance:none;-webkit-appearance:none;width:12px;height:12px;border:1px solid var(--line2);margin:0;cursor:pointer;border-radius:0}
.chk input:checked{background:var(--fg);border-color:var(--fg)}
.colorrow{display:flex;gap:6px;align-items:center;min-width:0}
input[type=color]{-webkit-appearance:none;appearance:none;width:24px;height:20px;flex:none;border:1px solid var(--line2);padding:0;background:none;cursor:pointer;border-radius:0}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
input[type=color]::-webkit-color-swatch{border:0;border-radius:0}
input[type=color]::-moz-color-swatch{border:0;border-radius:0}
.hex{flex:1;height:20px;background:transparent;border:1px solid var(--line);font-family:var(--mono);font-size:11px;padding:0 5px;min-width:0;border-radius:0}
.pal{display:grid;gap:4px}
.pal-row{display:grid;grid-template-columns:24px minmax(0,1fr) 44px 20px;gap:4px;align-items:center}
.x{width:20px;height:20px;border:1px solid var(--line);background:none;cursor:pointer;color:var(--dim);padding:0;font-family:var(--mono);line-height:1}
.x:hover{color:var(--fg);border-color:var(--line2)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.hint{color:var(--faint);font-size:11px}
.imgbox{display:flex;gap:8px;align-items:center}
.thumb{width:40px;height:40px;border:1px solid var(--line2);background:#0a0a0a;flex:none;overflow:hidden}

.stage{grid-area:stage;position:relative;display:grid;place-items:center;overflow:hidden;
  background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;background-position:-1px -1px}
#cv{display:block;box-shadow:0 0 0 1px var(--line2);background:repeating-conic-gradient(#262626 0 25%,#161616 0 50%) 0 0/16px 16px}
.vars{border-bottom:1px solid var(--line);padding:12px 14px 14px;display:grid;gap:8px}
.vars-h{display:flex;justify-content:space-between;align-items:baseline;font-weight:500}
.vars-h small{font-weight:400;color:var(--faint);font-size:11px}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.vtile{position:relative;border:1px solid var(--line2);background:none;padding:0;cursor:pointer;text-align:left;display:grid;color:var(--dim);min-width:0;border-radius:0}
.vtile canvas{display:block;width:100%;height:52px;background:repeating-conic-gradient(#222 0 25%,#151515 0 50%) 0 0/10px 10px}
.vtile .vn{padding:5px 7px;font-size:11px;border-top:1px solid var(--line2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtile:hover{border-color:var(--faint)}
.vtile.on{border-color:var(--hi);color:var(--fg)}
.vtile.on .vn{background:var(--hi);color:var(--inv)}
.vtile .vx{position:absolute;top:3px;right:3px;width:18px;height:18px;display:none;place-items:center;background:var(--bg);border:1px solid var(--line2);color:var(--dim);font-family:var(--mono);font-size:11px}
.vtile:hover .vx,.vtile:focus-visible .vx{display:grid}
.vtile .vx:hover{color:var(--fg);border-color:var(--fg)}
@media (hover:none){.vtile .vx{display:grid}}
.vrow{display:flex;gap:6px}
.vrow .hex{height:22px}
.stage-meta{position:absolute;left:12px;bottom:10px;font-family:var(--mono);font-size:11px;color:var(--dim);background:var(--bg);padding:2px 6px;border:1px solid var(--line)}

.tl{grid-area:tl;border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tl-bar{min-height:40px;flex:none;display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.time{font-family:var(--mono);font-size:11px;min-width:118px;padding-left:6px}
.tl-field{display:flex;align-items:center;gap:6px;color:var(--dim)}
.tl-field .num{width:52px}
.tl-field select{width:auto}
.insp{display:flex;align-items:center;gap:6px;border-left:1px solid var(--line);padding-left:10px;margin-left:4px}
.insp[hidden]{display:none}
.insp .name{font-family:var(--mono);font-size:11px;white-space:nowrap}
.insp .num{width:64px}
.tl-body{flex:1;overflow:auto;min-height:0}
.tl-inner{position:relative;min-height:100%}
.tl-row{display:grid;grid-template-columns:170px minmax(0,1fr);height:26px;border-bottom:1px solid var(--line)}
.tl-row.head{position:sticky;top:0;background:var(--bg);z-index:2;height:24px}
.tl-label{display:flex;align-items:center;gap:3px;padding:0 6px 0 12px;border-right:1px solid var(--line);color:var(--dim);min-width:0}
.tl-label span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.tl-label span:hover{color:var(--fg)}
.tl-label .x{width:18px;height:18px;font-size:10px}
.lane{position:relative;cursor:crosshair;overflow:visible}
.ruler{position:relative;cursor:ew-resize;overflow:hidden}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line2);font-family:var(--mono);font-size:10px;color:var(--faint);padding:5px 0 0 4px;pointer-events:none}
.key{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:var(--bg);border:1px solid var(--fg);transform:rotate(45deg);cursor:grab;touch-action:none}
.key.sel{background:var(--fg);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--fg)}
.playhead{position:absolute;top:0;bottom:0;width:1px;background:var(--hi);pointer-events:none;z-index:3}
.playhead::before{content:"";position:absolute;top:0;left:-4px;width:9px;height:7px;background:var(--hi)}
.tl-empty{padding:14px 12px;color:var(--faint)}

.menu{position:absolute;top:40px;right:10px;z-index:20;width:300px;max-width:calc(100vw - 20px);max-height:70vh;overflow:auto;background:var(--bg);border:1px solid var(--line2);display:grid}
.menu[hidden]{display:none}
.menu-h{font-size:11px;color:var(--dim);padding:10px 12px 6px}
.menu-i{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 6px 0 12px;height:30px;background:none;border:0;border-top:1px solid var(--line);width:100%;text-align:left;cursor:pointer}
.menu-i:hover{background:#111}
.menu-row{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-top:1px solid var(--line)}
.menu-row .hex{flex:1 1 140px}
.menu-row .hex{height:28px}
.menu-empty{padding:0 12px 10px;color:var(--faint)}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;z-index:50}
.overlay[hidden]{display:none}
.ov-box{width:300px;border:1px solid var(--line2);background:var(--bg);padding:16px;display:grid;gap:12px}
.bar{height:2px;background:var(--line2)}
.bar i{display:block;height:100%;background:var(--hi);width:0}
.toast{position:fixed;left:50%;bottom:calc(240px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--hi);color:var(--inv);padding:7px 12px;font-size:12px;z-index:60;pointer-events:none;opacity:0;transition:opacity .15s}
.toast.show{opacity:1}

@media (max-width:860px){
  body{display:block;height:auto;overflow:auto}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
  .top{flex-wrap:wrap;padding:8px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
  .dims{display:none}
  .stage{height:56vh}
  .tl{height:250px}
  .panel{border-right:0}
  .tl-row{grid-template-columns:120px minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./" title="All tools"><svg width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><g stroke="currentColor" stroke-width="2.4" fill="none"><path d="M8 26 L16 6 L24 26"/><path d="M11 19 H21"/></g></svg>Tools</a><span class="crumb">/</span><span class="tname">Stripes</span>
  <span class="dims" id="dims"></span>
  <span class="spacer"></span>
  <button class="btn icon" id="bUndo" title="Undo (Ctrl or Cmd + Z)" aria-label="Undo" disabled><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 3 L2 6 L5 9"/><path d="M2 6 H9 a3 3 0 0 1 0 6 H6"/></svg></button>
  <button class="btn icon" id="bRedo" title="Redo (Shift + Ctrl or Cmd + Z)" aria-label="Redo" disabled><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" transform="scale(-1,1)"><path d="M5 3 L2 6 L5 9"/><path d="M2 6 H9 a3 3 0 0 1 0 6 H6"/></svg></button>
  <span class="sep"></span>
  <button class="btn" id="bRandom" title="Shuffle seed and shape">Randomize</button>
  <button class="btn" id="bPresets" aria-haspopup="true">Presets</button>
  <span class="sep"></span>
  <button class="btn" id="bPng">PNG</button>
  <button class="btn" id="bSvg">SVG</button>
  <button class="btn solid" id="bMp4">MP4</button>
  <div class="menu" id="menu" hidden></div>
</header>

<aside class="panel" id="panel" aria-label="Pattern settings"></aside>

<section class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="stage-meta" id="meta"></div>
</section>

<section class="tl" aria-label="Timeline">
  <div class="tl-bar">
    <button class="btn icon" id="tStart" title="Go to start"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="1" width="1.5" height="10" fill="currentColor"/><path d="M11 1 L4 6 L11 11Z" fill="currentColor"/></svg></button>
    <button class="btn icon" id="tPrev" title="Previous frame"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M9 1 L3 6 L9 11Z" fill="currentColor"/></svg></button>
    <button class="btn icon" id="tPlay" title="Play (space)"></button>
    <button class="btn icon" id="tNext" title="Next frame"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 1 L9 6 L3 11Z" fill="currentColor"/></svg></button>
    <span class="time" id="tTime"></span>
    <label class="tl-field">Length <input class="num" id="tDur" type="number" min="0.5" max="120" step="0.5"> s</label>
    <label class="tl-field">Rate <select id="tFps"><option>24</option><option>25</option><option>30</option><option>50</option><option>60</option></select></label>
    <div class="insp" id="insp" hidden>
      <span class="name" id="iName"></span>
      <input class="num" id="iVal" type="number" step="any" title="Key value">
      <select id="iEase" title="Easing to next key">
        <option value="linear">Linear</option><option value="easeIn">Ease in</option><option value="easeOut">Ease out</option><option value="easeInOut">Ease in out</option><option value="hold">Hold</option>
      </select>
      <button class="btn sm" id="iAll" title="Use this easing on every key of this setting">Apply to all</button>
      <button class="btn sm" id="iDel">Delete key</button>
    </div>
  </div>
  <div class="tl-body" id="tlBody">
    <div class="tl-inner" id="tlInner">
      <div class="tl-row head"><div class="tl-label">Keyframes</div><div class="ruler" id="ruler"></div></div>
      <div id="tracks"></div>
      <div class="playhead" id="playhead"></div>
    </div>
  </div>
</section>

<div class="overlay" id="ov" hidden>
  <div class="ov-box">
    <div id="ovText">Encoding</div>
    <div class="bar"><i id="ovBar"></i></div>
    <div><button class="btn sm" id="ovCancel">Cancel</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="fileImg" accept="image/*,video/*" hidden>
<input type="file" id="fileRev" accept="image/*" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const frac = x => x - Math.floor(x);

/* ---------- Settings schema ---------- */
const R = (key, label, min, max, step, def, extra) => Object.assign({ type: 'range', key, label, min, max, step, def }, extra || {});
const SCHEMA = [
  { title: 'Canvas', items: [
    { type: 'sizePreset', label: 'Size' },
    R('width', 'Width', 64, 4096, 1, 1060, { anim: false }),
    R('height', 'Height', 64, 4096, 1, 1162, { anim: false }),
    R('padX', 'Inset x', 0, 0.45, 0.005, 0, { show: p => p.layout !== 'radial' }),
    R('padY', 'Inset y', 0, 0.45, 0.005, 0, { show: p => p.layout !== 'radial' }),
    R('padTop', 'Top space', 0, 0.9, 0.005, 0, { show: p => p.layout !== 'radial' }),
    { type: 'select', key: 'orient', label: 'Direction', def: 'v', options: [['v', 'Vertical bars'], ['h', 'Horizontal bars']], show: p => p.layout !== 'radial' },
  ]},
  { title: 'Grid', items: [
    { type: 'select', key: 'layout', label: 'Layout', def: 'stacks', options: [['stacks', 'Stacks'], ['radial', 'Radial burst']] },
    R('cols', 'Columns', 1, 300, 1, 29, { show: p => !p.sizePx }),
    R('rows', 'Rows', 1, 120, 1, 11, { show: p => !p.sizePx }),
    R('colW', 'Column width (px)', 4, 400, 1, 45, { show: p => p.sizePx }),
    R('rowH', 'Row height (px)', 4, 2000, 1, 160, { show: p => p.sizePx }),
    R('rowGap', 'Row gap', 0, 80, 0.5, 0),
    R('rowVar', 'Row height mix', 0, 1, 0.01, 0),
    R('colGrowth', 'Column growth', 0.25, 4, 0.01, 1),
    R('growEvery', 'Rows per growth step', 1, 20, 1, 1),
    R('rowGrowth', 'Row size growth', 0.25, 4, 0.01, 1),
    R('oddCut', 'Odd column cut', 0, 1, 0.01, 0),
    { type: 'hint', tag: 'hintGrowth', text: 'Column growth splits or merges columns every few rows (0.5 halves them). Rows in the same step stay connected.' },
    { type: 'sub', label: 'Radial', show: p => p.layout === 'radial' },
    R('radCX', 'Centre x', 0, 1, 0.01, 0.5, { show: p => p.layout === 'radial' }),
    R('radCY', 'Centre y', 0, 1, 0.01, 0.5, { show: p => p.layout === 'radial' }),
    R('radInner', 'Inner radius', 0, 2, 0.01, 0.3, { show: p => p.layout === 'radial' }),
    R('radOuter', 'Outer radius', 0.1, 3, 0.01, 1.6, { show: p => p.layout === 'radial' }),
    R('radRot', 'Rotation', 0, 360, 0.1, 0, { show: p => p.layout === 'radial' }),
    R('rayWidth', 'Ray width', 0.1, 4, 0.01, 1, { show: p => p.layout === 'radial' }),
  ]},
  { title: 'Source', items: [
    { type: 'select', key: 'mode', label: 'Mode', def: 'noise', options: [['noise', 'Noise'], ['wave', 'Waves'], ['gradient', 'Gradient'], ['image', 'Image / video']] },
    { type: 'sub', label: 'Waves', show: p => p.mode === 'wave' },
    { type: 'select', key: 'waveShape', label: 'Shape', def: 'sine', options: [['sine', 'Sine'], ['triangle', 'Triangle'], ['square', 'Square'], ['saw', 'Saw']], show: p => p.mode === 'wave' },
    R('freqX', 'Frequency x', 0, 20, 0.01, 1.2, { show: p => p.mode === 'wave' }),
    R('freqY', 'Frequency y', -20, 20, 0.01, 0.8, { show: p => p.mode === 'wave' }),
    R('phase', 'Phase', 0, 360, 1, 0, { show: p => p.mode === 'wave' }),
    R('warp', 'Noise warp', 0, 3, 0.01, 0.3, { show: p => p.mode === 'wave' }),
    { type: 'sub', label: 'Gradient', show: p => p.mode === 'gradient' },
    { type: 'select', key: 'gradType', label: 'Type', def: 'linear', options: [['linear', 'Linear'], ['radial', 'Radial']], show: p => p.mode === 'gradient' },

const LS = 'stripe-studio-presets', LSV = 'stripe-studio-variations', LSHV = 'stripe-studio-hidden-vars', LSHP = 'stripe-studio-hidden-presets';

/* Team storage: /api/presets on Vercel (Blob). Falls back to this browser when it isn't there. */

async function teamCall(method, body) {

async function teamDo(label, fn) {

function customVars() {

const varById = id => allVars().find(v => v.id === id);
const baseOfCur = () => { const v = varById(curVar) || {}; return v.builtin ? curVar : (v.base || null); };
function applyState(st) {

}
function selectVar(id) { const v = varById(id); if (!v) return; curVar = id; applyState(v.data); renderVars(); }

{ const vs = allVars(); if (!vs.find(v => v.id === 'stacks') && vs.length) selectVar(vs[0].id); else renderVars(); }
