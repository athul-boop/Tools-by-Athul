<body>
<div class="app">
  <main class="stage">
    <div class="bar">
      <a class="home" href="./">Tools by Athul</a><span class="crumb">/</span><h1>Fold</h1>
      <button class="btn" id="shuffle" type="button">Shuffle colors</button>
      <button class="btn" id="reset" type="button">Reset</button>
    </div>
    <div class="canvas-wrap" id="wrap"><canvas id="out" aria-label="Fold preview. Drag to orbit."></canvas></div>
    <div class="foot">
      <button class="btn" id="play" type="button">Pause</button>
      <input type="range" id="scrub" min="0" max="1000" step="1" value="0" aria-label="Playhead">
      <output id="time">0.0 / 8.0 s</output>
    </div>
  </main>
  <aside class="panel">
    <div id="presets"></div>
    <div id="sections"></div>
  </aside>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const TAU=Math.PI*2,DEG=Math.PI/180;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function ease(n,u){u=Math.min(1,Math.max(0,u));switch(n){case 'in':return u*u*u;case 'out':return 1-Math.pow(1-u,3);case 'inout':return u<0.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;case 'step':return u<1?0:1;case 'back':{const c=1.70158,v=u-1;return 1+(c+1)*v*v*v+c*v*v;}default:return u;}}
let gradDirty=false,underDirty=false,needBG=false;

/* ---------- params ---------- */
const SHAPES={
  horn:{name:'Horn',throat:0.32,mouth:2.8,height:4,curve:2.4},
  funnel:{name:'Funnel',throat:0.25,mouth:2.4,height:3.5,curve:1},
  bowl:{name:'Bowl',throat:0.2,mouth:2.3,height:1.6,curve:0.45},
  tube:{name:'Tube',throat:1.2,mouth:1.2,height:5,curve:1},
  burst:{name:'Burst',throat:0.2,mouth:3.2,height:0.001,curve:1}
};
const BASE={
  shape:'horn',stripes:30,throat:0.32,mouth:2.8,height:4,curve:2.4,stagger:0.22,twist:0,pleat:0.04,gap:0,seed:4,
  pal:['#8a4510','#3a0a1e','#f29be8','#ff6f61','#b89f6e','#d64a8c','#ff4d1a','#6b6b1e'],palOrder:'random',
  acc:['#ff4d1a','#a01478','#ffb3f0','#e8d2a0'],grad:1,gradFreq:1.1,gradSoft:0.55,glow:0.6,glowW:0.14,shine:0.35,shineCol:'#ffd6fb',shineW:0.08,
  shade:0.35,lightAng:-35,ao:0.6,edge:0.25,haze:0,
  bgStyle:'solid',bgA:'#c9bdb6',bgB:'#a99c95',grain:0.06,
  camAz:0,camH:0.92,camOff:0.95,camY:0.15,fov:78,roll:0,
  dur:8,flow:1,shineTravel:1,spin:0,breathe:0.08,pleatWave:0,camSway:0.1,
  kf:{},aspect:'4:5',pngSize:3000,vidSize:1920
};
let P={};function freshP(){return JSON.parse(JSON.stringify(BASE));}

/* ---------- three ---------- */
const out=document.getElementById('out'),octx=out.getContext('2d');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setClearColor(0x000000,0);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(48,1,0.05,200);
const VS=`attribute float aU;attribute float aV;attribute float aId;attribute float aAO;varying float vU,vV,vId,vAO,vD;varying vec3 vN;
void main(){vU=aU;vV=aV;vId=aId;vAO=aAO;vN=normalize(mat3(modelMatrix)*normal);vec4 mv=modelViewMatrix*vec4(position,1.0);vD=-mv.z;gl_Position=projectionMatrix*mv;}`;
const FS=`precision highp float;varying float vU,vV,vId,vAO,vD;varying vec3 vN;
uniform vec3 uPal[8];uniform int uNP;uniform vec3 uAcc[6];uniform int uNA;uniform float uRandOrder,uSeed,uGrad,uGradFreq,uGradSoft,uFlow,uShine,uShineW,uShinePos,uShade,uAO,uEdge,uHaze,uNear,uFar,uGlow,uGlowW;
uniform vec3 uShineCol,uL,uBg;
float h(float x){return fract(sin(x*127.1+uSeed*311.7)*43758.5453);}
vec3 pal(int i){vec3 c=uPal[0];for(int k=0;k<8;k++){if(k==i)c=uPal[k];}return c;}
vec3 acc(int i){vec3 c=uAcc[0];for(int k=0;k<6;k++){if(k==i)c=uAcc[k];}return c;}
void main(){float id=floor(vId+0.5);float h1=h(id),h2=h(id+17.3),h3=h(id+41.9);
int pi=uRandOrder>0.5?int(floor(h1*float(uNP)*0.999)):int(mod(id,float(uNP)));
int pj=int(mod(float(pi)+1.0+floor(h2*float(uNP-1)),float(uNP)));vec3 cA=pal(pi),cB=pal(pj);
float w=0.5+0.5*sin(6.2831*(vV*uGradFreq+h2*1.7+uFlow));float sft=max(0.02,uGradSoft*0.5);
vec3 col=mix(cA,cB,smoothstep(0.5-sft,0.5+sft,w)*uGrad);
float gp=fract(vV*0.9+h3+uFlow*0.5)-0.5;float gl=exp(-gp*gp/(2.0*uGlowW*uGlowW))*uGlow;
col=mix(col,acc(int(floor(h3*float(uNA)*0.999))),clamp(gl,0.0,1.0));
float sp=fract(vV*0.8-uShinePos+h2*0.6)-0.5;float sh=exp(-sp*sp/(2.0*uShineW*uShineW))*uShine*step(0.5,h(id+7.7));col=mix(col,uShineCol,clamp(sh,0.0,1.0));
vec3 n=normalize(vN)*(gl_FrontFacing?1.0:-1.0);float dif=dot(n,normalize(uL))*0.5+0.5;col*=mix(1.0,0.5+0.65*dif,uShade);
col*=1.0-uAO*vAO*0.65;col*=1.0-uEdge*0.4*pow(abs(vU*2.0-1.0),5.0);
float hz=clamp((vD-uNear)/max(0.001,uFar-uNear),0.0,1.0);col=mix(col,uBg,hz*uHaze);
gl_FragColor=vec4(col,1.0);}`;
const mat=new THREE.ShaderMaterial({vertexShader:VS,fragmentShader:FS,side:THREE.DoubleSide,
  uniforms:{uPal:{value:Array.from({length:8},()=>new THREE.Color())},uNP:{value:1},uAcc:{value:Array.from({length:6},()=>new THREE.Color())},uNA:{value:1},
    uRandOrder:{value:1},uSeed:{value:0},uGrad:{value:0},uGradFreq:{value:1},uGradSoft:{value:0.5},uFlow:{value:0},uShine:{value:0},uShineW:{value:0.1},uGlow:{value:0},uGlowW:{value:0.1},uShinePos:{value:0},
    uShade:{value:0.4},uAO:{value:0.5},uEdge:{value:0.3},uHaze:{value:0},uNear:{value:1},uFar:{value:8},uShineCol:{value:new THREE.Color()},uL:{value:new THREE.Vector3(0,1,0)},uBg:{value:new THREE.Color()}}});
let geo=new THREE.BufferGeometry();const mesh=new THREE.Mesh(geo,mat);mesh.frustumCulled=false;scene.add(mesh);
const M=140;let builtN=-1,A=null;
function ensureGeo(N){if(N===builtN)return;builtN=N;const V=N*2*(M+1);
  geo.dispose();geo=new THREE.BufferGeometry();mesh.geometry=geo;
  const pos=new Float32Array(V*3),nrm=new Float32Array(V*3),aU=new Float32Array(V),aV=new Float32Array(V),aId=new Float32Array(V),aAO=new Float32Array(V);
  const idx=new Uint32Array(N*M*6);let q=0;
  for(let i=0;i<N;i++)for(let j=0;j<=M;j++)for(let e=0;e<2;e++){const v=(i*(M+1)+j)*2+e;aU[v]=e;aV[v]=j/M;aId[v]=i;}
  for(let i=0;i<N;i++)for(let j=0;j<M;j++){const o=(i*(M+1)+j)*2;idx[q++]=o;idx[q++]=o+1;idx[q++]=o+2;idx[q++]=o+1;idx[q++]=o+3;idx[q++]=o+2;}
  const dyn=(arr,n)=>{const a=new THREE.BufferAttribute(arr,n);a.setUsage(THREE.DynamicDrawUsage);return a;};
  geo.setAttribute('position',dyn(pos,3));geo.setAttribute('normal',dyn(nrm,3));geo.setAttribute('aAO',dyn(aAO,1));
  geo.setAttribute('aU',new THREE.BufferAttribute(aU,1));geo.setAttribute('aV',new THREE.BufferAttribute(aV,1));geo.setAttribute('aId',new THREE.BufferAttribute(aId,1));
  geo.setIndex(new THREE.BufferAttribute(idx,1));A={pos,nrm,aAO};}
// profile: radius grows from throat to mouth along height
function profile(br){const pts=[];const th=Math.max(0.01,P.throat),mo=Math.max(0.01,P.mouth),H=Math.max(0.001,P.height)*br,cv=Math.max(0.05,P.curve);
  for(let j=0;j<=M;j++){const s=j/M;const r=th+(mo-th)*Math.pow(s,cv);pts.push([r,s*H,Math.pow(1-s,3)]);}return{pts};}
let t=0,phase=0;
function compute(){
  const N=Math.max(3,P.stripes|0);ensureGeo(N);const{pos,nrm,aAO}=A;
  const br=1+P.breathe*0.25*Math.sin(phase);const{pts}=profile(br);const ph=phase;const rng=mulberry(P.seed*91+3);const vmax=[];for(let i=0;i<N;i++)vmax.push(1-P.stagger*rng());
  const edgeR=k=>1+P.pleat*((k%2)?1:-1)*(1+P.pleatWave*Math.sin(ph+k*0.6));
  const spin=P.spin*ph;
  const pw=[];for(let k=0;k<=N;k++)pw.push(edgeR(k));
  for(let i=0;i<N;i++){
    for(let j=0;j<=M;j++){const jj=Math.min(M,j*vmax[i]);const j0=Math.floor(jj),j1=Math.min(M,j0+1),fr=jj-j0;
      const r=pts[j0][0]+(pts[j1][0]-pts[j0][0])*fr,y=pts[j0][1]+(pts[j1][1]-pts[j0][1])*fr,ao=pts[j0][2];const v=jj/M;const tw=P.twist*v*TAU/N;
      const g=P.gap*0.5/N*TAU;const a0=i/N*TAU+g+tw+spin,a1=(i+1)/N*TAU-g+tw+spin;
      const r0=r*pw[i],r1=r*pw[i+1];
      const o=(i*(M+1)+j)*2;
      pos[o*3]=Math.cos(a0)*r0;pos[o*3+1]=y;pos[o*3+2]=Math.sin(a0)*r0;
      pos[o*3+3]=Math.cos(a1)*r1;pos[o*3+4]=y;pos[o*3+5]=Math.sin(a1)*r1;aAO[o]=ao;aAO[o+1]=ao;}
    // flat-across normals
    for(let j=0;j<=M;j++){const o=(i*(M+1)+j)*2;const jp=Math.min(M,j+1),jm=Math.max(0,j-1);const op=(i*(M+1)+jp)*2,om=(i*(M+1)+jm)*2;
      const ax=pos[o*3+3]-pos[o*3],ay=pos[o*3+4]-pos[o*3+1],az=pos[o*3+5]-pos[o*3+2];
      const lx=(pos[op*3]+pos[op*3+3]-pos[om*3]-pos[om*3+3]),ly=(pos[op*3+1]+pos[op*3+4]-pos[om*3+1]-pos[om*3+4]),lz=(pos[op*3+2]+pos[op*3+5]-pos[om*3+2]-pos[om*3+5]);
      let nx=ly*az-lz*ay,ny=lz*ax-lx*az,nz=lx*ay-ly*ax;const l=Math.hypot(nx,ny,nz)||1;nx/=l;ny/=l;nz/=l;
      for(let e=0;e<2;e++){nrm[(o+e)*3]=nx;nrm[(o+e)*3+1]=ny;nrm[(o+e)*3+2]=nz;}}
  }
  geo.attributes.position.needsUpdate=true;geo.attributes.normal.needsUpdate=true;geo.attributes.aAO.needsUpdate=true;
  const u=mat.uniforms;const pal=P.pal.slice(0,8),acc=P.acc.slice(0,6);u.uNP.value=Math.max(1,pal.length);u.uNA.value=Math.max(1,acc.length);
  for(let i=0;i<8;i++)u.uPal.value[i].set(pal[i%Math.max(1,pal.length)]||'#888888');for(let i=0;i<6;i++)u.uAcc.value[i].set(acc[i%Math.max(1,acc.length)]||'#888888');
  u.uRandOrder.value=P.palOrder==='random'?1:0;u.uSeed.value=P.seed;u.uGrad.value=P.grad;u.uGradFreq.value=P.gradFreq;u.uGradSoft.value=P.gradSoft;
  u.uFlow.value=-P.flow*timeX();u.uShine.value=P.shine;u.uGlow.value=P.glow;u.uGlowW.value=Math.max(0.01,P.glowW);u.uShineW.value=Math.max(0.01,P.shineW);u.uShinePos.value=P.shineTravel*timeX();u.uShineCol.value.set(P.shineCol);
  u.uShade.value=P.shade;u.uAO.value=P.ao;u.uEdge.value=P.edge;u.uHaze.value=P.haze;u.uBg.value.set(P.bgA);
  const la=P.lightAng*DEG;u.uL.value.set(Math.sin(la),0.8,Math.cos(la));
  // camera: sits inside near the mouth and looks toward the throat
  const H=Math.max(0.001,P.height),az=(P.camAz+P.camSway*10*Math.sin(phase))*DEG;
  camera.position.set(Math.sin(az)*P.camOff,P.camH*H+0.6,Math.cos(az)*P.camOff);
  camera.fov=P.fov;camera.aspect=RW/RH;camera.up.set(0,1,0);camera.lookAt(0,P.camY*H,0);camera.rotateZ(P.roll*DEG);camera.updateProjectionMatrix();

  u.uNear.value=Math.max(0.1,d-2);u.uFar.value=d+3;
}

/* ---------- render ---------- */
let RW=800,RH=1000,needRender=true,resizeNeeded=true;
function aspectWH(){const[a,b]=P.aspect.split(':').map(Number);return a/b;}
function setSize(W,H){RW=W;RH=H;renderer.setSize(W,H,false);out.width=W;out.height=H;needRender=true;}
function fitPreview(){const wrap=document.getElementById('wrap'),cs=getComputedStyle(wrap);
  const aw=wrap.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),ah=wrap.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const a=aspectWH();let w=aw,h=aw/a;if(h>ah){h=ah;w=ah*a;}w=Math.max(60,Math.floor(w));h=Math.max(60,Math.floor(h));out.style.width=w+'px';out.style.height=h+'px';
  const dpr=Math.min(2,window.devicePixelRatio||1);let W=Math.round(w*dpr),H=Math.round(h*dpr);const cap=1800/Math.max(W,H);if(cap<1){W=Math.round(W*cap);H=Math.round(H*cap);}
  setSize(W,H);resizeNeeded=false;}
function exportDims(long){const a=aspectWH();let W,H;if(a<1){H=long;W=Math.round(long*a);}else{W=long;H=Math.round(long/a);}return[W&~1,H&~1];}
function timeX(){return((t%P.dur)+P.dur)%P.dur/P.dur;}
let grainCv=null;function grain(){if(grainCv)return grainCv;grainCv=document.createElement('canvas');grainCv.width=grainCv.height=256;const c=grainCv.getContext('2d');const d=c.createImageData(256,256);
  for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}c.putImageData(d,0,0);return grainCv;}
function renderFrame(){
  phase=TAU*timeX();const x=timeX(),saved={};for(const k in P.kf){const v=kfValue(P.kf[k],x);if(v!==null){saved[k]=P[k];P[k]=v;}}
  try{compute();renderer.render(scene,camera);const W=RW,H=RH;octx.setTransform(1,0,0,1,0,0);octx.globalAlpha=1;octx.globalCompositeOperation='source-over';
    if(P.bgStyle==='linear'){const g=octx.createLinearGradient(0,0,0,H);g.addColorStop(0,P.bgA);g.addColorStop(1,P.bgB);octx.fillStyle=g;}
    else if(P.bgStyle==='radial'){const g=octx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.7);g.addColorStop(0,P.bgA);g.addColorStop(1,P.bgB);octx.fillStyle=g;}else octx.fillStyle=P.bgA;

let last=performance.now(),playing=!window.matchMedia('(prefers-reduced-motion: reduce)').matches,recording=false;
const scrub=document.getElementById('scrub'),timeOut=document.getElementById('time');
function tick(now){requestAnimationFrame(tick);const dt=Math.min(0.1,(now-last)/1000);last=now;
  if(resizeNeeded&&!recording)fitPreview();if(playing){t+=dt;needRender=true;}if(!needRender)return;needRender=false;renderFrame();
  const x=timeX();if(document.activeElement!==scrub)scrub.value=Math.round(x*1000);timeOut.textContent=(x*P.dur).toFixed(1)+' / '+P.dur.toFixed(1)+' s';
  document.querySelectorAll('.lane b').forEach(b=>{b.style.left=(x*100)+'%';});}
function kfValue(tr,x){const ks=tr.keys;if(!ks.length)return null;if(x<=ks[0].t)return ks[0].v;
  for(let j=0;j<ks.length-1;j++){const a=ks[j],b=ks[j+1];if(x<=b.t){const u=(x-a.t)/((b.t-a.t)||1);return a.v+(b.v-a.v)*ease(a.e,u);}}return ks[ks.length-1].v;}

/* ---------- saving ---------- */
let statusEl=null;function status(s){if(statusEl)statusEl.textContent=s;}
async function saveFile(name,blob){
  if(window.claude&&typeof window.claude.use==='function'){let d=null;try{d=await window.claude.use('downloads');}catch(e){d=null;}
    if(!d){status('Saving isn’t available in this view.');return;}
    try{await d.save({filename:name,data:blob});status('Saved '+name);}catch(e){const c=e&&e.code;status(c==='declined'?'Save cancelled.':c==='rate_limited'?'Another save is open. Try again in a moment.':c==='too_large'?'File too large here. Try a smaller size.':'Saving isn’t available in this view.');}return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();status('Saved '+name);}
function exportPNG(){if(recording)return;const[W,H]=exportDims(+P.pngSize);status('Rendering '+W+' × '+H+'…');
  setTimeout(()=>{setSize(W,H);renderFrame();out.toBlob(b=>{resizeNeeded=true;needRender=true;if(!b){status('PNG export failed at this size. Try a smaller size.');return;}saveFile('fold.png',b);},'image/png');},30);}
function record(btn){
  if(recording)return;if(!out.captureStream||!window.MediaRecorder){status('Video recording isn’t supported in this browser. Try Chrome or Edge.');return;}
  const types=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'];const mime=types.find(m=>MediaRecorder.isTypeSupported(m));if(!mime){status('This browser can’t encode video.');return;}
  const ext=mime.startsWith('video/mp4')?'mp4':'webm';const[W,H]=exportDims(+P.vidSize);recording=true;setSize(W,H);t=0;playing=true;syncPlay();
  const rec=new MediaRecorder(out.captureStream(30),{mimeType:mime,videoBitsPerSecond:28e6});const chunks=[];
  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  rec.onstop=()=>{recording=false;resizeNeeded=true;btn.disabled=false;btn.textContent='Record loop';saveFile('fold-loop.'+ext,new Blob(chunks,{type:mime.split(';')[0]}));};
  rec.start(250);btn.disabled=true;const t0=performance.now();
  const iv=setInterval(()=>{const s=(performance.now()-t0)/1000;btn.textContent='Recording '+s.toFixed(1)+' / '+P.dur+' s';if(s>=P.dur){clearInterval(iv);rec.stop();}},100);

/* ---------- UI ---------- */
const R=(k,l,min,max,step,extra)=>Object.assign({k,l,t:'range',min,max,step},extra||{});
const NOKF=new Set(['dur','seed','stripes','flow','shineTravel','spin']);
const RERENDER=new Set(['bgStyle']);
function sections(){return[
  {id:'shape',title:'Shape',items:[
    {k:'shape',l:'Form',t:'seg',o:Object.entries(SHAPES).map(([k,v])=>[k,v.name])},
    R('stripes','Panels',4,96,1),R('throat','Throat width',0.02,2.5,0.01),R('mouth','Mouth width',0.02,5,0.01),R('height','Depth',0,8,0.01),R('curve','Flare curve',0.2,5,0.01),
    R('stagger','Rim stagger',0,0.8,0.01),R('twist','Twist',-8,8,0.01),R('pleat','Pleat fold',0,0.4,0.005),R('gap','Gap between panels',0,0.8,0.01)]},
  {id:'color',title:'Colors and gradients',items:[
    {t:'extract'},
    {t:'stops',k:'pal',l:'Panel colors'},{k:'palOrder',l:'Order',t:'seg',o:[['random','Shuffled'],['sequence','In order']]},R('seed','Shuffle seed',1,99,1),
    R('grad','Panel gradient',0,1,0.01),R('gradFreq','Gradient bands',0.2,5,0.01),R('gradSoft','Gradient softness',0,1,0.01),

function extractPalette(im){
  const S=90,sc=Math.min(1,S/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(im.width*sc));cv.height=Math.max(1,Math.round(im.height*sc));
  const c=cv.getContext('2d');c.drawImage(im,0,0,cv.width,cv.height);const d=c.getImageData(0,0,cv.width,cv.height).data;const px=[];
  for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;px.push([d[i],d[i+1],d[i+2]]);}
  if(px.length<8)throw new Error('few');
  const kmeans=(k)=>{const rng=mulberry(7);const cent=[px[Math.floor(rng()*px.length)].slice()];
    while(cent.length<k){let tot=0;const dd=px.map(p=>{let m=1e12;for(const c0 of cent){const a=p[0]-c0[0],b=p[1]-c0[1],e=p[2]-c0[2];m=Math.min(m,a*a+b*b+e*e);}tot+=m;return m;});
      let r=rng()*tot,ix=0;for(;ix<px.length-1;ix++){r-=dd[ix];if(r<=0)break;}cent.push(px[ix].slice());}
    let cnt=new Array(k).fill(0);
    for(let it=0;it<14;it++){const sum=cent.map(()=>[0,0,0]);cnt=new Array(k).fill(0);
      for(const p of px){let bi=0,bd=1e12;for(let j=0;j<k;j++){const a=p[0]-cent[j][0],b=p[1]-cent[j][1],e=p[2]-cent[j][2];const q=a*a+b*b+e*e;if(q<bd){bd=q;bi=j;}}
        sum[bi][0]+=p[0];sum[bi][1]+=p[1];sum[bi][2]+=p[2];cnt[bi]++;}
      for(let j=0;j<k;j++)if(cnt[j])cent[j]=[sum[j][0]/cnt[j],sum[j][1]/cnt[j],sum[j][2]/cnt[j]];}
    return cent.map((c0,j)=>({c:c0,n:cnt[j]})).filter(x=>x.n>0);};
  const hex=c0=>'#'+c0.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
  const main=kmeans(8).sort((a,b)=>b.n-a.n);
  const vivid=kmeans(12).map(x=>{const col=new THREE.Color(x.c[0]/255,x.c[1]/255,x.c[2]/255);const h={};col.getHSL(h);return{x,score:h.s*(1-Math.abs(h.l-0.55))*Math.sqrt(x.n)};})
    .sort((a,b)=>b.score-a.score).slice(0,4).map(o=>o.x);
  P.pal=main.map(x=>hex(x.c));P.acc=vivid.map(x=>hex(x.c));
}

function makePresets(cfg){

    if(tab==='mine'){const i=mine.findIndex(p=>p.name===name);if(i>=0){mine[i]=snap;msg='Updated '+name+'.';}else{mine.push(snap);msg='Saved '+name+'.';}persist();render();return;}
    const by=getName().trim();if(!by){msg='Add your name first, so the team knows who saved it.';render();return;}
    snap.by=by;busy=true;msg='Saving to team…';render();
    try{const j=await api('POST',{preset:snap});const old=team.filter(p=>p.name===name&&p.by===by);
      for(const o of old){try{await api('DELETE',null,'&id='+encodeURIComponent(o.id));}catch(e){}}
      team=team.filter(p=>!old.includes(p)).concat([j.preset]);msg=(old.length?'Updated ':'Shared ')+name+' with the team.';}

    try{await api('DELETE',null,'&id='+encodeURIComponent(p.id));team.splice(ix,1);msg='Deleted '+p.name+' from team presets.';}catch(e){msg=e.message;}

    body.append(tabs);

    const note=t=>{const p=document.createElement('p');p.className='note';p.textContent=t;chips.append(p);};
    if(tab==='team'&&teamState==='loading')note('Loading team presets…');
    else if(tab==='team'&&teamState==='off')note('Team presets work on the hosted site. Here you can use Mine, or Export and Import files.');
    else if(tab==='team'&&teamState==='error')note('Team presets couldn’t load.');

    if(canTeam){const row=document.createElement('div');row.className='prow';const inp=document.createElement('input');inp.type='text';inp.placeholder='Preset name';inp.setAttribute('aria-label','Preset name');
      const sv=document.createElement('button');sv.type='button';sv.className='btn';sv.textContent=tab==='mine'?'Save':'Share';sv.disabled=busy;
      const go=()=>{if(busy)return;const name=(inp.value||'').trim()||('Preset '+(list.length+1));armed=null;save(name);};
      sv.addEventListener('click',go);inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});row.append(inp,sv);body.append(row);}
    if(tab==='mine'){const row2=document.createElement('div');row2.className='prow two';
      const ex=document.createElement('button');ex.type='button';ex.className='btn';ex.textContent='Export';ex.disabled=!mine.length;
      ex.addEventListener('click',()=>{saveFile(cfg.key+'-presets.json',new Blob([JSON.stringify({tool:cfg.key,version:1,presets:mine},null,1)],{type:'application/json'}));msg='Exported '+mine.length+' preset'+(mine.length===1?'':'s')+'.';render();});
      const im=document.createElement('button');im.type='button';im.className='btn';im.textContent='Import';
      const fi=document.createElement('input');fi.type='file';fi.accept='application/json,.json';fi.hidden=true;im.addEventListener('click',()=>fi.click());
      fi.addEventListener('change',()=>{const f=fi.files&&fi.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);const arr=Array.isArray(data)?data:data.presets;
          if(!Array.isArray(arr))throw 0;if(data.tool&&data.tool!==cfg.key){msg='Those presets are for '+data.tool+', not this tool.';render();return;}
          let n=0;for(const p of arr){if(!p||!p.P)continue;const i=mine.findIndex(q=>q.name===p.name);if(i>=0)mine[i]=p;else mine.push(p);n++;}
          persist();msg='Imported '+n+' preset'+(n===1?'':'s')+'.';}catch(e){msg='That file isn’t a presets file.';}render();};r.readAsText(f);fi.value='';});
      row2.append(ex,im,fi);body.append(row2);}
    const st=document.createElement('p');st.className='note';st.setAttribute('role','status');st.textContent=msg;body.append(st);
    d.append(body);box.append(d);
  }
  render();
}
function loadImgURL(url,cb){const im=new Image();im.onload=()=>{const cv=document.createElement('canvas');cv.width=im.width;cv.height=im.height;cv.getContext('2d').drawImage(im,0,0);cb(cv);};im.src=url;}
P=freshP();renderPanel();syncPlay();
makePresets({key:'fold-studio',snapshot:()=>({P:JSON.parse(JSON.stringify(P))}),
  restore:s=>{if(recording)return;P=Object.assign(freshP(),s.P);P.kf=P.kf||{};selKey={};needRender=true;resizeNeeded=true;renderPanel();}});
requestAnimationFrame(tick);
})();

</script>
